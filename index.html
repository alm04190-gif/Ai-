<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #0088cc;
            --accent-hover: #0077b3;
            --text: #ffffff;
            --text-secondary: #888888;
            --purple-glow: rgba(160, 32, 240, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Rain Animation CSS (Now Purple) --- */
        .rain-drop {
            position: fixed;
            top: -10vh;
            width: 2px;
            height: 15px;
            background: linear-gradient(transparent, rgba(160, 32, 240, 0.6)); /* পার্পল রেইন */
            z-index: 0;
            animation: fall linear forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 8px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section { margin-bottom: 20px; position: relative; z-index: 10; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* --- Floating Draft Area with Purple Shadow (Untouched) --- */
        .draft-area {
            width: 100%;
            min-height: 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px var(--purple-glow);
            animation: floatBox 3.5s ease-in-out infinite;
        }

        @keyframes floatBox {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(160, 32, 240, 0.6); }
            100% { transform: translateY(0px); }
        }

        .draft-area:focus {
            outline: none;
            border-color: #a020f0;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.8);
        }

        .draft-area::placeholder { color: #555; }

        /* --- Category Section (New) --- */
        .category-hint {
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 12px;
            font-style: italic;
        }

        .category-row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 10px 5px 25px 5px; /* Bottom padding for floating shadow */
            margin-bottom: 5px;
            scrollbar-width: none; /* Firefox scrollbar hide */
        }
        .category-row::-webkit-scrollbar { display: none; /* Chrome scrollbar hide */ }

        .category-item {
            flex: 0 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7); /* ফুল হোয়াইট শ্যাডো */
            animation: floatBox 3s ease-in-out infinite; /* হাওয়ায় ভাসবে */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
        }

        .category-item:active { transform: scale(0.9); }
        
        .category-item.active-cat {
            border-color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 1); /* সিলেক্ট করলে শ্যাডো আরো উজ্জ্বল হবে */
            background: rgba(255, 255, 255, 0.1);
        }

        .category-item img {
            width: 34px; /* নিচের ইমোজির (26px) চেয়ে বড় */
            height: 34px;
            object-fit: contain;
            pointer-events: none;
        }

        .category-item span {
            font-size: 11px;
            margin-top: 6px;
            color: #fff;
            font-weight: 600;
        }

        /* --- Expandable Emoji Section --- */
        .emoji-wrapper {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            overflow: hidden;
        }

        .emoji-scroll-area {
            max-height: 145px; 
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .emoji-scroll-area.expanded {
            max-height: 50vh; 
            overflow-y: auto;
        }

        .emoji-fade {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--surface));
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .emoji-scroll-area.expanded + .emoji-fade {
            opacity: 0; 
        }

        /* --- Smaller Emojis --- */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); 
            gap: 8px;
        }

        .emoji-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 4px; 
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .emoji-item:active {
            transform: scale(0.90);
            border-color: var(--accent);
            background: rgba(160, 32, 240, 0.2);
        }

        .emoji-item img {
            width: 26px; 
            height: 26px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            pointer-events: none;
        }

        .emoji-item .label {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Expand Button */
        .toggle-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            padding-top: 12px;
            cursor: pointer;
            border-top: 1px solid var(--border);
            margin-top: 5px;
        }
        
        .toggle-btn span { margin-right: 5px; }

        .loading, .empty, .error {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-secondary);
            font-size: 13px;
            grid-column: 1 / -1;
        }

        .error { color: #ff4444; }

        .send-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            padding: 16px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .send-btn button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3);
        }

        .send-btn button:active { background: var(--accent-hover); transform: scale(0.98); }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type your post here... Tap emojis below to insert them."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Emoji Categories</div>
        <div class="category-hint">👇 Click an emoji below to select category/section</div>
        <div class="category-row" id="categoryRow">
            </div>
    </div>

    <div class="section">
        <div class="section-title">Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid">
                    <div class="loading">Loading emojis...</div>
                </div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis</span> <span id="toggleIcon">🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send to Bot</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const categoryRow = document.getElementById('categoryRow');
        
        let allEmojisData = []; // সব ইমোজি সেভ রাখার জন্য
        let emojiMap = {};
        let emojiCounter = 1;

        // --- Rain Animation Logic (Purple) ---
        function createRainDrop() {
            const drop = document.createElement('div');
            drop.classList.add('rain-drop');
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            drop.style.opacity = Math.random() * 0.5 + 0.1;
            document.body.appendChild(drop);
            
            setTimeout(() => { drop.remove(); }, 2500);
        }
        setInterval(createRainDrop, 100); 

        // --- Emoji Toggle Logic ---
        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis";
                toggleIcon.textContent = "🔼";
            } else {
                toggleText.textContent = "Show All Emojis";
                toggleIcon.textContent = "🔽";
                emojiArea.scrollTop = 0; 
            }
        }

        draft.addEventListener('input', () => {
            charCount.textContent = draft.value.length + ' chars';
        });

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }

            try {
                const res = await fetch(`${apiBase}/api/emojis`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                
                allEmojisData = await res.json(); // ডাটা সেভ রাখলাম

                if (allEmojisData.length === 0) {
                    keyboard.innerHTML = '<div class="empty">No emojis in database.<br>Ask admin to add some!</div>';
                    return;
                }

                buildCategories(allEmojisData);
                renderEmojiGrid(allEmojisData); // শুরুতে সব দেখাবে

            } catch (err) {
                keyboard.innerHTML = '<div class="error">❌ Failed to load emojis.<br>Check API connection.</div>';
                console.error(err);
            }
        }

        // --- Category Builder Logic ---
        function buildCategories(data) {
            categoryRow.innerHTML = '';
            const catMap = {};

            // সিম্বল অনুযায়ী গ্রুপ করা
            data.forEach(e => {
                const sym = e.symbol || '⭐';
                if (!catMap[sym]) {
                    catMap[sym] = e; // রিপ্রেজেন্টেটিভ ইমোজি সেভ করলাম
                }
            });

            // "All" ক্যাটাগরি বাটন
            const allBtn = document.createElement('div');
            allBtn.className = 'category-item active-cat';
            allBtn.innerHTML = `<div style="font-size: 28px; line-height:34px;">🌐</div><span>All</span>`;
            allBtn.onclick = () => {
                document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
                allBtn.classList.add('active-cat');
                renderEmojiGrid(allEmojisData);
            };
            categoryRow.appendChild(allBtn);

            // ডাটাবেজের সিম্বল অনুযায়ী ক্যাটাগরি তৈরি
            Object.keys(catMap).forEach(sym => {
                const repEmoji = catMap[sym];
                const div = document.createElement('div');
                div.className = 'category-item';
                
                div.onclick = () => {
                    // একটিভ ক্লাস অ্যাড করা
                    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
                    div.classList.add('active-cat');
                    
                    // ফিল্টার করা
                    const filtered = allEmojisData.filter(e => (e.symbol || '⭐') === sym);
                    renderEmojiGrid(filtered);

                    // ফিল্টার করলে অটোমেটিক লিস্ট এক্সপান্ড করে দেওয়া যাতে ইউজার সব দেখতে পায়
                    if (!emojiArea.classList.contains('expanded')) {
                        toggleEmojiList();
                    }
                };

                const img = document.createElement('img');
                img.src = repEmoji.image_url;
                img.loading = 'lazy';

                const span = document.createElement('span');
                span.textContent = sym;

                div.appendChild(img);
                div.appendChild(span);
                categoryRow.appendChild(div);
            });
        }

        // --- Emoji Grid Renderer ---
        function renderEmojiGrid(dataToRender) {
            keyboard.innerHTML = '';
            if (dataToRender.length === 0) {
                keyboard.innerHTML = '<div class="empty">No emojis found in this category.</div>';
                return;
            }

            dataToRender.forEach((emoji) => {
                const div = document.createElement('div');
                div.className = 'emoji-item';
                div.title = emoji.type === 'mapped' ? `${emoji.symbol} (${emoji.id})` : emoji.id;

                const img = document.createElement('img');
                img.src = emoji.image_url;
                img.alt = emoji.symbol || emoji.id;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.style.opacity = '0.3';
                    this.parentElement.style.cursor = 'not-allowed';
                };

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = emoji.symbol || emoji.id.slice(-6);

                div.appendChild(img);
                div.appendChild(label);
                div.onclick = () => insertEmoji(emoji);
                keyboard.appendChild(div);
            });
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;

            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;

            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));

            if (Telegram.HapticFeedback) {
                Telegram.HapticFeedback.impactOccurred('light');
            }
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) {
                Telegram.showAlert('Please write something first!');
                return;
            }

            for (let code in emojiMap) {
                text = text.split(code).join(emojiMap[code]);
            }

            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
