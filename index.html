<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Post Studio Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #f0f4f9;
            --bg- ambient: radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 45%),
                           radial-gradient(circle at 85% 90%, rgba(99, 102, 241, 0.12), transparent 45%);
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-3: #eef2f6;
            --border: rgba(15, 23, 42, 0.09);
            --border-highlight: rgba(37, 99, 235, 0.35);
            --accent: #2563eb;
            --accent-2: #7c3aed;
            --accent-cyan: #06b6d4;
            --text: #0f172a;
            --text-muted: #64748b;
            --glow: rgba(37, 99, 235, 0.12);
            --shadow-card: 0 8px 24px -4px rgba(15, 23, 42, 0.06);
            --shadow-btn: 0 10px 25px -4px rgba(37, 99, 235, 0.45);
        }

        [data-theme="dark"] {
            --bg-main: #06080f;
            --bg-ambient: radial-gradient(circle at 10% 5%, rgba(56, 189, 248, 0.12), transparent 40%),
                          radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.12), transparent 40%),
                          radial-gradient(circle at 50% 95%, rgba(37, 99, 235, 0.10), transparent 45%);
            --surface: #0f131f;
            --surface-2: #161b2c;
            --surface-3: #1e253a;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.45);
            --accent: #38bdf8;
            --accent-2: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glow: rgba(56, 189, 248, 0.15);
            --shadow-card: 0 10px 30px -6px rgba(0, 0, 0, 0.65);
            --shadow-btn: 0 10px 28px -4px rgba(56, 189, 248, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Viewport Lock - Prevents Whole Page Bouncing/Scrolling */
        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-main);
            background-image: var(--bg-ambient);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 540px;
            margin: 0 auto;
            padding: 10px 12px 12px 12px;
            gap: 8px;
            position: relative;
            z-index: 5;
        }

        /* ================= HEADER ================= */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 9px 12px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 40;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand- logo {
            width: 28px;
            height: 28px;
            border-radius: 9px;
            background: linear-gradient(135deg, #38bdf8, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.4);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-pill b {
            color: var(--accent);
            font-weight: 800;
        }

        .icon-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 31px;
            height: 31px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.12s, border-color 0.15s;
        }
        .icon-btn:active {
            transform: scale(0.88);
            border-color: var(--accent);
        }

        /* Dropdown Menu */
        .settings-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border-highlight);
            border-radius: 14px;
            box-shadow: var(--shadow-card);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 165px;
            z-index: 100;
        }
        .settings-menu.show { display: flex; }
        .settings-item {
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: none;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .settings-item:active { background: var(--glow); color: var(--accent); }

        /* ================= VIEWS ================= */
        .main-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 8px;
        }
        .history-view {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 10px;
        }

        /* ================= DRAFT STUDIO CARD ================= */
        .editor-card {
            flex-shrink: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 10px 12px 8px 12px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-card:focus-within {
            border-color: var(--border-highlight);
            box-shadow: 0 0 0 3px var(--glow), var(--shadow-card);
        }

        .draft-area {
            width: 100%;
            min-height: 68px;
            max-height: 112px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.55;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            outline: none;
            word-wrap: break-word;
            user-select: text;
            padding-right: 2px;
        }
        .draft-area::-webkit-scrollbar { width: 3px; }
        .draft-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .draft-area:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            opacity: 0.65;
            font-size: 14px;
            pointer-events: none;
        }

        .inline-premium-emoji {
            width: 22px;
            height: 22px;
            vertical-align: -5px;
            margin: 0 1.5px;
            object-fit: contain;
            display: inline-block;
            pointer-events: none;
        }

        .draft-area b { font-weight: 800; }
        .draft-area i { font-style: italic; }
        .draft-area u { text-decoration: underline; }
        .draft-area s { text-decoration: line-through; }
        .draft-area code {
            background: var(--surface-3);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            color: var(--accent);
        }
        .draft-area tg-spoiler {
            background: var(--text-muted);
            color: transparent;
            border-radius: 4px;
            padding: 0 3px;
        }
        .draft-area blockquote {
            border-left: 3px solid var(--accent);
            background: var(--surface-2);
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 0 6px 6px 0;
            color: var(--text-muted);
            display: block;
        }

        /* Formatting Dock */
        .format-toolbar {
            display: flex;
            align-items: center;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 5px;
            scrollbar-width: none;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .format-toolbar::-webkit-scrollbar { display: none; }

        .format-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: transform 0.1s, background 0.15s, border-color 0.15s;
        }
        .format-btn:active {
            transform: scale(0.92);
            background: var(--glow);
            border-color: var(--accent);
            color: var(--accent);
        }
        .format-btn.kbd-pill {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(139, 92, 246, 0.15));
            border-color: var(--border-highlight);
            color: var(--accent);
        }

        /* ================= EMOJI STUDIO VAULT ================= */
        .vault-card {
            flex: 1;
            min-height: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        /* Search Box */
        .search-row {
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 11px;
            font-size: 13px;
            color: var(--accent);
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 8px 88px 8px 32px;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }
        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .search-meta {
            position: absolute;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .match-count {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            background: var(--glow);
            padding: 3px 6px;
            border-radius: 6px;
            display: none;
        }
        .match-count.visible { display: inline-block; }

        .search-clear {
            background: var(--surface-3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            cursor: pointer;
            display: none;
        }
        .search-clear.visible { display: inline-block; }

        /* Quick Filter Tag Chips */
        .quick-chips {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 6px;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .quick-chips::-webkit-scrollbar { display: none; }

        .chip-btn {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 99px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
        }
        .chip-btn.active-chip {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.35);
        }
        .chip-btn:active { transform: scale(0.93); }

        /* Pack Category Strip */
        .category-row {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 7px;
            padding: 2px 1px;
            scrollbar-width: none;
        }
        .category-row::-webkit-scrollbar { display: none; }

        .category-item {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            padding: 5px 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: border-color 0.15s, background 0.15s, transform 0.12s;
        }
        .category-item.active-cat {
            border-color: var(--accent);
            background: var(--glow);
        }
        .category-item:active { transform: scale(0.94); }
        .category-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            pointer-events: none;
        }
        .category-item .normal-emoji {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .category-item.active-cat .normal-emoji {
            color: var(--text);
        }

        /* Emoji Grid Area */
        .emoji-scroll-area {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }
        .emoji-scroll-area::-webkit-scrollbar { width: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 7px;
            padding-bottom: 10px;
        }

        .emoji-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 6px 3px 4px 3px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 56px;
            contain: content;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
        }
        .emoji-item:active {
            transform: scale(0.84);
            border-color: var(--accent);
            background: var(--glow);
        }
        .emoji-item img {
            width: 29px;
            height: 29px;
            object-fit: contain;
            pointer-events: none;
        }
        .emoji-item .label {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 92%;
            text-align: center;
            font-weight: 600;
        }

        . state-msg {
            text-align: center;
            padding: 28px 10px;
            color: var(--text-muted);
            font-size: 13px;
            grid-column: 1 / -1;
            font-weight: 600;
        }

        /* ================= SEND BUTTON ================= */
        .send-btn-wrapper {
            flex-shrink: 0;
            width: 100%;
        }
        .send-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 55%, #06b6d4 100%);
            color: #ffffff;
            border: none;
            border-radius: 15px;
            padding: 13px;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: transform 0.12s, filter 0.15s;
        }
        .send-btn:active {
            transform: scale(0.97);
            filter: brightness(1.1);
        }
        .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* ================= HISTORY VIEW ================= */
        .history-list-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding-right: 3px;
        }
        .history-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 12px 14px;
            margin-bottom: 9px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
        }
        .history-card:active { border-color: var(--accent); background: var(--glow); }
        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .history-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            word-wrap: break-word;
        }
        .history-actions {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }
        .btn-secondary {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- HEADER -->
        <div class="top-bar">
            <div class="brand-wrap">
                <div class="brand-logo">✨</div>
                <div class="brand-title">Post Studio Pro</div>
            </div>

            <div class="top-actions">
                <div class="stat-pill"><b id="emojiCountBadge">0</b> ⭐</div>
                <div class="stat-pill"><b id="charCount">0</b> ch</div>
                <button class="icon-btn" onclick="showHistory()" title="History">🕒</button>
                <button class="icon-btn" onclick="toggleSettings()" title="Menu">⚙️</button>
            </div>

            <div class="settings-menu" id="settingsMenu">
                <button class="settings-item" onclick="toggleTheme()">🌗 Switch Theme</button>
                <button class="settings-item" onclick="showHistory()">🕒 Saved History</button>
                <button class="settings-item" onclick="clearDraft()">🧹 Clear Editor</button>
            </div>
        </div>

        <!-- MAIN EDITOR VIEW -->
        <div id="mainView" class="main-view">
            <!-- Draft Editor -->
            <div class="editor-card">
                <div class="draft-area" id="draft" contenteditable="true" data-placeholder="Write your post here... Tap any premium emoji below to insert!"></div>

                <div class="format-toolbar" id="formatToolbar">
                    <button class="format-btn kbd-pill" type="button" onmousedown="event.preventDefault()" onclick="toggleKeyboard()">⌨️ Keyboard</button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('b')"><b>B</b></button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('i')"><i>I</i></button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('u')"><u>U</u></button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('s')"><s>S</s></button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('code')">Mono</button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('tg-spoiler')">Spoiler</button>
                    <button class="format-btn" type="button" onmousedown="event.preventDefault()" onclick="applyFormat('blockquote')">Quote</button>
                </div>
            </div>

            <!-- Emoji Vault -->
            <div class="vault-card">
                <!-- Search Input -->
                <div class="search-row">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="emojiSearchInput" class="search-input" placeholder="Search YouTube, YT, FB, Binance, Star, Bank..." autocomplete="off" spellcheck="false">
                    <div class="search-meta">
                        <span id="matchCountBadge" class="match-count">0</span>
                        <button type="button" id="searchClearBtn" class="search-clear" onclick="clearSearch()">✕</button>
                    </div>
                </div>

                <!-- One-Tap Quick Filter Chips -->
                <div class="quick-chips" id="quickChips">
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick=" runQuickChip('youtube', this)">▶️ YouTube</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('telegram', this)">✈️ Telegram</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('binance', this)">🟡 Binance</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('facebook', this)">📘 Facebook</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('tiktok', this)">🎵 TikTok</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('verified', this)">✅ Verified</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('star', this)">⭐ Star</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('fire', this)">🔥 Fire</button>
                    <button type="button" class="chip-btn" onmousedown="event.preventDefault()" onclick="runQuickChip('laugh', this)">😂 Funny</button>
                </div>

                <!-- Pack Categories -->
                <div class="category-row" id="categoryRow"></div>

                <!-- Emoji Grid -->
                <div class="emoji-scroll-area" id="emojiArea">
                    <div id="emojiKeyboard" class="emoji-grid"></div>
                </div>
            </div>

            <!-- Send CTA -->
            <div class="send-btn-wrapper">
                <button class="send-btn" id="sendBtn" onclick="sendData()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    Send to Bot
                </button>
            </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="historyView" class="history-view">
            <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px;">🕒 SAVED POST HISTORY</div>
            <div id="historyList" class="history-list-scroll"></div>
            <div class="history-actions">
                <button class="btn-secondary" onclick="showMain()">🏠 Back to Studio</button>
                <button class="btn-danger" onclick="clearHistory()">🗑 Clear All</button>
            </div>
        </div>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        // Theme Setup
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function toggleSettings() {
            document.getElementById('settingsMenu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.top-bar')) {
                document.getElementById('settingsMenu').classList.remove('show');
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = (urlParams.get('api') || "").replace(/\/$/, "");

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiCountBadge = document.getElementById('emojiCountBadge');
        const emojiArea = document.getElementById('emojiArea');
        const categoryRow = document.getElementById('categoryRow');
        const searchInput = document.getElementById('emojiSearchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const matchCountBadge = document.getElementById('matchCountBadge');

        let savedRange = null;
        let allEmojis = [];
        let emojiById = {};
        let catMap = {};
        let activeCategory = null;
        let currentRenderList = [];
        let renderedCount = 0;
        const CHUNK_SIZE = 36; // Small initial batch for 0ms lag

        const imageBlobCache = {};
        const TRANSPARENT_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        // Smart Alias Dictionary
        const SEARCH_ALIASES = {
            "yt": ["youtube", "yt", "video", "play", "red"],
            "youtube": ["youtube", "yt", "video", "play"],
            "fb": ["facebook", "fb", "meta"],
            "facebook": ["facebook", "fb", "meta"],
            "tg": ["telegram", "tg", "plane"],
            "telegram": ["telegram", "tg", "plane"],
            "ig": ["instagram", "ig", "insta"],
            "insta": ["instagram", "ig"],
            "wa": ["whatsapp", "wa", "chat", "green"],
            "bnb": ["binance", "bnb", "crypto", "coin"],
            "binance": ["binance", "bnb", "crypto"],
            "btc": ["bitcoin", "btc", "crypto", "coin"],
            "tt": ["tiktok", "tt", "music"],
            "tiktok": ["tiktok", "tt"],
            "nf": ["netflix", "movie"],
            "verified": ["verified", "tick", "check", "blue", "badge"],
            "tick": ["verified", "tick", "check"],
            "star": ["star", "gold", "premium", "sparkle"],
            "fire": ["fire", "hot", "flame", "lit"],
            "laugh": ["laugh", "funny", "haha", "lol", "joy", "smile"]
        };

        // Cursor Tracker
        function saveCurrentSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const r = sel.getRangeAt(0);
                if (draft.contains(r.commonAncestorContainer)) {
                    savedRange = r.cloneRange();
                }
            }
        }
        document.addEventListener('selectionchange', saveCurrentSelection);
        draft.addEventListener('keyup', saveCurrentSelection);
        draft.addEventListener('mouseup', saveCurrentSelection);
        draft.addEventListener('touchend', saveCurrentSelection);

        function toggleKeyboard() {
            if (document.activeElement === draft) {
                draft.blur();
            } else {
                draft.focus();
                if (savedRange) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRange);
                }
            }
        }

        function clearDraft() {
            draft.innerHTML = '';
            savedRange = null;
            updateStats();
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function updateStats() {
            const imgs = draft.querySelectorAll('img.inline-premium-emoji').length;
            const textLen = draft.innerText.replace(/\n/g, '').length;
            emojiCountBadge.textContent = imgs;
            charCount.textContent = textLen;
        }
        draft.addEventListener('input', updateStats);

        // Formatting
        function applyFormat(tag) {
            const selection = window.getSelection();
            if (savedRange) {
                selection.removeAllRanges();
                selection.addRange(savedRange);
            }
            if (!selection.rangeCount) return;

            const commandMap = { 'b': 'bold', 'i': 'italic', 'u': 'underline', 's': 'strikeThrough' };
            if (commandMap[tag]) {
                document.execCommand(commandMap[tag], false, null);
            } else {
                const range = selection.getRangeAt(0);
                if (range.collapsed) {
                    if (Telegram.showAlert) Telegram.showAlert('Select some text first!');
                    return;
                }
                const wrapper = document.createElement(tag);
                try {
                    range.surroundContents(wrapper);
                } catch (e) {
                    const content = range.extractContents();
                    wrapper.appendChild(content);
                    range.insertNode(wrapper);
                }
                selection.removeAllRanges();
                const newRange = document.createRange();
                newRange.selectNodeContents(wrapper);
                newRange.collapse(false);
                selection.addRange(newRange);
            }
            saveCurrentSelection();
            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        // Ultra-Fast Image Loader (Uses Native Browser Cache First, Fetch Fallback if Needed)
        function setSmartImageSrc(imgEl, emojiId, rawUrl) {
            if (!rawUrl) return;
            const fullUrl = rawUrl.startsWith('/') ? (apiBase + rawUrl) : rawUrl;
            if (imageBlobCache[emojiId]) {
                imgEl.src = imageBlobCache[emojiId];
                return;
            }
            imgEl.decoding = 'async';
            imgEl.loading = 'lazy';
            imgEl.src = fullUrl;
            imgEl.onerror = () => {
                imgEl.onerror = null;
                fetch(fullUrl, { headers: { 'ngrok-skip-browser-warning': '69420' } })
                    .then(r => r.ok ? r.blob() : Promise.reject())
                    .then(blob => {
                        const bUrl = URL.createObjectURL(blob);
                        imageBlobCache[emojiId] = bUrl;
                        imgEl.src = bUrl;
                    })
                    .catch(() => { imgEl.style.opacity = '0.25'; });
            };
        }

        emojiArea.addEventListener('scroll', () => {
            if (emojiArea.scrollTop + emojiArea.clientHeight >= emojiArea.scrollHeight - 90) {
                renderNextChunk();
            }
        }, { passive: true });

        // Pre-index each emoji once on arrival so search is 0ms
        function indexEmojiItem(emoji) {
            const rawTags = (emoji.tags || '').toLowerCase().trim();
            const rawPack = (emoji.pack_id || 'Other').toLowerCase();
            emoji._tags = rawTags;
            emoji._words = rawTags ? rawTags.split(/\s+/) : [];
            emoji._pack = rawPack;
            emoji._label = emoji._words[0] || emoji.symbol || '⭐';
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="state-msg">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="state-msg">⚡ Loading studio emojis...</div>';
            await fetchPage(1, 1500, true);
            fetchRemainingInBackground();
        }

        async function fetchPage(page, limit, isFirstLoad = false) {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || data.length === 0) return 0;

                for (let i = 0; i < data.length; i++) {
                    const emoji = data[i];
                    if (!emojiById[emoji.id]) {
                        indexEmojiItem(emoji);
                        emojiById[emoji.id] = emoji;
                        allEmojis.push(emoji);
                    }
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        createCategoryButton(packId, emoji.image_url, emoji.id);
                    }
                }

                if (isFirstLoad && Object.keys(catMap).length > 0) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                } else if (!isFirstLoad && !searchInput.value.trim()) {
                    const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                    if (newlyAdded.length > 0) {
                        currentRenderList.push(...newlyAdded);
                        if (renderedCount < CHUNK_SIZE) renderNextChunk();
                    }
                }
                return data.length;
            } catch (err) {
                if (isFirstLoad) keyboard.innerHTML = `<div class="state-msg">❌ ${err.message}</div>`;
                return 0;
            }
        }

        async function fetchRemainingInBackground() {
            let page = 2;
            const limit = 1500;
            while (true) {
                const count = await fetchPage(page, limit, false);
                if (count < limit) break;
                page++;
            }
        }

        let rAF_id = null;
        function setGridList(list, showCount = false) {
            if (rAF_id) cancelAnimationFrame(rAF_id);
            rAF_id = requestAnimationFrame(() => {
                keyboard.innerHTML = '';
                currentRenderList = list;
                renderedCount = 0;
                emojiArea.scrollTop = 0;

                if (showCount) {
                    matchCountBadge.textContent = `${list.length}`;
                    matchCountBadge.classList.add('visible');
                } else {
                    matchCountBadge.classList.remove('visible');
                }

                if (list.length === 0) {
                    keyboard.innerHTML = '<div class="state-msg">😕 No matching emojis found.</div>';
                    return;
                }
                renderNextChunk();
            });
        }

        function renderNextChunk() {
            if (renderedCount >= currentRenderList.length) return;
            const nextSlice = currentRenderList.slice(renderedCount, renderedCount + CHUNK_SIZE);
            renderedCount += nextSlice.length;

            const fragment = document.createDocumentFragment();
            for (let i = 0; i < nextSlice.length; i++) {
                fragment.appendChild(createEmojiElement(nextSlice[i]));
            }
            keyboard.appendChild(fragment);
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';

            const mediaEl = document.createElement('img');
            setSmartImageSrc(mediaEl, emoji.id, emoji.image_url);

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji._label;

            div.appendChild(mediaEl);
            div.appendChild(label);

            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => insertEmoji(emoji);
            return div;
        }

        function createCategoryButton(packId, imageUrl, eid) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => filterEmojis(packId, div);

            const mediaEl = document.createElement('img');
            setSmartImageSrc(mediaEl, eid, imageUrl);

            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.replace(/^Pack_/, '').substring(0, 8);

            div.appendChild(mediaEl);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function clearActiveChips() {
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active-chip'));
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (searchInput.value.trim()) {
                searchInput.value = '';
                searchClearBtn.classList.remove('visible');
            }
            clearActiveChips();
            activeCategory = categoryId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            if (clickedBtn) clickedBtn.classList.add('active-cat');

            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function runQuickChip(term, btnEl) {
            const isAlreadyActive = btnEl.classList.contains('active-chip');
            clearActiveChips();
            if (isAlreadyActive) {
                clearSearch();
                return;
            }
            btnEl.classList.add('active-chip');
            searchInput.value = term;
            searchClearBtn.classList.add('visible');
            executeFastSearch(term);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        // Ultra-Fast Pre-Indexed Search (<1ms for 8,800+ emojis)
        function isFuzzy(word, q) {
            if (q.length < 3 || Math.abs(word.length - q.length) > 2) return false;
            let wi = 0, qi = 0, err = 0;
            while (wi < word.length && qi < q.length) {
                if (word[wi] === q[qi]) { wi++; qi++; }
                else {
                    err++;
                    if (err > 1) return false;
                    if (word.length > q.length) wi++;
                    else if (q.length > word.length) qi++;
                    else { wi++; qi++; }
                }
            }
            return true;
        }

        function executeFastSearch(rawQ) {
            const terms = SEARCH_ALIASES[rawQ] || [rawQ];
            const exactList = [];
            const prefixList = [];
            const substringList = [];

            const total = allEmojis.length;
            for (let i = 0; i < total; i++) {
                const em = allEmojis[i];
                const tags = em._tags;
                if (!tags && em.symbol !== rawQ) continue;

                let matchedTier = 0;
                const words = em._words;

                for (let t = 0; t < terms.length; t++) {
                    const term = terms[t];
                    if (em.symbol === term) { matchedTier = 1; break; }
                    if (!tags.includes(term)) continue;

                    for (let w = 0; w < words.length; w++) {
                        if (words[w] === term) { matchedTier = 1; break; }
                        if (words[w].startsWith(term)) { matchedTier = Math.max(matchedTier, 2); }
                    }
                    if (matchedTier === 0) matchedTier = 3;
                    if (matchedTier === 1) break;
                }

                if (matchedTier === 1) exactList.push(em);
                else if (matchedTier === 2) prefixList.push(em);
                else if (matchedTier === 3) substringList.push(em);
            }

            let combined = exactList.concat(prefixList, substringList);

            // Only run typo-fuzzy fallback if fewer than 10 results found
            if (combined.length < 10 && rawQ.length >= 3) {
                const seen = new Set(combined.map(x => x.id));
                for (let i = 0; i < total; i++) {
                    const em = allEmojis[i];
                    if (seen.has(em.id)) continue;
                    const words = em._words;
                    for (let w = 0; w < words.length; w++) {
                        if (isFuzzy(words[w], rawQ)) {
                            combined.push(em);
                            break;
                        }
                    }
                }
            }

            setGridList(combined, true);
        }

        let searchDebounce;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            clearActiveChips();
            const rawQ = searchInput.value.trim().toLowerCase().replace(/^#/, '');
            searchClearBtn.classList.toggle('visible', rawQ.length > 0);

            if (!rawQ) {
                const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
                setGridList(filtered, false);
                return;
            }

            searchDebounce = setTimeout(() => {
                executeFastSearch(rawQ);
            }, 120);
        });

        function clearSearch() {
            searchInput.value = '';
            searchClearBtn.classList.remove('visible');
            clearActiveChips();
            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
        }

        // Insert Visual Premium Emoji Into Draft Without Popping Up Keyboard
        function insertEmoji(emoji) {
            const imgNode = document.createElement('img');
            imgNode.className = 'inline-premium-emoji';
            imgNode.dataset.emojiId = emoji.id;
            imgNode.dataset.imgPath = emoji.image_url || `/api/image/${emoji.id}.webp`;
            imgNode.alt = emoji.symbol || '⭐';
            setSmartImageSrc(imgNode, emoji.id, imgNode.dataset.imgPath);

            const spaceNode = document.createTextNode('\u00A0');

            let range = savedRange;
            if (!range || !draft.contains(range.commonAncestorContainer)) {
                range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
            }

            range.deleteContents();
            range.insertNode(spaceNode);
            range.insertNode(imgNode);

            range.setStartAfter(spaceNode);
            range.collapse(true);
            savedRange = range.cloneRange();

            if (document.activeElement === draft) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }

            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        // Serialize Draft to Bot Format with [emoji_id]
        function serializeDraftForBot(containerEl) {
            const clone = containerEl.cloneNode(true);
            clone.querySelectorAll('img.inline-premium-emoji').forEach(img => {
                const eid = img.dataset.emojiId;
                const replacement = document.createTextNode(eid ? `[${eid}]` : (img.alt || '⭐'));
                img.replaceWith(replacement);
            });

            return clone.innerHTML
                .replace(/<div><br\s*\/?><\/div>/gi, '\n')
                .replace(/<div>/gi, '\n')
                .replace(/<\/div>/gi, '')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/&nbsp;|\u00A0/g, ' ');
        }

        function saveToHistory(botFormattedText) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            history.unshift({
                botText: botFormattedText,
                date: new Date().toLocaleString()
            });
            if (history.length > 25) history.pop();
            localStorage.setItem('postHistory', JSON.stringify(history));
        }

        function hydrateBotTextToVisualHTML(botText) {
            if (!botText) return '';
            const htmlWithBreaks = botText.replace(/\n/g, '<br>');
            return htmlWithBreaks.replace(/\[(\d{17,21})\]/g, (match, eid) => {
                const imgPath = `/api/image/${eid}.webp`;
                return `<img class="inline-premium-emoji" data-emoji-id="${eid}" data-img-path="${imgPath}" src="${TRANSPARENT_PIXEL}" alt="⭐">`;
            });
        }

        function hydrateImagesInContainer(container) {
            container.querySelectorAll('img.inline-premium-emoji').forEach(img => {
                const eid = img.dataset.emojiId;
                const path = img.dataset.imgPath || `/api/image/${eid}.webp`;
                if (eid) setSmartImageSrc(img, eid, path);
            });
        }

        function showHistory() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('historyView').style.display = 'flex';
            document.getElementById('settingsMenu').classList.remove('show');

            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');

            if (history.length === 0) {
                list.innerHTML = '<div class="state-msg">No saved history yet.</div>';
                return;
            }

            list.innerHTML = '';
            history.forEach((item, index) => {
                const rawBotText = item.botText || item.text || '';
                const card = document.createElement('div');
                card.className = 'history-card';
                card.onclick = () => loadHistoryItem(index);

                const visualHTML = hydrateBotTextToVisualHTML(rawBotText);
                card.innerHTML = `
                    <div class="history-header">
                        <span>POST #${history.length - index}</span>
                        <span>${item.date || ''}</span>
                    </div>
                    <div class="history-text">${visualHTML}</div>
                    <div style="font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: 700;">Tap to restore into studio ✏️</div>
                `;
                list.appendChild(card);
                hydrateImagesInContainer(card);
            });
        }

        function loadHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            const item = history[index];
            if (item) {
                const rawBotText = item.botText || item.text || '';
                draft.innerHTML = hydrateBotTextToVisualHTML(rawBotText);
                hydrateImagesInContainer(draft);
                showMain();

                const range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
                savedRange = range.cloneRange();

                updateStats();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');
            }
        }

        function showMain() {
            document.getElementById('historyView').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        }

        function clearHistory() {
            if (confirm("Clear all post history?")) {
                localStorage.removeItem('postHistory');
                showHistory();
            }
        }

        function sendData() {
            const hasEmoji = draft.querySelector('img.inline-premium-emoji') !== null;
            if (!draft.innerText.trim() && !hasEmoji) {
                if (Telegram.showAlert) Telegram.showAlert('Write something or add an emoji first!');
                return;
            }

            const finalBotText = serializeDraftForBot(draft);
            saveToHistory(finalBotText);
            Telegram.sendData(JSON.stringify({ text: finalBotText }));
        }

        loadEmojis();
    </script>
</body>
</html>
