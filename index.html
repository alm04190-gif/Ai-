<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Post Studio Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #eef3f9;
            --bg-ambient: radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.18), transparent 42%),
                          radial-gradient(circle at 88% 90%, rgba(124, 58, 237, 0.15), transparent 45%);
            --surface: #ffffff;
            --surface-2: #f3f6fb;
            --surface-3: #e5eaf3;
            --border: rgba(15, 23, 42, 0.09);
            --border-highlight: rgba(37, 99, 235, 0.45);
            --accent: #2563eb;
            --accent-2: #7c3aed;
            --accent-cyan: #06b6d4;
            --text: #0f172a;
            --text-muted: #64748b;
            --glow: rgba(37, 99, 235, 0.14);
            --shadow-card: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
            --shadow-btn: 0 10px 26px -4px rgba(37, 99, 235, 0.45);
            --shimmer-1: #e2e8f0;
            --shimmer-2: #f8fafc;
            --quote-bg: rgba(37, 99, 235, 0.08);
        }

        [data-theme="dark"] {
            --bg-main: #060811;
            --bg-ambient: radial-gradient(circle at 10% 5%, rgba(56, 189, 248, 0.14), transparent 40%),
                          radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.15), transparent 42%),
                          radial-gradient(circle at 50% 95%, rgba(6, 182, 212, 0.12), transparent 45%);
            --surface: #0e1322;
            --surface-2: #161d31;
            --surface-3: #1f2942;
            --border: rgba(255, 255, 255, 0.09);
            --border-highlight: rgba(56, 189, 248, 0.55);
            --accent: #38bdf8;
            --accent-2: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glow: rgba(56, 189, 248, 0.16);
            --shadow-card: 0 12px 32px -6px rgba(0, 0, 0, 0.72);
            --shadow-btn: 0 10px 28px -4px rgba(56, 189, 248, 0.4);
            --shimmer-1: #161d31;
            --shimmer-2: #232e4d;
            --quote-bg: rgba(56, 189, 248, 0.11);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-main);
            background-image: var(--bg-ambient);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            max-width: 540px;
            margin: 0 auto;
            padding: 8px 10px 10px 10px;
            gap: 8px;
            position: relative;
        }

        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-2.5px) scale(1.08); }
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes wiggleGlow {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-8deg) scale(1.08); }
            75% { transform: rotate(8deg) scale(1.08); }
        }
        @keyframes rocketFly {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2.5px, -2.5px) scale(1.1); }
        }
        @keyframes borderGlowPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.35), 0 0 22px rgba(139, 92, 246, 0.2), inset 0 0 8px rgba(56, 189, 248, 0.12);
                border-color: #38bdf8;
            }
            50% {
                box-shadow: 0 0 16px rgba(139, 92, 246, 0.55), 0 0 28px rgba(6, 182, 212, 0.35), inset 0 0 12px rgba(139, 92, 246, 0.18);
                border-color: #a855f7;
            }
        }
        @keyframes shimmerAnim {
            0% { background-position: -120px 0; }
            100% { background-position: 120px 0; }
        }
        @keyframes aiBarProgress {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .anim-float { animation: floatPulse 2.4s ease-in-out infinite; }
        .anim-wiggle { animation: wiggleGlow 2.6s ease-in-out infinite; }
        .anim-spin { animation: spinSlow 9s linear infinite; }
        .anim-rocket { animation: rocketFly 1.8s ease-in-out infinite; }

        .ui-prem-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(56, 189, 248, 0.35));
        }

        .top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 11px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 40;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.25));
            border: 1px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(56, 189, 248, 0.25);
        }
        .brand-logo img, .brand-logo svg {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, var(--text), var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-pill b {
            color: var(--accent);
            font-weight: 800;
        }

        .icon-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s, border-color 0.15s;
        }
        .icon-btn:active {
            transform: scale(0.88);
            border-color: var(--accent);
        }

        .settings-menu {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--surface);
            border: 1.5px solid var(--border-highlight);
            border-radius: 14px;
            box-shadow: var(--shadow-card);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 175px;
            z-index: 100;
        }
        .settings-menu.show { display: flex; }
        .settings-item {
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            background: transparent;
            border: none;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }
        .settings-item:active { background: var(--glow); color: var(--accent); }

        .main-view {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            gap: 8px;
            overflow: hidden;
        }
        .history-view {
            display: none;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            gap: 10px;
            overflow: hidden;
        }

        .editor-card {
            flex-shrink: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 9px 11px 7px 11px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 7px;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-card:focus-within {
            border-color: var(--border-highlight);
            box-shadow: 0 0 0 3px var(--glow), var(--shadow-card);
        }

        .draft-area {
            width: 100%;
            min-height: 68px;
            max-height: 145px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            outline: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            user-select: text;
        }
        .draft-area:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            opacity: 0.65;
            font-size: 13.5px;
            pointer-events: none;
        }

        .inline-premium-emoji {
            width: 22px;
            height: 22px;
            vertical-align: -5px;
            margin: 0 1.5px;
            object-fit: contain;
            display: inline-block;
            pointer-events: none;
        }

        .draft-area b, .history-text b { font-weight: 800; }
        .draft-area i, .history-text i { font-style: italic; }
        .draft-area u, .history-text u { text-decoration: underline; }
        .draft-area s, .history-text s { text-decoration: line-through; }
        .draft-area code, .history-text code {
            background: var(--surface-3);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            color: var(--accent);
        }
        .draft-area tg-spoiler, .history-text tg-spoiler {
            background: var(--surface-3);
            color: var(--text);
            border: 1px dashed var(--accent);
            border-radius: 4px;
            padding: 0 4px;
        }
        .draft-area a, .history-text a {
            color: #38bdf8;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
            background: rgba(56, 189, 248, 0.12);
            padding: 0 4px;
            border-radius: 5px;
        }

        .draft-area blockquote,
        .history-text blockquote {
            position: relative;
            border-left: 3.5px solid var(--accent);
            background: var(--quote-bg);
            margin: 4px 0;
            padding: 6px 28px 6px 10px;
            border-radius: 4px 10px 10px 4px;
            color: var(--text);
            display: block;
            transition: max-height 0.22s ease;
        }

        .draft-area blockquote::before,
        .history-text blockquote::before {
            content: "”";
            position: absolute;
            top: 2px;
            right: 7px;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            color: var(--accent);
            opacity: 0.7;
            pointer-events: none;
        }

        .draft-area blockquote::after,
        .history-text blockquote[expandable]::after {
            content: "⌃";
            position: absolute;
            bottom: 4px;
            right: 5px;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            background: var(--surface-3);
            border: 1px solid var(--border-highlight);
            color: var(--accent);
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .draft-area blockquote[expandable].is-collapsed,
        .history-text blockquote[expandable].is-collapsed {
            max-height: 74px;
            overflow: hidden;
        }

        .draft-area blockquote[expandable].is-collapsed::after,
        .history-text blockquote[expandable].is-collapsed::after {
            content: "⌄";
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        .format-toolbar {
            display: flex;
            align-items: center;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 5px;
            scrollbar-width: none;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .format-toolbar::-webkit-scrollbar { display: none; }

        .format-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.12s ease;
        }
        .format-btn:active,
        .format-btn.active-fmt {
            transform: scale(0.94);
            background: var(--glow);
            border-color: var(--accent);
            color: var(--accent);
        }
        .format-btn.ai-pill {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.22), rgba(139, 92, 246, 0.28), rgba(6, 182, 212, 0.22));
            border: 1.5px solid var(--border-highlight);
            color: var(--accent);
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.22);
        }
        .format-btn.link-pill {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(124, 58, 237, 0.16));
            border-color: rgba(56, 189, 248, 0.45);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 17, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }
        .modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background: var(--surface);
            border: 1.5px solid var(--border-highlight);
            border-radius: 20px;
            padding: 18px 16px 16px 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px var(--glow);
            transform: translateY(12px) scale(0.95);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-backdrop.show .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-title-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }
        .modal-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.4;
        }
        .modal-sub b {
            color: var(--accent);
        }

        .modal-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface-2);
            border: 1.5px solid var(--border-highlight);
            border-radius: 13px;
            padding: 3px 10px;
        }
        .modal-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            padding: 9px 4px;
        }
        .modal-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .modal-btn-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 2px;
        }
        .modal-btn {
            flex: 1;
            padding: 11px 12px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--border);
            transition: transform 0.12s ease, filter 0.15s ease;
        }
        .modal-btn:active {
            transform: scale(0.95);
        }
        .modal-btn.cancel {
            background: var(--surface-2);
            color: var(--text);
        }
        .modal-btn.done {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.22);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
        }

        .ai-loader-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 4px;
            gap: 11px;
        }
        .ai-orb {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(139, 92, 246, 0.28));
            border: 1.5px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 26px rgba(56, 189, 248, 0.4);
        }
        .ai-orb img, .ai-orb svg {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }
        .ai-progress-track {
            width: 100%;
            height: 8px;
            background: var(--surface-2);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .ai-progress-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #a855f7, #06b6d4, #2563eb);
            background-size: 250% 100%;
            animation: aiBarProgress 1.3s linear infinite;
            border-radius: 99px;
        }

        .vault-card {
            flex: 1 1 auto;
            min-height: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 9px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 7px;
            overflow: hidden;
        }

        .search-row {
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 13px;
            border: 1.5px solid #38bdf8;
            background: var(--surface-2);
            animation: borderGlowPulse 3.2s ease-in-out infinite;
        }
        .search-icon-box {
            position: absolute;
            left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 13px;
            padding: 9px 84px 9px 36px;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
        }
        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .search-meta {
            position: absolute;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .match-count {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            background: var(--glow);
            padding: 3px 6px;
            border-radius: 6px;
            display: none;
        }
        .match-count.visible { display: inline-block; }

        .search-clear {
            background: var(--surface-3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            cursor: pointer;
            display: none;
        }
        .search-clear.visible { display: inline-block; }

        .quick-chips {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 6px;
            scrollbar-width: none;
            padding: 2px 1px;
        }
        .quick-chips::-webkit-scrollbar { display: none; }

        .chip-btn {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px 4px 7px;
            border-radius: 99px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .chip-btn img, .chip-btn svg {
            width: 17px;
            height: 17px;
            object-fit: contain;
            border-radius: 4px;
            pointer-events: none;
        }
        .chip-btn.active-chip {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.45);
        }
        .chip-btn:active { transform: scale(0.93); }

        .category-row {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 6px;
            padding: 2px 1px;
            scrollbar-width: none;
        }
        .category-row::-webkit-scrollbar { display: none; }

        .category-item {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            padding: 5px 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-item.active-cat {
            border-color: var(--accent);
            background: var(--glow);
        }
        .category-item:active { transform: scale(0.94); }
        .category-item .cat-img-wrap {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .category-item img.loaded { opacity: 1; }
        .category-item .normal-emoji {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .category-item.active-cat .normal-emoji {
            color: var(--text);
        }

        .emoji-scroll-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: scroll !important;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 3px;
            position: relative;
        }
        .emoji-scroll-area::-webkit-scrollbar { width: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border-highlight);
            border-radius: 4px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 7px;
            padding-bottom: 18px;
        }

        .emoji-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 5px 3px 4px 3px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 56px;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
            position: relative;
        }
        .emoji-item:active {
            transform: scale(0.85);
            border-color: var(--accent);
            background: var(--glow);
        }

        .emoji-img-box {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%);
            background-size: 240px 100%;
            animation: shimmerAnim 1.4s infinite linear;
        }
        .emoji-img-box.ready {
            background: transparent;
            animation: none;
        }

        .emoji-item img {
            width: 29px;
            height: 29px;
            object-fit: contain;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .emoji-item img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .emoji-item .label {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 92%;
            text-align: center;
            font-weight: 600;
        }

        .state-msg {
            text-align: center;
            padding: 28px 10px;
            color: var(--text-muted);
            font-size: 13px;
            grid-column: 1 / -1;
            font-weight: 600;
        }

        .send-btn-wrapper {
            flex-shrink: 0;
            width: 100%;
        }
        .send-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 52%, #06b6d4 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
        }
        .send-btn:active {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        .history-list-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding-right: 3px;
        }
        .history-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 12px 14px;
            margin-bottom: 9px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
        }
        .history-card:active { border-color: var(--accent); background: var(--glow); }
        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .history-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .history-actions {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }
        .btn-secondary {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

                    <img class="ui-prem-icon anim-wiggle" data-ui-prem="cancel" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><circle cx='12' cy='12' r='10' fill='rgba(239,68,68,0.2)' stroke='%23ef4444' stroke-width='2'/><path d='M15 9l-6 6M9 9l6 6' stroke='%23ef4444' stroke-width='2.2' stroke-linecap='round'/></svg>" alt="">
                    Cancel
                </button>
                <button type="button" class="modal-btn done" onclick="confirmInsertLink()">
                    <img class="ui-prem-icon anim-float" data-ui-prem="done" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><circle cx='12' cy='12' r='10' fill='rgba(34,197,94,0.25)' stroke='%234ade80' stroke-width='2'/><path d='M8 12.5l2.6 2.6 5.4-5.4' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/></svg>" alt="">
                    Done
                </button>
