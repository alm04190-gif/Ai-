<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        /* 🔥 Premium UI is Back 🔥 */
        :root { --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; --accent: #0088cc; --accent-hover: #0077b3; --text: #ffffff; --text-secondary: #888888; --purple-glow: rgba(160, 32, 240, 0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; padding-bottom: 100px; min-height: 100vh; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 24px; padding-top: 8px; position: relative; z-index: 10; }
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
        .header p { font-size: 13px; color: var(--text-secondary); }
        
        .section { margin-bottom: 20px; position: relative; z-index: 10; }
        .section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.8px; }
        
        .draft-area { width: 100%; min-height: 140px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; color: var(--text); font-size: 15px; line-height: 1.5; resize: vertical; font-family: inherit; transition: border-color 0.2s, box-shadow 0.3s; box-shadow: 0 4px 15px var(--purple-glow); }
        .draft-area:focus { outline: none; border-color: #a020f0; box-shadow: 0 0 20px rgba(160, 32, 240, 0.8); }
        
        .category-hint { font-size: 11px; color: #aaaaaa; margin-bottom: 10px; font-style: italic; }
        .category-row { display: flex; overflow-x: auto; gap: 12px; padding: 10px 5px 25px 5px; margin-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .category-row::-webkit-scrollbar { display: none; }
        
        .category-item { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: center; box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px; transition: transform 0.1s; }
        .category-item.active-cat { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .category-item .media-container { width: 32px; height: 32px; object-fit: contain; pointer-events: none; display: block; }
        .category-item .normal-emoji { font-size: 14px; line-height: 1; margin-top: 4px; }
        
        .emoji-wrapper { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .emoji-scroll-area { max-height: 145px; overflow-y: auto; overflow-x: hidden; transition: max-height 0.3s; -webkit-overflow-scrolling: touch; }
        .emoji-scroll-area.expanded { max-height: 50vh; }
        .emoji-fade { position: absolute; bottom: 40px; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; transition: opacity 0.3s; }
        .emoji-scroll-area.expanded + .emoji-fade { opacity: 0; }
        
        /* 🔥 Ultra-Smooth Hardware Acceleration Engine 🔥 */
        .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 8px; }
        .emoji-item { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 6px 4px; 
            cursor: pointer; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            /* Magic CSS for Zero Lag on Android/iOS */
            contain: strict; 
            transform: translateZ(0); 
            height: 54px; /* Fixed height prevents layout shifts */
        }
        .hidden-emoji { display: none !important; }
        .emoji-item:active { transform: scale(0.9); border-color: var(--accent); background: rgba(160, 32, 240, 0.2); }
        .emoji-item .media-container { width: 26px; height: 26px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
        .emoji-item .label { font-size: 9px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        
        .toggle-btn { display: flex; justify-content: center; align-items: center; width: 100%; background: transparent; border: none; color: var(--accent); font-size: 13px; font-weight: 600; padding-top: 12px; cursor: pointer; border-top: 1px solid var(--border); margin-top: 5px; }
        
        .loading, .empty, .error { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 13px; grid-column: 1 / -1; }
        .error { color: #ff4444; font-weight: bold; }
        
        .send-btn { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); padding: 16px; border-top: 1px solid var(--border); z-index: 100; }
        .send-btn button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3); transition: transform 0.1s, background 0.2s; }
        .send-btn button:active { background: var(--accent-hover); transform: scale(0.96); }
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type your post here... Tap emojis below to insert them."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Emoji Categories</div>
        <div class="category-hint">👇 Click a pack to view its premium emojis</div>
        <div class="category-row" id="categoryRow"></div>
    </div>

    <div class="section">
        <div class="section-title">Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid"></div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis</span> <span id="toggleIcon">🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send to Bot</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;

        let currentPage = 1;
        const PAGE_LIMIT = 100; 
        let catMap = {}; 
        let activeCategory = 'all';

        // 🔥 The Core Engine 🔥
        const lottieInstances = new Map();
        const jsonCache = new Map(); // Stores decoded JSON to prevent CPU lag
        
        // Transparent 1x1 Pixel to prevent "Broken Image" icons forever
        const TRANSPARENT_PIXEL = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        // Intersection Observer for Virtual Scrolling
        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const el = entry.target;
                
                if (entry.isIntersecting) {
                    // Item is visible on screen
                    if (el.dataset.lottieUrl) {
                        if (!lottieInstances.has(el)) {
                            // Render from cache for 0ms delay
                            const b64Data = el.dataset.lottieUrl.split(',')[1];
                            let animData = jsonCache.get(b64Data);
                            
                            if (!animData) {
                                try {
                                    let jsonStr;
                                    try { jsonStr = decodeURIComponent(escape(atob(b64Data))); }
                                    catch(e) { jsonStr = atob(b64Data); }
                                    animData = JSON.parse(jsonStr);
                                    jsonCache.set(b64Data, animData);
                                } catch(e) { console.error("Data decode error"); return; }
                            }
                            
                            const anim = lottie.loadAnimation({
                                container: el,
                                renderer: 'svg', // SVG is most stable for high-end UI
                                loop: true,
                                autoplay: true,
                                animationData: animData
                            });
                            lottieInstances.set(el, anim);
                        } else {
                            lottieInstances.get(el).play();
                        }
                    } else if (el.tagName === 'IMG' && el.dataset.realSrc) {
                        el.src = el.dataset.realSrc;
                        el.removeAttribute('data-real-src');
                    } else if (el.tagName === 'VIDEO' && el.dataset.realSrc) {
                        el.src = el.dataset.realSrc;
                        el.removeAttribute('data-real-src');
                        el.play().catch(()=>{});
                    }
                } else {
                    // Item is off screen - Completely destroy to free 100% RAM
                    if (lottieInstances.has(el)) {
                        const anim = lottieInstances.get(el);
                        anim.destroy(); // Purge WebGL/DOM memory
                        lottieInstances.delete(el);
                        el.innerHTML = ''; // Clean box
                    } else if (el.tagName === 'VIDEO') {
                        el.pause();
                    }
                }
            });
        }, {
            root: emojiArea,
            rootMargin: '120px 0px', // Pre-load slightly before coming into view
            threshold: 0.01
        });

        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis";
                toggleIcon.textContent = "🔼";
            } else {
                toggleText.textContent = "Show All Emojis";
                toggleIcon.textContent = "🔽";
                emojiArea.scrollTop = 0; 
            }
        }

        draft.addEventListener('input', () => { charCount.textContent = draft.value.length + ' chars'; });

        function setupAllCategoryButton() {
            const allBtn = document.createElement('div');
            allBtn.className = 'category-item active-cat';
            allBtn.innerHTML = `<div style="font-size: 26px; line-height:30px;">🌐</div><div class="normal-emoji">All</div>`;
            allBtn.onclick = () => filterEmojis('all', allBtn);
            categoryRow.appendChild(allBtn);
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            setupAllCategoryButton();
            fetchNextPage(); 
        }

        async function fetchNextPage() {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${currentPage}&limit=${PAGE_LIMIT}`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                let text = await res.text();
                let data = JSON.parse(text);

                if (data.length > 0) {
                    appendEmojisToGrid(data);
                    currentPage++;
                    setTimeout(fetchNextPage, 400); 
                } else if (currentPage === 1 && data.length === 0) {
                    keyboard.innerHTML = '<div class="empty">No emojis in database.</div>';
                }
            } catch (err) {
                if (currentPage === 1) keyboard.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            }
        }

        function createMediaElement(url, isCategory = false) {
            let mediaEl;
            if (!url) url = "";

            if (url.startsWith('data:application/json')) {
                mediaEl = document.createElement('div');
                mediaEl.className = 'media-container';
                if (!isCategory) {
                    mediaEl.dataset.lottieUrl = url; 
                } else {
                    // Categories load instantly
                    try {
                        const b64Data = url.split(',')[1];
                        let jsonStr;
                        try { jsonStr = decodeURIComponent(escape(atob(b64Data))); } catch(e) { jsonStr = atob(b64Data); }
                        lottie.loadAnimation({ container: mediaEl, renderer: 'svg', loop: true, autoplay: true, animationData: JSON.parse(jsonStr) });
                    } catch(e) {}
                }
            } else if (url.startsWith('data:video/webm')) {
                mediaEl = document.createElement('video');
                mediaEl.className = 'media-container';
                mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true; mediaEl.playsInline = true;
                if (!isCategory) mediaEl.dataset.realSrc = url; else mediaEl.src = url;
            } else {
                mediaEl = document.createElement('img');
                mediaEl.className = 'media-container';
                mediaEl.src = TRANSPARENT_PIXEL; // FIX: Never shows broken icon
                if (!isCategory) mediaEl.dataset.realSrc = url; else mediaEl.src = url;
                mediaEl.onerror = function() { this.style.opacity = '0.3'; };
            }
            return mediaEl;
        }

        function appendEmojisToGrid(data) {
            const gridFragment = document.createDocumentFragment();
            data.forEach((emoji) => {
                const sym = emoji.symbol || '⭐';
                const packId = emoji.pack_id || 'Other'; 
                
                if (!catMap[packId]) {
                    catMap[packId] = true; 
                    createCategoryButton(packId, emoji.image_url);
                }

                const div = document.createElement('div');
                div.className = 'emoji-item';
                div.dataset.category = packId; 
                if (activeCategory !== 'all' && packId !== activeCategory) div.classList.add('hidden-emoji');

                const mediaEl = createMediaElement(emoji.image_url, false);
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = sym; 

                div.appendChild(mediaEl); div.appendChild(label);
                div.onclick = () => insertEmoji(emoji);
                gridFragment.appendChild(div);

                lazyLoadObserver.observe(mediaEl);
            });
            keyboard.appendChild(gridFragment);
        }

        function createCategoryButton(packId, imageUrl) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onclick = () => filterEmojis(packId, div);
            const mediaEl = createMediaElement(imageUrl, true);
            div.appendChild(mediaEl);
            categoryRow.appendChild(div);
        }

        function filterEmojis(categoryId, clickedBtn) {
            activeCategory = categoryId; 
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            const allItems = document.querySelectorAll('#emojiKeyboard .emoji-item');
            allItems.forEach(item => {
                if (categoryId === 'all' || item.dataset.category === categoryId) item.classList.remove('hidden-emoji');
                else item.classList.add('hidden-emoji');
            });
            if (categoryId !== 'all' && !emojiArea.classList.contains('expanded')) toggleEmojiList();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;
            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;
            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) { Telegram.showAlert('Please write something first!'); return; }
            for (let code in emojiMap) { text = text.split(code).join(emojiMap[code]); }
            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
