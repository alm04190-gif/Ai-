<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* 🔥 Ultra-Premium UI Variables 🔥 */
        :root { 
            --bg: #f4f7f6; 
            --surface: #ffffff; 
            --border: #e0e5ec; 
            --accent: #007aff; 
            --accent-hover: #005bb5; 
            --text: #1a1a1a; 
            --text-secondary: #6e7681; 
            --glow: rgba(0, 122, 255, 0.2); 
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 12px 32px rgba(0, 122, 255, 0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; 
            padding: 20px 16px 120px 16px; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* 🔥 Visible Black Rain Effect 🔥 */
        .rain-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.3));
            width: 2px;
            height: 25px;
            border-radius: 2px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* 🔥 Header 🔥 */
        .header { text-align: center; margin-bottom: 28px; position: relative; z-index: 10; animation: fadeInDown 0.6s ease-out; }
        .header h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; color: #111; text-shadow: 0 2px 10px rgba(0,0,0,0.05); }
        .header p { font-size: 14px; color: var(--text-secondary); font-weight: 500; }
        
        .section { margin-bottom: 24px; position: relative; z-index: 10; animation: fadeInUp 0.6s ease-out backwards; }
        
        /* 🔥 Animated Section Titles 🔥 */
        .section-title { 
            font-size: 13px; font-weight: 800; color: var(--text-secondary); 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; 
            display: inline-block; overflow: hidden; white-space: nowrap;
            border-right: 2px solid var(--accent);
            animation: typing 1.5s steps(30, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--accent); } }
        
        /* 🔥 Draft Area 🔥 */
        .draft-area { 
            width: 100%; min-height: 150px; background: var(--surface); 
            border: 1.5px solid var(--border); border-radius: 16px; padding: 16px; 
            color: var(--text); font-size: 16px; line-height: 1.6; resize: vertical; 
            font-family: inherit; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: var(--shadow-soft); 
        }
        .draft-area:focus { outline: none; border-color: var(--accent); box-shadow: var(--shadow-strong); transform: translateY(-2px); }
        .draft-area::placeholder { color: #999; font-style: italic; }
        
        /* 🔥 Category Row 🔥 */
        .category-hint { font-size: 12px; color: #888; margin-bottom: 12px; font-style: italic; }
        .category-row { 
            display: flex; overflow-x: auto; gap: 14px; padding: 10px 5px 20px 5px; 
            margin-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; 
        }
        .category-row::-webkit-scrollbar { display: none; }
        
        .category-item { 
            flex: 0 0 auto; background: var(--surface); border: 1.5px solid var(--border); 
            border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: center; 
            box-shadow: var(--shadow-soft); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-width: 65px; 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }
        .category-item.active-cat { 
            border-color: var(--accent); box-shadow: var(--shadow-strong); 
            background: #f0f7ff; transform: translateY(-4px) scale(1.05); 
        }
        .category-item img { width: 34px; height: 34px; object-fit: contain; pointer-events: none; display: block; }
        .category-item .normal-emoji { font-size: 12px; font-weight: 600; line-height: 1; margin-top: 6px; color: var(--text-secondary); }
        .category-item.active-cat .normal-emoji { color: var(--accent); }
        
        /* 🔥 Emoji Grid 🔥 */
        .emoji-wrapper { 
            position: relative; background: var(--surface); border: 1.5px solid var(--border); 
            border-radius: 16px; padding: 12px; overflow: hidden; box-shadow: var(--shadow-soft); 
        }
        
        .emoji-scroll-area { 
            height: 160px; overflow-y: auto; overflow-x: hidden; 
            -webkit-overflow-scrolling: touch; position: relative; 
        }
        .emoji-scroll-area::-webkit-scrollbar { width: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        
        .emoji-fade { position: absolute; bottom: 35px; left: 0; right: 0; height: 30px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
        
        .emoji-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); 
            gap: 10px; padding-bottom: 10px;
        }
        
        .emoji-item { 
            background: #f8f9fa; border: 1px solid var(--border); border-radius: 12px; 
            padding: 8px 4px; cursor: pointer; text-align: center; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            transition: all 0.15s ease; height: 58px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .emoji-item:active { transform: scale(0.85); border-color: var(--accent); background: #e6f3ff; box-shadow: none; }
        .emoji-item img { width: 28px; height: 28px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
        .emoji-item .label { font-size: 10px; color: var(--text-secondary); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: 600; }
        
        .scroll-hint { 
            display: flex; justify-content: center; align-items: center; width: 100%; 
            background: transparent; color: var(--text-secondary); font-size: 12px; 
            font-weight: 600; padding-top: 12px; border-top: 1px solid var(--border); 
            margin-top: 8px; pointer-events: none; 
        }
        
        .loading, .empty, .error { text-align: center; padding: 40px 10px; color: var(--text-secondary); font-size: 14px; grid-column: 1 / -1; font-weight: 600; animation: pulse 1.5s infinite; }
        .error { color: #ff3b30; animation: none; }
        
        /* 🔥 Floating Action Button 🔥 */
        .send-btn-wrapper { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; z-index: 100; 
        }
        .send-btn { 
            width: 100%; background: linear-gradient(135deg, var(--accent), #00c6ff); 
            color: #fff; border: none; border-radius: 100px; padding: 16px; 
            font-size: 17px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.4); 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .send-btn:active { transform: scale(0.94); box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3); }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-secondary); font-weight: 600;}
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>
    <!-- 🔥 Black Rain Background 🔥 -->
    <div class="rain-container" id="rainContainer"></div>

    <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title" style="width: 80px;">📝 Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft"></textarea>
    </div>

    <div class="section">
        <div class="section-title" style="width: 160px;">📁 Emoji Categories</div>
        <div class="category-hint">👇 Click a pack to view its premium emojis</div>
        <div class="category-row" id="categoryRow"></div>
    </div>

    <div class="section">
        <div class="section-title" style="width: 170px;">⌨️ Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid"></div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <div class="scroll-hint">
                👇 Scroll down for more emojis 👇
            </div>
        </div>
    </div>

    <!-- 🔥 Floating Action Button 🔥 -->
    <div class="send-btn-wrapper">
        <button class="send-btn" id="sendBtn" onclick="sendData()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            Send to Bot
        </button>
    </div>

    <script>
        // 🔥 Rain Effect Generator 🔥
        function createRain() {
            const container = document.getElementById('rainContainer');
            const dropCount = 40; 
            for (let i = 0; i < dropCount; i++) {
                let drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(drop);
            }
        }
        createRain();

        // 🔥 Auto-Typing Placeholder Logic 🔥
        const draft = document.getElementById('draft');
        const placeholderText = "Type your post here... Tap emojis below to insert them.";
        let typeIndex = 0;
        let typingInterval;
        let isTyping = true;

        function typePlaceholder() {
            if (typeIndex <= placeholderText.length) {
                draft.setAttribute('placeholder', placeholderText.substring(0, typeIndex) + '|');
                typeIndex++;
                typingInterval = setTimeout(typePlaceholder, 50);
            } else {
                setTimeout(() => {
                    typeIndex = 0;
                    if(isTyping) typePlaceholder();
                }, 2000);
            }
        }
        
        draft.addEventListener('focus', () => {
            isTyping = false;
            clearTimeout(typingInterval);
            draft.setAttribute('placeholder', '');
        });

        draft.addEventListener('blur', () => {
            if (draft.value.trim() === '') {
                isTyping = true;
                typeIndex = 0;
                typePlaceholder();
            }
        });
        
        // Start typing effect
        typePlaceholder();

        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api') || "";

        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;
        let allEmojis = [];
        let catMap = {}; 
        let activeCategory = null;

        let charCountTimeout;
        draft.addEventListener('input', () => { 
            clearTimeout(charCountTimeout);
            charCountTimeout = setTimeout(() => {
                charCount.textContent = draft.value.length + ' chars';
            }, 100);
        });

        // 🔥 Smart Background Loading System 🔥
        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="loading">Loading emojis...</div>';
            
            // Step 1: Fetch first 100 instantly
            await fetchPage(1, 100, true);
            
            // Step 2: Fetch the rest silently in background
            fetchRemainingInBackground();
        }

        async function fetchPage(page, limit, isFirstLoad = false) {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();
                
                if (data.length === 0) return 0;

                allEmojis.push(...data);
                
                let newCategoryAdded = false;
                data.forEach(emoji => {
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        newCategoryAdded = true;
                        createCategoryButton(packId, emoji.image_url);
                    }
                });
                
                if (isFirstLoad && Object.keys(catMap).length > 0) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                } else if (!isFirstLoad && activeCategory) {
                    // If background fetch brings emojis for currently viewed category, update view
                    const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                    if (newlyAdded.length > 0) {
                        appendEmojisToGrid(newlyAdded);
                    }
                }
                return data.length;
            } catch (err) {
                if(isFirstLoad) keyboard.innerHTML = `<div class="error">❌ ${err.message}</div>`;
                return 0;
            }
        }

        async function fetchRemainingInBackground() {
            let page = 2;
            const limit = 100;
            while (true) {
                const count = await fetchPage(page, limit, false);
                if (count < limit) break; // Stop if no more data
                page++;
            }
        }

        function renderEmojis() {
            keyboard.innerHTML = '';
            let filteredEmojis = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            if (filteredEmojis.length === 0) {
                keyboard.innerHTML = '<div class="empty">Loading...</div>';
                return;
            }
            appendEmojisToGrid(filteredEmojis);
            emojiArea.scrollTop = 0;
        }

        function appendEmojisToGrid(emojis) {
            const fragment = document.createDocumentFragment();
            emojis.forEach(emoji => {
                const div = createEmojiElement(emoji);
                fragment.appendChild(div);
            });
            keyboard.appendChild(fragment);
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.dataset.emojiId = emoji.id;
            
            const mediaEl = document.createElement('img');
            mediaEl.className = 'media-container';
            
            let fullUrl = emoji.image_url;
            if (fullUrl && fullUrl.startsWith('/')) {
                fullUrl = apiBase + fullUrl;
            }
            
            // Lazy loading attribute for speed
            mediaEl.setAttribute('loading', 'lazy');
            mediaEl.src = fullUrl || TRANSPARENT_PIXEL;
            mediaEl.onerror = function() { this.style.opacity = '0.3'; };
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji.symbol || '⭐';
            
            div.appendChild(mediaEl);
            div.appendChild(label);
            div.onclick = () => insertEmoji(emoji);
            
            return div;
        }

        function createCategoryButton(packId, imageUrl) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onclick = () => filterEmojis(packId, div);
            
            const mediaEl = document.createElement('img');
            mediaEl.className = 'media-container';
            mediaEl.setAttribute('loading', 'lazy');
            
            let fullUrl = imageUrl;
            if (fullUrl && fullUrl.startsWith('/')) {
                fullUrl = apiBase + fullUrl;
            }
            mediaEl.src = fullUrl || TRANSPARENT_PIXEL;
            mediaEl.onerror = function() { this.style.opacity = '0.3'; };
            
            div.appendChild(mediaEl);
            
            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.substring(0, 8);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (activeCategory === categoryId) return; 
            activeCategory = categoryId;
            
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            
            renderEmojis();
            
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;
            
            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;
            
            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));
            
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) { Telegram.showAlert('Please write something first!'); return; }
            for (let code in emojiMap) text = text.split(code).join(emojiMap[code]); 
            Telegram.sendData(JSON.stringify({ text: text }));
        }

        // Start the magic
        loadEmojis();
    </script>
</body>
</html>
