<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #0088cc;
            --accent-hover: #0077b3;
            --text: #ffffff;
            --text-secondary: #888888;
            --purple-glow: rgba(160, 32, 240, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Rain Animation CSS --- */
        .rain-drop {
            position: fixed;
            top: -10vh;
            width: 2px;
            height: 15px;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.15));
            z-index: 0;
            animation: fall linear forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 8px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section { margin-bottom: 20px; position: relative; z-index: 10; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* --- Floating Draft Area with Purple Shadow --- */
        .draft-area {
            width: 100%;
            min-height: 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px var(--purple-glow);
            animation: floatBox 3.5s ease-in-out infinite;
        }

        @keyframes floatBox {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(160, 32, 240, 0.6); }
            100% { transform: translateY(0px); }
        }

        .draft-area:focus {
            outline: none;
            border-color: #a020f0;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.8);
        }

        .draft-area::placeholder { color: #555; }

        /* --- Expandable Emoji Section --- */
        .emoji-wrapper {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            overflow: hidden;
        }

        .emoji-scroll-area {
            max-height: 145px; /* ৩ লাইন ইমোজি দেখানোর জন্য */
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .emoji-scroll-area.expanded {
            max-height: 50vh; /* খোলার পর স্ক্রল করা যাবে */
            overflow-y: auto;
        }

        .emoji-fade {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--surface));
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .emoji-scroll-area.expanded + .emoji-fade {
            opacity: 0; /* খুললে ফেড মুছে যাবে */
        }

        /* --- Smaller Emojis --- */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); /* সাইজ ছোট করা হয়েছে */
            gap: 8px;
        }

        .emoji-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 4px; /* প্যাডিং কমানো হয়েছে */
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .emoji-item:active {
            transform: scale(0.90);
            border-color: var(--accent);
            background: rgba(160, 32, 240, 0.2);
        }

        .emoji-item img {
            width: 26px; /* ছবি অনেক ছোট করা হয়েছে */
            height: 26px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            pointer-events: none;
        }

        .emoji-item .label {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Expand Button */
        .toggle-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            padding-top: 12px;
            cursor: pointer;
            border-top: 1px solid var(--border);
            margin-top: 5px;
        }
        
        .toggle-btn span { margin-right: 5px; }

        .loading, .empty, .error {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-secondary);
            font-size: 13px;
            grid-column: 1 / -1;
        }

        .error { color: #ff4444; }

        .send-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            padding: 16px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .send-btn button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3);
        }

        .send-btn button:active { background: var(--accent-hover); transform: scale(0.98); }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type your post here... Tap emojis below to insert them."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid">
                    <div class="loading">Loading emojis...</div>
                </div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis</span> <span id="toggleIcon">🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send to Bot</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let emojis = [];
        let emojiMap = {};
        let emojiCounter = 1;

        // --- Rain Animation Logic ---
        function createRainDrop() {
            const drop = document.createElement('div');
            drop.classList.add('rain-drop');
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            drop.style.opacity = Math.random() * 0.5 + 0.1;
            document.body.appendChild(drop);
            
            setTimeout(() => { drop.remove(); }, 2500);
        }
        setInterval(createRainDrop, 100); // প্রতি ১০০ মিলিসেকেন্ডে বৃষ্টি পড়বে

        // --- Emoji Toggle Logic ---
        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis";
                toggleIcon.textContent = "🔼";
            } else {
                toggleText.textContent = "Show All Emojis";
                toggleIcon.textContent = "🔽";
                emojiArea.scrollTop = 0; // গুটিয়ে ফেলার সময় উপরে চলে যাবে
            }
        }

        draft.addEventListener('input', () => {
            charCount.textContent = draft.value.length + ' chars';
        });

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }

            try {
                const res = await fetch(`${apiBase}/api/emojis`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                emojis = await res.json();

                if (emojis.length === 0) {
                    keyboard.innerHTML = '<div class="empty">No emojis in database.<br>Ask admin to add some!</div>';
                    return;
                }

                keyboard.innerHTML = '';
                emojis.forEach((emoji) => {
                    const div = document.createElement('div');
                    div.className = 'emoji-item';
                    div.title = emoji.type === 'mapped' ? `${emoji.symbol} (${emoji.id})` : emoji.id;

                    const img = document.createElement('img');
                    img.src = emoji.image_url;
                    img.alt = emoji.symbol || emoji.id;
                    img.loading = 'lazy';
                    img.onerror = function() {
                        this.style.opacity = '0.3';
                        this.parentElement.style.cursor = 'not-allowed';
                    };

                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = emoji.symbol || emoji.id.slice(-6);

                    div.appendChild(img);
                    div.appendChild(label);
                    div.onclick = () => insertEmoji(emoji);
                    keyboard.appendChild(div);
                });
            } catch (err) {
                keyboard.innerHTML = '<div class="error">❌ Failed to load emojis.<br>Check API connection.</div>';
                console.error(err);
            }
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;

            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;

            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));

            if (Telegram.HapticFeedback) {
                Telegram.HapticFeedback.impactOccurred('light');
            }
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) {
                Telegram.showAlert('Please write something first!');
                return;
            }

            for (let code in emojiMap) {
                text = text.split(code).join(emojiMap[code]);
            }

            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
