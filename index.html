<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* 🔥 Ultra-Premium UI Variables 🔥 */
        :root { 
            --bg: #f4f7f6; 
            --surface: #ffffff; 
            --border: #e0e5ec; 
            --accent: #007aff; 
            --accent-hover: #005bb5; 
            --text: #1a1a1a; 
            --text-secondary: #6e7681; 
            --glow: rgba(0, 122, 255, 0.2); 
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-strong: 0 12px 32px rgba(0, 122, 255, 0.15);
            --rain-color: rgba(0, 0, 0, 0.35); 
        }

        /* 🔥 Dark Mode Variables 🔥 */
        [data-theme="dark"] {
            --bg: #0a0a0a; 
            --surface: #1c1c1e; 
            --border: #2c2c2e; 
            --accent: #0a84ff; 
            --accent-hover: #0066cc; 
            --text: #f5f5f7; 
            --text-secondary: #98989d; 
            --glow: rgba(10, 132, 255, 0.2); 
            --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 12px 32px rgba(10, 132, 255, 0.15);
            --rain-color: rgba(148, 0, 211, 0.7); 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; 
            padding: 20px 16px 120px 16px; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* 🔥 Visible & Slow Rain Effect 🔥 */
        .rain-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .drop {
            position: absolute;
            background: linear-gradient(to bottom, transparent, var(--rain-color));
            width: 2.5px;
            height: 30px;
            border-radius: 3px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* 🔥 Premium Header with Settings 🔥 */
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 16px 20px; border-radius: 18px;
            box-shadow: var(--shadow-soft); margin-bottom: 24px;
            border: 1px solid var(--border); position: relative; z-index: 20;
        }
        .header-title {
            font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--accent), #00c6ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px;
        }
        .settings-btn {
            background: none; border: none; font-size: 22px; cursor: pointer;
            color: var(--text-secondary); transition: transform 0.2s;
        }
        .settings-btn:active { transform: rotate(45deg); }

        .settings-menu {
            position: absolute; top: 65px; right: 0; background: var(--surface);
            border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-strong);
            padding: 8px; display: none; flex-direction: column; gap: 5px; min-width: 150px;
            transform-origin: top right; animation: scaleIn 0.2s ease-out;
        }
        .settings-menu.show { display: flex; }
        .settings-item {
            padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
            color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 10px;
            background: transparent; border: none; text-align: left; width: 100%;
        }
        .settings-item:hover { background: var(--bg); }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* 🔥 Main Sections 🔥 */
        .main-view { display: block; animation: fadeIn 0.4s ease-out; }
        .history-view { display: none; position: relative; z-index: 10; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .section { margin-bottom: 24px; position: relative; z-index: 10; }
        
        .section-title { 
            font-size: 13px; font-weight: 800; color: var(--text-secondary); 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; 
            display: flex; align-items: center; gap: 6px;
        }
        
        /* 🔥 Rich Text Draft Area 🔥 */
        .draft-area { 
            width: 100%; min-height: 150px; background: var(--surface); 
            border: 1.5px solid var(--border); border-radius: 16px; padding: 16px; 
            color: var(--text); font-size: 16px; line-height: 1.6; 
            font-family: inherit; box-shadow: var(--shadow-soft); 
            overflow-y: auto; word-wrap: break-word; outline: none;
        }
        .draft-area[placeholder]:empty:before {
            content: attr(placeholder);
            color: #999;
            font-style: italic;
            pointer-events: none;
            display: block;
        }
        .draft-area:focus { border-color: var(--accent); box-shadow: var(--shadow-strong); transform: translateY(-2px); }
        
        /* 🔥 Fixed Formatting Toolbar 🔥 */
        .format-toolbar {
            display: flex; overflow-x: auto; gap: 8px; margin-top: 12px; margin-bottom: 5px;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
            background: var(--surface); padding: 8px; border-radius: 12px;
            border: 1.5px solid var(--border); box-shadow: var(--shadow-soft);
        }
        .format-toolbar::-webkit-scrollbar { display: none; }
        .format-btn {
            background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 6px 12px; border-radius: 8px;
            font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
            transition: 0.2s;
        }
        .format-btn:active {
            background: var(--glow); border-color: var(--accent);
            transform: scale(0.95);
        }

        /* 🔥 Updated Spoiler Class 🔥 */
        .tg-spoiler { background: var(--border); color: transparent; border-radius: 4px; padding: 0 4px; transition: 0.3s; cursor: pointer; }
        .tg-spoiler:active { background: transparent; color: inherit; }

        /* 🔥 Category Row 🔥 */
        .category-hint { font-size: 12px; color: #888; margin-bottom: 12px; font-style: italic; }
        .category-row { 
            display: flex; overflow-x: auto; gap: 14px; padding: 10px 5px 20px 5px; 
            margin-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; 
        }
        .category-row::-webkit-scrollbar { display: none; }
        
        .category-item { 
            flex: 0 0 auto; background: var(--surface); border: 1.5px solid var(--border); 
            border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: center; 
            box-shadow: var(--shadow-soft); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-width: 65px; 
        }
        .category-item.active-cat { 
            border-color: var(--accent); box-shadow: var(--shadow-strong); 
            background: var(--glow); transform: translateY(-4px) scale(1.05); 
        }
        .category-item img { width: 34px; height: 34px; object-fit: contain; pointer-events: none; display: block; }
        .category-item .normal-emoji { font-size: 12px; font-weight: 600; line-height: 1; margin-top: 6px; color: var(--text-secondary); }
        .category-item.active-cat .normal-emoji { color: var(--accent); }
        
        /* 🔥 Emoji Grid 🔥 */
        .emoji-wrapper { 
            position: relative; background: var(--surface); border: 1.5px solid var(--border); 
            border-radius: 16px; padding: 12px; overflow: hidden; box-shadow: var(--shadow-soft); 
        }
        .emoji-scroll-area { 
            height: 160px; overflow-y: auto; overflow-x: hidden; 
            -webkit-overflow-scrolling: touch; position: relative; 
        }
        .emoji-scroll-area::-webkit-scrollbar { width: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        .emoji-fade { position: absolute; bottom: 35px; left: 0; right: 0; height: 30px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
        
        .emoji-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); 
            gap: 10px; padding-bottom: 10px;
        }
        
        .emoji-item { 
            background: var(--bg); border: 1px solid var(--border); border-radius: 12px; 
            padding: 8px 4px; cursor: pointer; text-align: center; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            height: 58px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .emoji-item:active { transform: scale(0.85); border-color: var(--accent); background: var(--glow); box-shadow: none; }
        .emoji-item img { width: 28px; height: 28px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
        .emoji-item .label { font-size: 10px; color: var(--text-secondary); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: 600; }
        
        .scroll-hint { 
            display: flex; justify-content: center; align-items: center; width: 100%; 
            background: transparent; color: var(--text-secondary); font-size: 12px; 
            font-weight: 600; padding-top: 12px; border-top: 1px solid var(--border); 
            margin-top: 8px; pointer-events: none; 
        }
        
        .loading, .empty, .error { text-align: center; padding: 40px 10px; color: var(--text-secondary); font-size: 14px; grid-column: 1 / -1; font-weight: 600; }
        
        /* 🔥 Floating Action Button 🔥 */
        .send-btn-wrapper { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; z-index: 100; 
        }
        .send-btn { 
            width: 100%; background: linear-gradient(135deg, var(--accent), #00c6ff); 
            color: #fff; border: none; border-radius: 100px; padding: 16px; 
            font-size: 17px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.4); 
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .send-btn:active { transform: scale(0.94); box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3); }
        .send-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--text-secondary); font-weight: 600;}

        /* 🔥 History UI 🔥 */
        .history-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-soft); cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .history-card:active { transform: scale(0.98); box-shadow: none; }
        .history-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
        .history-text { font-size: 15px; color: var(--text); line-height: 1.5; word-wrap: break-word; pointer-events: none; }
        .history-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-weight: 700; flex: 1; cursor: pointer; text-align: center; }
        .btn-danger { background: #ff3b30; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; flex: 1; cursor: pointer; text-align: center; }
    </style>
</head>
<body>
    <div class="rain-container" id="rainContainer"></div>

    <div class="header-container">
        <div class="header-title">✨ Premium Post</div>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        
        <div class="settings-menu" id="settingsMenu">
            <button class="settings-item" onclick="toggleTheme()">🌗 Toggle Theme</button>
            <button class="settings-item" onclick="showHistory()">🕒 History</button>
        </div>
    </div>

    <div id="mainView" class="main-view">
        <div class="section">
            <div class="stats">
                <span class="section-title">📝 Draft</span>
                <span id="charCount">0 chars</span>
            </div>
            
            <div class="draft-area" id="draft" contenteditable="true" placeholder="Type your post here... Select text and tap buttons below to format."></div>

            <div class="format-toolbar" id="formatToolbar">
                <button class="format-btn" onclick="applyFormat('b')"><b>B</b></button>
                <button class="format-btn" onclick="applyFormat('i')"><i>I</i></button>
                <button class="format-btn" onclick="applyFormat('u')"><u>U</u></button>
                <button class="format-btn" onclick="applyFormat('s')"><s>S</s></button>
                <button class="format-btn" onclick="applyFormat('code')">Mono</button>
                <button class="format-btn" onclick="applyFormat('tg-spoiler')">Spoiler</button>
                <button class="format-btn" onclick="applyFormat('blockquote')">Quote</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">📁 Emoji Categories</div>
            <div class="category-hint">👇 Click a pack to view its premium emojis</div>
            <div class="category-row" id="categoryRow"></div>
        </div>

        <div class="section">
            <div class="section-title">⌨️ Premium Keyboard</div>
            <div class="emoji-wrapper">
                <div class="emoji-scroll-area" id="emojiArea">
                    <div id="emojiKeyboard" class="emoji-grid"></div>
                </div>
                <div class="emoji-fade" id="fadeEffect"></div>
                <div class="scroll-hint">
                    👇 Scroll down for more emojis 👇
                </div>
            </div>
        </div>

        <div class="send-btn-wrapper">
            <button class="send-btn" id="sendBtn" onclick="sendData()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                Send to Bot
            </button>
        </div>
    </div>

    <div id="historyView" class="history-view">
        <div class="section-title" style="font-size: 16px; margin-bottom: 16px;">🕒 Your Post History</div>
        <div id="historyList"></div>
        
        <div class="history-actions">
            <button class="btn-secondary" onclick="showMain()">🏠 Home</button>
            <button class="btn-danger" onclick="clearHistory()">🗑 Clear All</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            toggleSettings();
        }
        if(localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        function createRain() {
            const container = document.getElementById('rainContainer');
            const dropCount = 25; 
            for (let i = 0; i < dropCount; i++) {
                let drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 2 + 2) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(drop);
            }
        }
        createRain();

        function saveToHistory(htmlContent) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            history.unshift({ html: htmlContent, date: new Date().toLocaleString(), map: emojiMap });
            if(history.length > 20) history.pop(); 
            localStorage.setItem('postHistory', JSON.stringify(history));
        }

        function showHistory() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('historyView').style.display = 'block';
            toggleSettings();
            
            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            
            if(history.length === 0) {
                list.innerHTML = '<div class="empty">No history found.</div>';
                return;
            }

            list.innerHTML = '';
            history.forEach((item, index) => {
                list.innerHTML += `
                    <div class="history-card" onclick="loadFromHistory(${index})">
                        <div class="history-header">
                            <span style="color:var(--accent);">#${history.length - index} (Tap to Edit) ✏️</span>
                            <span>${item.date}</span>
                        </div>
                        <div class="history-text">${item.html}</div>
                    </div>
                `;
            });
        }

        function loadFromHistory(index) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            if(history[index]) {
                draft.innerHTML = history[index].html;
                if(history[index].map) {
                    Object.assign(emojiMap, history[index].map);
                    emojiCounter += Object.keys(history[index].map).length + 10;
                }
                showMain();
                draft.focus();
                draft.dispatchEvent(new Event('input'));
                window.scrollTo(0, 0);
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');
            }
        }

        function showMain() {
            document.getElementById('historyView').style.display = 'none';
            document.getElementById('mainView').style.display = 'block';
        }

        function clearHistory() {
            if(confirm("Are you sure you want to clear all history?")) {
                localStorage.removeItem('postHistory');
                showHistory();
            }
        }

        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api') || "";

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;
        let allEmojis = [];
        let catMap = {}; 
        let activeCategory = null;

        const TRANSPARENT_PIXEL = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    if (el.tagName === 'IMG' && el.dataset.realSrc) {
                        const src = el.dataset.realSrc;
                        el.removeAttribute('data-real-src');
                        lazyLoadObserver.unobserve(el); 
                        
                        fetch(src, { headers: { 'ngrok-skip-browser-warning': '69420' } })
                            .then(response => {
                                if (!response.ok) throw new Error('Network response failed');
                                return response.blob();
                            })
                            .then(blob => { el.src = URL.createObjectURL(blob); })
                            .catch(err => { el.style.opacity = '0.3'; });
                    }
                }
            });
        }, { root: emojiArea, rootMargin: '100px 0px', threshold: 0 });

        let charCountTimeout;
        draft.addEventListener('input', () => { 
            clearTimeout(charCountTimeout);
            charCountTimeout = setTimeout(() => {
                charCount.textContent = draft.innerText.length + ' chars';
            }, 100);
        });

        draft.addEventListener('paste', function(e) {
            e.preventDefault();
            let text = (e.originalEvent || e).clipboardData.getData('text/plain');
            document.execCommand('insertText', false, text);
        });

        // 🔥 FORMATTING LOGIC (Fixed for Spoiler bypassing ExecCommand stripping) 🔥
        function applyFormat(tag) {
            draft.focus();
            
            if (tag === 'b') { document.execCommand('bold', false, null); return; }
            if (tag === 'i') { document.execCommand('italic', false, null); return; }
            if (tag === 'u') { document.execCommand('underline', false, null); return; }
            if (tag === 's') { document.execCommand('strikeThrough', false, null); return; }

            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) {
                if(Telegram.showAlert) Telegram.showAlert('Please select some text first!');
                return;
            }
            
            const selectedText = sel.toString();
            if (!selectedText) return;

            let htmlToInsert = '';
            if (tag === 'code') htmlToInsert = `<code>${selectedText}</code>&nbsp;`;
            // 🔥 Using standard span class so browsers don't delete it
            else if (tag === 'tg-spoiler') htmlToInsert = `<span class="tg-spoiler">${selectedText}</span>&nbsp;`;
            else if (tag === 'blockquote') htmlToInsert = `<blockquote>${selectedText}</blockquote>&nbsp;`;

            document.execCommand('insertHTML', false, htmlToInsert);
            
            draft.dispatchEvent(new Event('input'));
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function insertEmoji(emoji) {
            draft.focus();
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;
            
            const sel = window.getSelection();
            if (sel.getRangeAt && sel.rangeCount) {
                let range = sel.getRangeAt(0);
                if (!draft.contains(range.commonAncestorContainer)) {
                    range.selectNodeContents(draft);
                    range.collapse(false);
                }
                range.deleteContents();
                let textNode = document.createTextNode(shortCode + ' ');
                range.insertNode(textNode);
                
                range.setStartAfter(textNode);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
            } else {
                draft.appendChild(document.createTextNode(shortCode + ' '));
            }
            
            draft.dispatchEvent(new Event('input'));
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="loading">Loading emojis...</div>';
            await fetchPage(1, 1000, true);
            fetchRemainingInBackground();
        }

        async function fetchPage(page, limit, isFirstLoad = false) {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, { 
                    headers: { 'ngrok-skip-browser-warning': '69420' } 
                });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();
                if (data.length === 0) return 0;

                allEmojis.push(...data);
                
                data.forEach(emoji => {
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        createCategoryButton(packId, emoji.image_url);
                    }
                });
                
                if (isFirstLoad && Object.keys(catMap).length > 0) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                } else if (!isFirstLoad && activeCategory) {
                    const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                    if (newlyAdded.length > 0) {
                        appendEmojisToGrid(newlyAdded);
                    }
                }
                return data.length;
            } catch (err) {
                if(isFirstLoad) keyboard.innerHTML = `<div class="error">❌ ${err.message}</div>`;
                return 0;
            }
        }

        async function fetchRemainingInBackground() {
            let page = 2;
            const limit = 1000;
            while (true) {
                const count = await fetchPage(page, limit, false);
                if (count < limit) break; 
                page++;
            }
        }

        function renderEmojis() {
            keyboard.innerHTML = '';
            let filteredEmojis = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            if (filteredEmojis.length === 0) {
                keyboard.innerHTML = '<div class="empty">Loading...</div>';
                return;
            }
            appendEmojisToGrid(filteredEmojis);
            emojiArea.scrollTop = 0;
        }

        function appendEmojisToGrid(emojis) {
            const fragment = document.createDocumentFragment();
            emojis.forEach(emoji => {
                const div = createEmojiElement(emoji);
                fragment.appendChild(div);
            });
            keyboard.appendChild(fragment);
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.dataset.emojiId = emoji.id;
            
            const mediaEl = document.createElement('img');
            mediaEl.className = 'media-container';
            mediaEl.src = TRANSPARENT_PIXEL;
            
            let fullUrl = emoji.image_url;
            if (fullUrl && fullUrl.startsWith('/')) { fullUrl = apiBase + fullUrl; }
            mediaEl.dataset.realSrc = fullUrl;
            
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji.symbol || '⭐';
            
            div.appendChild(mediaEl);
            div.appendChild(label);
            div.onclick = () => insertEmoji(emoji);
            
            lazyLoadObserver.observe(mediaEl);
            return div;
        }

        function createCategoryButton(packId, imageUrl) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onclick = () => filterEmojis(packId, div);
            
            const mediaEl = document.createElement('img');
            mediaEl.className = 'media-container';
            mediaEl.src = TRANSPARENT_PIXEL;
            
            let fullUrl = imageUrl;
            if (fullUrl && fullUrl.startsWith('/')) { fullUrl = apiBase + fullUrl; }
            
            if (fullUrl) {
                fetch(fullUrl, { headers: { 'ngrok-skip-browser-warning': '69420' } })
                    .then(res => res.blob())
                    .then(blob => { mediaEl.src = URL.createObjectURL(blob); })
                    .catch(() => { mediaEl.style.opacity = '0.3'; });
            }
            
            div.appendChild(mediaEl);
            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.substring(0, 8);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (activeCategory === categoryId) return; 
            activeCategory = categoryId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            renderEmojis();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        // 🔥 STRICT HTML SANITIZER FOR TELEGRAM 🔥
        function sanitizeTelegramHTML(rootNode) {
            let out = "";
            for (let node of rootNode.childNodes) {
                if (node.nodeType === Node.TEXT_NODE) {
                    let text = node.textContent;
                    out += text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    let tag = node.tagName.toLowerCase();
                    let inner = sanitizeTelegramHTML(node);
                    
                    if (tag === 'br') { out += '\n'; }
                    else if (tag === 'div' || tag === 'p') { out += '\n' + inner; }
                    else if (['b', 'strong'].includes(tag)) { out += `<b>${inner}</b>`; }
                    else if (['i', 'em'].includes(tag)) { out += `<i>${inner}</i>`; }
                    else if (['u', 'ins'].includes(tag)) { out += `<u>${inner}</u>`; }
                    else if (['s', 'strike', 'del'].includes(tag)) { out += `<s>${inner}</s>`; }
                    else if (tag === 'code') { out += `<code>${inner}</code>`; }
                    else if (tag === 'pre') { out += `<pre>${inner}</pre>`; }
                    else if (tag === 'blockquote') { out += `<blockquote>${inner}</blockquote>`; }
                    // 🔥 Magic Trick: Converter changes 'span.tg-spoiler' into actual '<tg-spoiler>' for the Bot
                    else if (tag === 'tg-spoiler' || (tag === 'span' && node.classList && node.classList.contains('tg-spoiler'))) { 
                        out += `<tg-spoiler>${inner}</tg-spoiler>`; 
                    }
                    else if (tag === 'a') { out += `<a href="${node.getAttribute('href')}">${inner}</a>`; }
                    else { out += inner; } 
                }
            }
            return out;
        }

        // 🔥 FINAL DATA SENDER 🔥
        function sendData() {
            if (!draft.innerText.trim()) { Telegram.showAlert('Please write something first!'); return; }
            
            saveToHistory(draft.innerHTML);

            let cleanText = sanitizeTelegramHTML(draft);
            
            cleanText = cleanText.replace(/\n{3,}/g, '\n\n'); 
            cleanText = cleanText.replace(/\u00A0/g, " "); 
            cleanText = cleanText.replace(/&nbsp;/gi, " ");
            
            for (let code in emojiMap) {
                cleanText = cleanText.split(code).join(emojiMap[code]); 
            }
            
            Telegram.sendData(JSON.stringify({ text: cleanText.trim() }));
        }

        loadEmojis();
    </script>
</body>
</html>
