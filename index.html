<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        /* 🔥 White Premium UI 🔥 */
        :root { 
            --bg: #f0f2f5; 
            --surface: #ffffff; 
            --border: #e4e6eb; 
            --accent: #0088cc; 
            --accent-hover: #0077b3; 
            --text: #050505; 
            --text-secondary: #65676b; 
            --glow: rgba(0, 136, 204, 0.15); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; padding-bottom: 100px; min-height: 100vh; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 24px; padding-top: 8px; position: relative; z-index: 10; }
        .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; color: #1c1e21; }
        .header p { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        
        .section { margin-bottom: 20px; position: relative; z-index: 10; }
        .section-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.8px; }
        
        .draft-area { width: 100%; min-height: 140px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; color: var(--text); font-size: 15px; line-height: 1.5; resize: vertical; font-family: inherit; transition: border-color 0.2s, box-shadow 0.3s; box-shadow: 0 4px 15px var(--glow); }
        .draft-area:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 20px var(--glow); }
        
        .category-hint { font-size: 11px; color: #888888; margin-bottom: 10px; font-style: italic; }
        .category-row { display: flex; overflow-x: auto; gap: 12px; padding: 10px 5px 25px 5px; margin-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .category-row::-webkit-scrollbar { display: none; }
        
        .category-item { flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: center; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px; transition: transform 0.1s, box-shadow 0.2s; }
        .category-item.active-cat { border-color: var(--accent); box-shadow: 0 4px 15px var(--glow); background: #f2f9ff; transform: translateY(-2px); }
        .category-item .media-container { width: 32px; height: 32px; object-fit: contain; pointer-events: none; display: block; }
        .category-item .normal-emoji { font-size: 14px; line-height: 1; margin-top: 4px; }
        
        .emoji-wrapper { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .emoji-scroll-area { max-height: 145px; overflow-y: auto; overflow-x: hidden; transition: max-height 0.3s; -webkit-overflow-scrolling: touch; will-change: scroll-position; position: relative; }
        .emoji-scroll-area.expanded { max-height: 50vh; }
        .emoji-fade { position: absolute; bottom: 40px; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; transition: opacity 0.3s; }
        .emoji-scroll-area.expanded + .emoji-fade { opacity: 0; }
        
        /* 🔥 Virtual Scroll Optimized Grid 🔥 */
        .emoji-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); 
            gap: 8px;
            contain: layout style paint;
            position: relative;
        }
        .emoji-item { 
            background: #f8f9fa; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 6px 4px; 
            cursor: pointer; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            contain: strict; 
            transform: translateZ(0); 
            will-change: transform;
            height: 54px;
            min-height: 54px;
        }
        .emoji-item:active { transform: scale(0.9) translateZ(0); border-color: var(--accent); background: #e6f3ff; }
        .emoji-item .media-container { width: 26px; height: 26px; object-fit: contain; display: block; margin: 0 auto; pointer-events: none; }
        .emoji-item .label { font-size: 9px; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; font-weight: 500; }
        
        .toggle-btn { display: flex; justify-content: center; align-items: center; width: 100%; background: transparent; border: none; color: var(--accent); font-size: 13px; font-weight: 700; padding-top: 12px; cursor: pointer; border-top: 1px solid var(--border); margin-top: 5px; }
        
        .loading, .empty, .error { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 13px; grid-column: 1 / -1; font-weight: 600; }
        .error { color: #dc3545; }
        
        .send-btn { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); padding: 16px; border-top: 1px solid var(--border); z-index: 100; box-shadow: 0 -4px 15px rgba(0,0,0,0.03); }
        .send-btn button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px var(--glow); transition: transform 0.1s, background 0.2s; }
        .send-btn button:active { background: var(--accent-hover); transform: scale(0.96); }
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); font-weight: 600;}
        
        /* Loading Spinner */
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type your post here... Tap emojis below to insert them."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Emoji Categories</div>
        <div class="category-hint">👇 Click a pack to view its premium emojis</div>
        <div class="category-row" id="categoryRow"></div>
    </div>

    <div class="section">
        <div class="section-title">Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid"></div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis</span> <span id="toggleIcon">🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send to Bot</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api') || "";

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;
        let allEmojis = [];
        let catMap = {}; 
        let activeCategory = null;
        let isLoading = false;

        // 🚀 VIRTUAL SCROLLING ENGINE 
        const lottieInstances = new Map();
        let CHUNK_SIZE = 15; // Initial chunk size, will be dynamically calculated
        const TRANSPARENT_PIXEL = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
        
        let currentChunkIndex = 0;
        let filteredEmojis = [];
        let isRendering = false;
        let renderSessionId = 0;

        // 🔥 Ultra-Fast Native Loader (Direct URL processing)
        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const el = entry.target;
                
                if (entry.isIntersecting) {
                    if (el.dataset.lottieUrl && !lottieInstances.has(el)) {
                        const anim = lottie.loadAnimation({
                            container: el,
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            path: el.dataset.lottieUrl, // 🔥 Fetching natively from URL! No base64 lag!
                            rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
                        });
                        lottieInstances.set(el, anim);
                    } else if (el.tagName === 'IMG' && el.dataset.realSrc) {
                        el.src = el.dataset.realSrc;
                        el.removeAttribute('data-real-src');
                    } else if (el.tagName === 'VIDEO' && el.dataset.realSrc) {
                        el.src = el.dataset.realSrc;
                        el.removeAttribute('data-real-src');
                        el.play().catch(()=>{});
                    }
                } else {
                    // RAM CLEANUP: Instantly destroy when out of view/category switched
                    if (lottieInstances.has(el)) {
                        const anim = lottieInstances.get(el);
                        anim.destroy();
                        lottieInstances.delete(el);
                        el.innerHTML = '';
                    } else if (el.tagName === 'VIDEO') {
                        el.pause();
                        el.removeAttribute('src');
                        el.load();
                    }
                }
            });
        }, {
            root: emojiArea,
            rootMargin: '400px 0px', 
            threshold: 0
        });

        let charCountTimeout;
        draft.addEventListener('input', () => { 
            clearTimeout(charCountTimeout);
            charCountTimeout = setTimeout(() => {
                charCount.textContent = draft.value.length + ' chars';
            }, 100);
        });

        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis";
                toggleIcon.textContent = "🔼";
            } else {
                toggleText.textContent = "Show All Emojis";
                toggleIcon.textContent = "🔽";
                emojiArea.scrollTop = 0; 
            }
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="loading">Loading emojis...</div>';
            await fetchFirstPage();
        }

        async function fetchFirstPage() {
            isLoading = true;
            const limit = 100;
            
            try {
                // Fetch fast (no base64 from python)
                const res = await fetch(`${apiBase}/api/emojis?page=1&limit=${limit}`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();
                
                allEmojis.push(...data);
                
                let isFirstCategory = Object.keys(catMap).length === 0;

                data.forEach(emoji => {
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        createCategoryButton(packId, emoji.image_url);
                    }
                });
                
                // Load the first category automatically
                if (isFirstCategory && activeCategory === null) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                }
                
                if (data.length === limit) fetchRemainingPages(2, limit);
                
            } catch (err) {
                keyboard.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            } finally {
                isLoading = false;
            }
        }

        async function fetchRemainingPages(startPage, limit) {
            let page = startPage;
            const MAX_PAGES = 20;
            try {
                while (page <= MAX_PAGES) {
                    const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, {
                        headers: { 'ngrok-skip-browser-warning': 'true' }
                    });
                    if (!res.ok) break;
                    const data = await res.json();
                    if (data.length === 0) break;
                    
                    allEmojis.push(...data);
                    
                    data.forEach(emoji => {
                        const packId = emoji.pack_id || 'Other';
                        if (!catMap[packId]) {
                            catMap[packId] = true;
                            createCategoryButton(packId, emoji.image_url);
                        }
                    });

                    if (activeCategory) {
                        const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                        if (newlyAdded.length > 0) filteredEmojis.push(...newlyAdded);
                    }
                    
                    if (data.length < limit) break; 
                    page++;
                }
            } catch (err) {}
        }

        function startChunkedRender() {
            filteredEmojis = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            if (filteredEmojis.length === 0) {
                keyboard.innerHTML = '<div class="empty">Loading emojis...</div>';
                return;
            }
            keyboard.innerHTML = '';
            
            // 🔥 LOGIC: Calculate 1/3 of the emojis in this category (Min 15 to cover small packs)
            CHUNK_SIZE = Math.max(15, Math.ceil(filteredEmojis.length / 3)); 
            
            currentChunkIndex = 0;
            renderSessionId++; 
            renderNextChunk(renderSessionId);
        }

        function renderNextChunk(sessionId) {
            if (sessionId !== renderSessionId) return;
            if (isRendering) return;
            if (currentChunkIndex >= filteredEmojis.length) return;
            
            isRendering = true;
            requestAnimationFrame(() => {
                if (sessionId !== renderSessionId) {
                    isRendering = false;
                    return;
                }

                const fragment = document.createDocumentFragment();
                const end = Math.min(currentChunkIndex + CHUNK_SIZE, filteredEmojis.length);
                
                for (let i = currentChunkIndex; i < end; i++) {
                    const div = createEmojiElement(filteredEmojis[i]);
                    fragment.appendChild(div);
                }
                
                keyboard.appendChild(fragment);
                currentChunkIndex = end;
                isRendering = false;
                
                if (currentChunkIndex < filteredEmojis.length) {
                    // Load the rest smoothly in the background
                    setTimeout(() => renderNextChunk(sessionId), 50);
                }
            });
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.dataset.emojiId = emoji.id;
            
            const mediaEl = createMediaElement(emoji.image_url, false);
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji.symbol || '⭐';
            
            div.appendChild(mediaEl);
            div.appendChild(label);
            div.onclick = () => insertEmoji(emoji);
            
            lazyLoadObserver.observe(mediaEl);
            return div;
        }

        function createMediaElement(url, isCategory = false) {
            let mediaEl;
            if (!url) url = "";
            const fullUrl = url.startsWith('/') ? apiBase + url : url; 

            // Checking for json URL or base64 (for category icons if any)
            if (url.endsWith('.json') || url.startsWith('data:application/json')) {
                mediaEl = document.createElement('div');
                mediaEl.className = 'media-container';
                if (!isCategory) {
                    mediaEl.dataset.lottieUrl = fullUrl;
                } else {
                    setTimeout(() => {
                        try {
                            if(url.startsWith('data:')) {
                                const b64Data = url.split(',')[1];
                                let jsonStr;
                                try { jsonStr = decodeURIComponent(escape(atob(b64Data))); } catch(e) { jsonStr = atob(b64Data); }
                                lottie.loadAnimation({ container: mediaEl, renderer: 'svg', loop: true, autoplay: true, animationData: JSON.parse(jsonStr), rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } });
                            } else {
                                lottie.loadAnimation({ container: mediaEl, renderer: 'svg', loop: true, autoplay: true, path: fullUrl, rendererSettings: { preserveAspectRatio: 'xMidYMid meet' } });
                            }
                        } catch(e) {}
                    }, 0);
                }
            } else if (url.endsWith('.webm') || url.startsWith('data:video')) {
                mediaEl = document.createElement('video');
                mediaEl.className = 'media-container';
                mediaEl.autoplay = true; mediaEl.loop = true; mediaEl.muted = true; 
                mediaEl.setAttribute('playsinline', ''); mediaEl.setAttribute('webkit-playsinline', '');
                if (!isCategory) mediaEl.dataset.realSrc = fullUrl; 
                else mediaEl.src = fullUrl;
            } else {
                mediaEl = document.createElement('img');
                mediaEl.className = 'media-container';
                mediaEl.src = TRANSPARENT_PIXEL;
                if (!isCategory) mediaEl.dataset.realSrc = fullUrl; 
                else mediaEl.src = fullUrl;
                mediaEl.onerror = function() { this.style.opacity = '0.3'; };
            }
            return mediaEl;
        }

        function createCategoryButton(packId, imageUrl) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onclick = () => filterEmojis(packId, div);
            const mediaEl = createMediaElement(imageUrl, true);
            div.appendChild(mediaEl);
            
            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.substring(0, 8);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (activeCategory === categoryId) return; 
            activeCategory = categoryId;
            renderSessionId++; // Stop previous category from loading further
            
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            
            // 🔥 COMPLETE MEMORY WIPE: Stops all animations and clears RAM for old category instantly
            lottieInstances.forEach(anim => anim.destroy());
            lottieInstances.clear();
            document.querySelectorAll('.emoji-item video').forEach(v => {
                v.pause(); v.removeAttribute('src'); v.load();
            });
            keyboard.innerHTML = ''; 
            
            startChunkedRender();
            if (!emojiArea.classList.contains('expanded')) toggleEmojiList();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        emojiArea.addEventListener('scroll', () => {
            if (emojiArea.scrollHeight - emojiArea.scrollTop - emojiArea.clientHeight < 300) {
                renderNextChunk(renderSessionId);
            }
        });

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;
            
            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;
            
            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));
            
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) { Telegram.showAlert('Please write something first!'); return; }
            for (let code in emojiMap) text = text.split(code).join(emojiMap[code]); 
            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
