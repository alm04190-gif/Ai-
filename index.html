<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Post Studio Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #eef3f9;
            --bg-ambient: radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.18), transparent 42%),
                          radial-gradient(circle at 88% 90%, rgba(124, 58, 237, 0.15), transparent 45%);
            --surface: #ffffff;
            --surface-2: #f3f6fb;
            --surface-3: #e5eaf3;
            --border: rgba(15, 23, 42, 0.09);
            --border-highlight: rgba(37, 99, 235, 0.45);
            --accent: #2563eb;
            --accent-2: #7c3aed;
            --accent-cyan: #06b6d4;
            --text: #0f172a;
            --text-muted: #64748b;
            --glow: rgba(37, 99, 235, 0.14);
            --shadow-card: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
            --shadow-btn: 0 10px 26px -4px rgba(37, 99, 235, 0.45);
            --shimmer-1: #e2e8f0;
            --shimmer-2: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-main: #060811;
            --bg-ambient: radial-gradient(circle at 10% 5%, rgba(56, 189, 248, 0.14), transparent 40%),
                          radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.15), transparent 42%),
                          radial-gradient(circle at 50% 95%, rgba(6, 182, 212, 0.12), transparent 45%);
            --surface: #0e1322;
            --surface-2: #161d31;
            --surface-3: #1f2942;
            --border: rgba(255, 255, 255, 0.09);
            --border-highlight: rgba(56, 189, 248, 0.55);
            --accent: #38bdf8;
            --accent-2: #8b5cf6;
            --accent-cyan: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glow: rgba(56, 189, 248, 0.16);
            --shadow-card: 0 12px 32px -6px rgba(0, 0, 0, 0.72);
            --shadow-btn: 0 10px 28px -4px rgba(56, 189, 248, 0.4);
            --shimmer-1: #161d31;
            --shimmer-2: #232e4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--bg-main);
            background-image: var(--bg-ambient);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            max-width: 540px;
            margin: 0 auto;
            padding: 8px 10px 10px 10px;
            gap: 8px;
            position: relative;
        }

        /* ================= LIVE ANIMATIONS FOR PREMIUM UI ICONS ================= */
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-2.5px) scale(1.08); }
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes wiggleGlow {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-8deg) scale(1.08); }
            75% { transform: rotate(8deg) scale(1.08); }
        }
        @keyframes rocketFly {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2.5px, -2.5px) scale(1.1); }
        }
        @keyframes borderGlowPulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.35), 0 0 22px rgba(139, 92, 246, 0.2), inset 0 0 8px rgba(56, 189, 248, 0.12);
                border-color: #38bdf8;
            }
            50% {
                box-shadow: 0 0 16px rgba(139, 92, 246, 0.55), 0 0 28px rgba(6, 182, 212, 0.35), inset 0 0 12px rgba(139, 92, 246, 0.18);
                border-color: #a855f7;
            }
        }
        @keyframes shimmerAnim {
            0% { background-position: -120px 0; }
            100% { background-position: 120px 0; }
        }

        .anim-float { animation: floatPulse 2.4s ease-in-out infinite; }
        .anim-wiggle { animation: wiggleGlow 2.6s ease-in-out infinite; }
        .anim-spin { animation: spinSlow 9s linear infinite; }
        .anim-rocket { animation: rocketFly 1.8s ease-in-out infinite; }

        .ui-prem-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(56, 189, 248, 0.35));
        }

        /* ================= HEADER ================= */
        .top-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 11px;
            box-shadow: var(--shadow-card);
            position: relative;
            z-index: 40;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.25));
            border: 1px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(56, 189, 248, 0.25);
        }
        .brand-logo img, .brand-logo svg {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, var(--text), var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-pill b {
            color: var(--accent);
            font-weight: 800;
        }

        .icon-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s, border-color 0.15s;
        }
        .icon-btn:active {
            transform: scale(0.88);
            border-color: var(--accent);
        }

        /* Dropdown Menu */
        .settings-menu {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--surface);
            border: 1.5px solid var(--border-highlight);
            border-radius: 14px;
            box-shadow: var(--shadow-card);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 175px;
            z-index: 100;
        }
        .settings-menu.show { display: flex; }
        .settings-item {
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            background: transparent;
            border: none;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }
        .settings-item:active { background: var(--glow); color: var(--accent); }

        /* ================= VIEWS ================= */
        .main-view {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            gap: 8px;
            overflow: hidden;
        }
        .history-view {
            display: none;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            gap: 10px;
            overflow: hidden;
        }

        /* ================= DRAFT STUDIO CARD ================= */
        .editor-card {
            flex-shrink: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 9px 11px 7px 11px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 7px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .editor-card:focus-within {
            border-color: var(--border-highlight);
            box-shadow: 0 0 0 3px var(--glow), var(--shadow-card);
        }

        .draft-area {
            width: 100%;
            min-height: 60px;
            max-height: 98px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            outline: none;
            word-wrap: break-word;
            user-select: text;
        }
        .draft-area:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            opacity: 0.65;
            font-size: 13.5px;
            pointer-events: none;
        }

        .inline-premium-emoji {
            width: 22px;
            height: 22px;
            vertical-align: -5px;
            margin: 0 1.5px;
            object-fit: contain;
            display: inline-block;
            pointer-events: none;
        }

        .draft-area b { font-weight: 800; }
        .draft-area i { font-style: italic; }
        .draft-area u { text-decoration: underline; }
        .draft-area s { text-decoration: line-through; }
        .draft-area code {
            background: var(--surface-3);
            padding: 1px 5px;
            border-radius: 5px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            color: var(--accent);
        }
        .draft-area tg-spoiler {
            background: var(--text-muted);
            color: transparent;
            border-radius: 4px;
            padding: 0 3px;
        }
        .draft-area blockquote {
            border-left: 3px solid var(--accent);
            background: var(--surface-2);
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 0 6px 6px 0;
            color: var(--text-muted);
            display: block;
        }

        /* Formatting Dock */
        .format-toolbar {
            display: flex;
            align-items: center;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 5px;
            scrollbar-width: none;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .format-toolbar::-webkit-scrollbar { display: none; }

        .format-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .format-btn:active {
            transform: scale(0.92);
            background: var(--glow);
            border-color: var(--accent);
            color: var(--accent);
        }
        .format-btn.kbd-pill {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(139, 92, 246, 0.18));
            border-color: var(--border-highlight);
            color: var(--accent);
        }

        /* ================= EMOJI VAULT CARD ================= */
        .vault-card {
            flex: 1 1 auto;
            min-height: 0;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 9px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 7px;
            overflow: hidden;
        }

        /* Glowing Neon Search Bar */
        .search-row {
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 13px;
            border: 1.5px solid #38bdf8;
            background: var(--surface-2);
            animation: borderGlowPulse 3.2s ease-in-out infinite;
        }
        .search-icon-box {
            position: absolute;
            left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            border-radius: 13px;
            padding: 9px 84px 9px 36px;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            outline: none;
        }
        .search-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .search-meta {
            position: absolute;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .match-count {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent);
            background: var(--glow);
            padding: 3px 6px;
            border-radius: 6px;
            display: none;
        }
        .match-count.visible { display: inline-block; }

        .search-clear {
            background: var(--surface-3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            cursor: pointer;
            display: none;
        }
        .search-clear.visible { display: inline-block; }

        /* Quick Filter Tag Chips with Real Premium Emojis */
        .quick-chips {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 6px;
            scrollbar-width: none;
            padding: 2px 1px;
        }
        .quick-chips::-webkit-scrollbar { display: none; }

        .chip-btn {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px 4px 7px;
            border-radius: 99px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .chip-btn img, .chip-btn svg {
            width: 17px;
            height: 17px;
            object-fit: contain;
            border-radius: 4px;
            pointer-events: none;
        }
        .chip-btn.active-chip {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.45);
        }
        .chip-btn:active { transform: scale(0.93); }

        /* Pack Category Strip */
        .category-row {
            flex-shrink: 0;
            display: flex;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            touch-action: pan-x;
            gap: 6px;
            padding: 2px 1px;
            scrollbar-width: none;
        }
        .category-row::-webkit-scrollbar { display: none; }

        .category-item {
            flex: 0 0 auto;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 11px;
            padding: 5px 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-item.active-cat {
            border-color: var(--accent);
            background: var(--glow);
        }
        .category-item:active { transform: scale(0.94); }
        .category-item .cat-img-wrap {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .category-item img.loaded { opacity: 1; }
        .category-item .normal-emoji {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .category-item.active-cat .normal-emoji {
            color: var(--text);
        }

        /* ================= SCROLLABLE EMOJI GRID ================= */
        .emoji-scroll-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: scroll !important;
            overflow-x: hidden;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            padding-right: 3px;
            position: relative;
        }
        .emoji-scroll-area::-webkit-scrollbar { width: 4px; }
        .emoji-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border-highlight);
            border-radius: 4px;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 7px;
            padding-bottom: 18px;
        }

        .emoji-item {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 5px 3px 4px 3px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 56px;
            transition: transform 0.1s, border-color 0.12s, background 0.12s;
            position: relative;
        }
        .emoji-item:active {
            transform: scale(0.85);
            border-color: var(--accent);
            background: var(--glow);
        }

        /* Shimmer Skeleton Placeholder (No Broken Image Ever!) */
        .emoji-img-box {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%);
            background-size: 240px 100%;
            animation: shimmerAnim 1.4s infinite linear;
        }
        .emoji-img-box.ready {
            background: transparent;
            animation: none;
        }

        .emoji-item img {
            width: 29px;
            height: 29px;
            object-fit: contain;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .emoji-item img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .emoji-item .label {
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 92%;
            text-align: center;
            font-weight: 600;
        }

        .state-msg {
            text-align: center;
            padding: 28px 10px;
            color: var(--text-muted);
            font-size: 13px;
            grid-column: 1 / -1;
            font-weight: 600;
        }

        /* ================= SEND BUTTON ================= */
        .send-btn-wrapper {
            flex-shrink: 0;
            width: 100%;
        }
        .send-btn {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 52%, #06b6d4 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
        }
        .send-btn:active {
            transform: scale(0.97);
            filter: brightness(1.1);
        }

        /* ================= HISTORY VIEW ================= */
        .history-list-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding-right: 3px;
        }
        .history-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 12px 14px;
            margin-bottom: 9px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
        }
        .history-card:active { border-color: var(--accent); background: var(--glow); }
        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .history-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            word-wrap: break-word;
        }
        .history-actions {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
        }
        .btn-secondary {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 12px;
            font-weight: 700;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- HEADER -->
        <div class="top-bar">
            <div class="brand-wrap">
                <div class="brand-logo anim-float" id="headerBrandIcon">
                    <!-- Animated Premium Crown/Star SVG (Auto-upgrades to DB Premium Emoji too) -->
                    <svg viewBox="0 0 36 36" fill="none">
                        <defs>
                            <linearGradient id="crownGrad" x1="0" y1="0" x2="36" y2="36">
                                <stop offset="0%" stop-color="#facc15"/>
                                <stop offset="50%" stop-color="#fb923c"/>
                                <stop offset="100%" stop-color="#ec4899"/>
                            </linearGradient>
                        </defs>
                        <path d="M4 26L7 11L14 18L18 7L22 18L29 11L32 26H4Z" fill="url(#crownGrad)" stroke="#fef08a" stroke-width="1.5" stroke-linejoin="round"/>
                        <circle cx="18" cy="5" r="2.2" fill="#fef08a"/>
                        <circle cx="6" cy="9" r="1.8" fill="#38bdf8"/>
                        <circle cx="30" cy="9" r="1.8" fill="#a855f7"/>
                    </svg>
                </div>
                <div class="brand-title">Post Studio Pro</div>
            </div>

            <div class="top-actions">
                <div class="stat-pill">
                    <b id="emojiCountBadge">0</b>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        // Theme Setup
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function toggleSettings() {
            document.getElementById('settingsMenu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.top-bar')) {
                document.getElementById('settingsMenu').classList.remove('show');
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = (urlParams.get('api') || "").replace(/\/$/, "");

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiCountBadge = document.getElementById('emojiCountBadge');
        const emojiArea = document.getElementById('emojiArea');
        const categoryRow = document.getElementById('categoryRow');
        const searchInput = document.getElementById('emojiSearchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const matchCountBadge = document.getElementById('matchCountBadge');
        const scrollSentinel = document.getElementById('scrollSentinel');

        let savedRange = null;
        let allEmojis = [];
        let emojiById = {};
        let catMap = {};
        let activeCategory = null;
        let currentRenderList = [];
        let renderedCount = 0;
        const CHUNK_SIZE = 84; // 14 rows so scrolling is always active & smooth

        const imageBlobCache = {};
        const TRANSPARENT_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        // =========================================================
        // ZERO-BROKEN-IMAGE FETCH QUEUE + PERSISTENT CACHE STORAGE
        // =========================================================
        const fetchQueue = [];
        let activeWorkers = 0;
        const MAX_CONCURRENT_FETCH = 8;
        let persistentCache = null;

        if ('caches' in window) {
            caches.open('studio-emojis-cache-v2').then(c => { persistentCache = c; }).catch(() => {});
        }

        function enqueueEmojiImage(emojiId, rawUrl, imgEl, boxEl) {
            if (!rawUrl) return;
            const fullUrl = rawUrl.startsWith('/') ? (apiBase + rawUrl) : rawUrl;

            if (imageBlobCache[emojiId]) {
                applyLoadedImage(imgEl, boxEl, imageBlobCache[emojiId]);
                return;
            }

            fetchQueue.push({ emojiId, fullUrl, imgEl, boxEl });
            processFetchQueue();
        }

        function applyLoadedImage(imgEl, boxEl, srcUrl) {
            imgEl.onload = () => {
                imgEl.classList.add('loaded');
                if (boxEl) boxEl.classList.add('ready');
            };
            imgEl.src = srcUrl;
        }

        async function processFetchQueue() {
            while (activeWorkers < MAX_CONCURRENT_FETCH && fetchQueue.length > 0) {
                const task = fetchQueue.shift();
                if (!task) break;

                if (imageBlobCache[task.emojiId]) {
                    applyLoadedImage(task.imgEl, task.boxEl, imageBlobCache[task.emojiId]);
                    continue;
                }

                activeWorkers++;
                (async (t) => {
                    try {
                        let blob = null;
                        if (persistentCache) {
                            const cachedResp = await persistentCache.match(t.fullUrl);
                            if (cachedResp && cachedResp.ok) {
                                blob = await cachedResp.blob();
                            }
                        }
                        if (!blob) {
                            const netResp = await fetch(t.fullUrl, {
                                headers: { 'ngrok-skip-browser-warning': '69420' }
                            });
                            if (netResp.ok) {
                                const ct = netResp.headers.get('content-type') || '';
                                if (!ct.includes('text/html')) {
                                    if (persistentCache) {
                                        try { persistentCache.put(t.fullUrl, netResp.clone()); } catch (e) {}
                                    }
                                    blob = await netResp.blob();
                                }
                            }
                        }
                        if (blob && blob.size > 0) {
                            const bUrl = URL.createObjectURL(blob);
                            imageBlobCache[t.emojiId] = bUrl;
                            applyLoadedImage(t.imgEl, t.boxEl, bUrl);
                        }
                    } catch (e) {
                        // Silently keep clean placeholder without broken image icon
                    } finally {
                        activeWorkers--;
                        processFetchQueue();
                    }
                })(task);
            }
        }

        // Lazy Viewport Observer for Emoji Images
        const lazyImgObserver = new IntersectionObserver((entries) => {
            for (let i = 0; i < entries.length; i++) {
                const entry = entries[i];
                if (entry.isIntersecting) {
                    const img = entry.target;
                    lazyImgObserver.unobserve(img);
                    const eid = img.dataset.eid;
                    const rUrl = img.dataset.realSrc;
                    if (eid && rUrl) {
                        enqueueEmojiImage(eid, rUrl, img, img.parentElement);
                    }
                }
            }
        }, { root: emojiArea, rootMargin: '180px 0px', threshold: 0.01 });

        // Sentinel Observer + Scroll Listener for Infinite Emoji Scrolling
        const sentinelObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                renderNextChunk();
            }
        }, { root: emojiArea, rootMargin: '150px 0px' });
        sentinelObserver.observe(scrollSentinel);

        emojiArea.addEventListener('scroll', () => {
            if (emojiArea.scrollTop + emojiArea.clientHeight >= emojiArea.scrollHeight - 160) {
                renderNextChunk();
            }
        }, { passive: true });

        // Smart Alias Dictionary
        const SEARCH_ALIASES = {
            "yt": ["youtube", "yt", "video", "play"],
            "youtube": ["youtube", "yt", "video", "play"],
            "fb": ["facebook", "fb", "meta"],
            "facebook": ["facebook", "fb", "meta"],
            "tg": ["telegram", "tg", "plane"],
            "telegram": ["telegram", "tg", "plane"],
            "ig": ["instagram", "ig", "insta"],
            "insta": ["instagram", "ig"],
            "wa": ["whatsapp", "wa", "chat"],
            "bnb": ["binance", "bnb", "crypto", "coin"],
            "binance": ["binance", "bnb", "crypto"],
            "btc": ["bitcoin", "btc", "crypto", "coin"],
            "tt": ["tiktok", "tt", "music"],
            "tiktok": ["tiktok", "tt"],
            "nf": ["netflix", "movie"],
            "verified": ["verified", "tick", "check", "blue", "badge"],
            "tick": ["verified", "tick", "check"],
            "star": ["star", "gold", "premium", "sparkle"],
            "fire": ["fire", "hot", "flame", "lit"],
            "laugh": ["laugh", "funny", "haha", "lol", "joy", "smile"]
        };

        // Cursor Tracker
        function saveCurrentSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const r = sel.getRangeAt(0);
                if (draft.contains(r.commonAncestorContainer)) {
                    savedRange = r.cloneRange();
                }
            }
        }
        document.addEventListener('selectionchange', saveCurrentSelection);
        draft.addEventListener('keyup', saveCurrentSelection);
        draft.addEventListener('mouseup', saveCurrentSelection);
        draft.addEventListener('touchend', saveCurrentSelection);

        function toggleKeyboard() {
            if (document.activeElement === draft) {
                draft.blur();
            } else {
                draft.focus();
                if (savedRange) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRange);
                }
            }
        }

        function clearDraft() {
            draft.innerHTML = '';
            savedRange = null;
            updateStats();
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function updateStats() {
            const imgs = draft.querySelectorAll('img.inline-premium-emoji').length;
            const textLen = draft.innerText.replace(/\n/g, '').length;
            emojiCountBadge.textContent = imgs;
            charCount.textContent = textLen;
        }
        draft.addEventListener('input', updateStats);

        // WYSIWYG Formatting
        function applyFormat(tag) {
            const selection = window.getSelection();
            if (savedRange) {
                selection.removeAllRanges();
                selection.addRange(savedRange);
            }
            if (!selection.rangeCount) return;

            const commandMap = { 'b': 'bold', 'i': 'italic', 'u': 'underline', 's': 'strikeThrough' };
            if (commandMap[tag]) {
                document.execCommand(commandMap[tag], false, null);
            } else {
                const range = selection.getRangeAt(0);
                if (range.collapsed) {
                    if (Telegram.showAlert) Telegram.showAlert('Select some text first!');
                    return;
                }
                const wrapper = document.createElement(tag);
                try {
                    range.surroundContents(wrapper);
                } catch (e) {
                    const content = range.extractContents();
                    wrapper.appendChild(content);
                    range.insertNode(wrapper);
                }
                selection.removeAllRanges();
                const newRange = document.createRange();
                newRange.selectNodeContents(wrapper);
                newRange.collapse(false);
                selection.addRange(newRange);
            }
            saveCurrentSelection();
            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function indexEmojiItem(emoji) {
            const rawTags = (emoji.tags || '').toLowerCase().trim();
            const rawPack = (emoji.pack_id || 'Other').toLowerCase();
            emoji._tags = rawTags;
            emoji._words = rawTags ? rawTags.split(/\s+/) : [];
            emoji._pack = rawPack;
            emoji._label = emoji._words[0] || emoji.symbol || '⭐';
        }

        // Auto-Upgrade Chip Icons & Header Icon with Real Premium Emojis from User's Database
        const upgradedChipKeys = {};
        function upgradeUIWithDatabasePremiumEmojis() {
            const chipTargets = ['youtube', 'telegram', 'binance', 'facebook', 'tiktok', 'verified', 'star', 'fire', 'laugh'];
            for (const key of chipTargets) {
                if (upgradedChipKeys[key]) continue;
                const match = allEmojis.find(e => e._words.includes(key) || e._tags.includes(key));
                if (match) {
                    upgradedChipKeys[key] = true;
                    const chipImg = document.querySelector(`img[data-chip-icon="${key}"]`);
                    if (chipImg) {
                        enqueueEmojiImage(match.id, match.image_url, chipImg, null);
                    }
                    if (key === 'star') {
                        const statStar = document.getElementById('statStarIcon');
                        if (statStar) enqueueEmojiImage(match.id, match.image_url, statStar, null);
                    }
                }
            }
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="state-msg">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="state-msg">✨ Loading premium emojis...</div>';
            await fetchPage(1, 1500, true);
            fetchRemainingInBackground();
        }

        async function fetchPage(page, limit, isFirstLoad = false) {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || data.length === 0) return 0;

                for (let i = 0; i < data.length; i++) {
                    const emoji = data[i];
                    if (!emojiById[emoji.id]) {
                        indexEmojiItem(emoji);
                        emojiById[emoji.id] = emoji;
                        allEmojis.push(emoji);
                    }
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        createCategoryButton(packId, emoji.image_url, emoji.id);
                    }
                }

                upgradeUIWithDatabasePremiumEmojis();

                if (isFirstLoad && Object.keys(catMap).length > 0) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                } else if (!isFirstLoad && !searchInput.value.trim()) {
                    const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                    if (newlyAdded.length > 0) {
                        currentRenderList.push(...newlyAdded);
                        if (renderedCount < CHUNK_SIZE) renderNextChunk();
                    }
                }
                return data.length;
            } catch (err) {
                if (isFirstLoad) keyboard.innerHTML = `<div class="state-msg">❌ ${err.message}</div>`;
                return 0;
            }
        }

        async function fetchRemainingInBackground() {
            let page = 2;
            const limit = 1500;
            while (true) {
                const count = await fetchPage(page, limit, false);
                if (count < limit) break;
                page++;
            }
        }

        let rAF_id = null;
        function setGridList(list, showCount = false) {
            if (rAF_id) cancelAnimationFrame(rAF_id);
            rAF_id = requestAnimationFrame(() => {
                keyboard.innerHTML = '';
                currentRenderList = list;
                renderedCount = 0;
                emojiArea.scrollTop = 0;

                if (showCount) {
                    matchCountBadge.textContent = `${list.length}`;
                    matchCountBadge.classList.add('visible');
                } else {
                    matchCountBadge.classList.remove('visible');
                }

                if (list.length === 0) {
                    keyboard.innerHTML = '<div class="state-msg">😕 No matching emojis found.</div>';
                    return;
                }
                renderNextChunk();
            });
        }

        function renderNextChunk() {
            if (renderedCount >= currentRenderList.length) return;
            const nextSlice = currentRenderList.slice(renderedCount, renderedCount + CHUNK_SIZE);
            renderedCount += nextSlice.length;

            const fragment = document.createDocumentFragment();
            for (let i = 0; i < nextSlice.length; i++) {
                fragment.appendChild(createEmojiElement(nextSlice[i]));
            }
            keyboard.appendChild(fragment);

            // Auto-fill if container still hasn't overflowed
            requestAnimationFrame(() => {
                if (emojiArea.scrollHeight <= emojiArea.clientHeight + 80 && renderedCount < currentRenderList.length) {
                    renderNextChunk();
                }
            });
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';

            const imgBox = document.createElement('div');
            imgBox.className = 'emoji-img-box';

            const mediaEl = document.createElement('img');
            mediaEl.src = TRANSPARENT_PIXEL;
            mediaEl.dataset.eid = emoji.id;
            mediaEl.dataset.realSrc = emoji.image_url;

            if (imageBlobCache[emoji.id]) {
                applyLoadedImage(mediaEl, imgBox, imageBlobCache[emoji.id]);
            } else {
                lazyImgObserver.observe(mediaEl);
            }

            imgBox.appendChild(mediaEl);

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji._label;

            div.appendChild(imgBox);
            div.appendChild(label);

            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => insertEmoji(emoji);
            return div;
        }

        function createCategoryButton(packId, imageUrl, eid) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => filterEmojis(packId, div);

            const wrap = document.createElement('div');
            wrap.className = 'cat-img-wrap';

            const mediaEl = document.createElement('img');
            mediaEl.src = TRANSPARENT_PIXEL;
            enqueueEmojiImage(eid, imageUrl, mediaEl, wrap);

            wrap.appendChild(mediaEl);

            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.replace(/^Pack_/, '').substring(0, 8);

            div.appendChild(wrap);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function clearActiveChips() {
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active-chip'));
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (searchInput.value.trim()) {
                searchInput.value = '';
                searchClearBtn.classList.remove('visible');
            }
            clearActiveChips();
            activeCategory = categoryId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            if (clickedBtn) clickedBtn.classList.add('active-cat');

            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function runQuickChip(term, btnEl) {
            const isAlreadyActive = btnEl.classList.contains('active-chip');
            clearActiveChips();
            if (isAlreadyActive) {
                clearSearch();
                return;
            }
            btnEl.classList.add('active-chip');
            searchInput.value = term;
            searchClearBtn.classList.add('visible');
            executeFastSearch(term);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function isFuzzy(word, q) {
            if (q.length < 3 || Math.abs(word.length - q.length) > 2) return false;
            let wi = 0, qi = 0, err = 0;
            while (wi < word.length && qi < q.length) {
                if (word[wi] === q[qi]) { wi++; qi++; }
                else {
                    err++;
                    if (err > 1) return false;
                    if (word.length > q.length) wi++;
                    else if (q.length > word.length) qi++;
                    else { wi++; qi++; }
                }
            }
            return true;
        }

        function executeFastSearch(rawQ) {
            const terms = SEARCH_ALIASES[rawQ] || [rawQ];
            const exactList = [];
            const prefixList = [];
            const substringList = [];

            const total = allEmojis.length;
            for (let i = 0; i < total; i++) {
                const em = allEmojis[i];
                const tags = em._tags;
                if (!tags && em.symbol !== rawQ) continue;

                let matchedTier = 0;
                const words = em._words;

                for (let t = 0; t < terms.length; t++) {
                    const term = terms[t];
                    if (em.symbol === term) { matchedTier = 1; break; }
                    if (!tags.includes(term)) continue;

                    for (let w = 0; w < words.length; w++) {
                        if (words[w] === term) { matchedTier = 1; break; }
                        if (words[w].startsWith(term)) { matchedTier = Math.max(matchedTier, 2); }
                    }
                    if (matchedTier === 0) matchedTier = 3;
                    if (matchedTier === 1) break;
                }

                if (matchedTier === 1) exactList.push(em);
                else if (matchedTier === 2) prefixList.push(em);
                else if (matchedTier === 3) substringList.push(em);
            }

            let combined = exactList.concat(prefixList, substringList);

            if (combined.length < 10 && rawQ.length >= 3) {
                const seen = new Set(combined.map(x => x.id));
                for (let i = 0; i < total; i++) {
                    const em = allEmojis[i];
                    if (seen.has(em.id)) continue;
                    const words = em._words;
                    for (let w = 0; w < words.length; w++) {
                        if (isFuzzy(words[w], rawQ)) {
                            combined.push(em);
                            break;
                        }
                    }
                }
            }

            setGridList(combined, true);
        }

        let searchDebounce;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            clearActiveChips();
            const rawQ = searchInput.value.trim().toLowerCase().replace(/^#/, '');
            searchClearBtn.classList.toggle('visible', rawQ.length > 0);

            if (!rawQ) {
                const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
                setGridList(filtered, false);
                return;
            }

            searchDebounce = setTimeout(() => {
                executeFastSearch(rawQ);
            }, 100);
        });

        function clearSearch() {
            searchInput.value = '';
            searchClearBtn.classList.remove('visible');
            clearActiveChips();
            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
        }

        // Insert Visual Premium Emoji Into Draft Box
        function insertEmoji(emoji) {
            const imgNode = document.createElement('img');
            imgNode.className = 'inline-premium-emoji';
            imgNode.dataset.emojiId = emoji.id;
            imgNode.dataset.imgPath = emoji.image_url || `/api/image/${emoji.id}.webp`;
            imgNode.alt = emoji.symbol || '⭐';
            imgNode.src = TRANSPARENT_PIXEL;
            enqueueEmojiImage(emoji.id, imgNode.dataset.imgPath, imgNode, null);

            const spaceNode = document.createTextNode('\u00A0');

            let range = savedRange;
            if (!range || !draft.contains(range.commonAncestorContainer)) {
                range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
            }

            range.deleteContents();
            range.insertNode(spaceNode);
            range.insertNode(imgNode);

            range.setStartAfter(spaceNode);
            range.collapse(true);
            savedRange = range.cloneRange();

            if (document.activeElement === draft) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }

            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function serializeDraftForBot(containerEl) {
            const clone = containerEl.cloneNode(true);
            clone.querySelectorAll('img.inline-premium-emoji').forEach(img => {
                const eid = img.dataset.emojiId;
                const replacement = document.createTextNode(eid ? `[${eid}]` : (img.alt || '⭐'));
                img.replaceWith(replacement);
            });

            return clone.innerHTML
                .replace(/<div><br\s*\/?><\/div>/gi, '\n')
                .replace(/<div>/gi, '\n')
                .replace(/<\/div>/gi, '')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/&nbsp;|\u00A0/g, ' ');
        }

        function saveToHistory(botFormattedText) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            history.unshift({
                botText: botFormattedText,
                date: new Date().toLocaleString()
            });
            if (history.length > 25) history.pop();
            localStorage.setItem('postHistory', JSON.stringify(history));
        }

        function hydrateBotTextToVisualHTML(botText) {
            if (!botText) return '';
            const htmlWithBreaks = botText.replace(/\n/g, '<br>');
            return htmlWithBreaks.replace(/\[(\d{17,21})\]/g, (match, eid) => {
                const imgPath = `/api/image/${eid}.webp`;
                return `<img class="inline-premium-emoji" data-emoji-id="${eid}" data-img-path="${imgPath}" src="${TRANSPARENT_PIXEL}" alt="⭐">`;
            });
        }

        function hydrateImagesInContainer(container) {
            container.querySelectorAll('img.inline-premium-emoji').forEach(img => {
                const eid = img.dataset.emojiId;
                const path = img.dataset.imgPath || `/api/image/${eid}.webp`;
                if (eid) enqueueEmojiImage(eid, path, img, null);
            });
        }

        function showHistory() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('historyView').style.display = 'flex';
            document.getElementById('settingsMenu').classList.remove('show');

            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');

            if (history.length === 0) {
                list.innerHTML = '<div class="state-msg">No saved history yet.</div>';
                return;
            }

            list.innerHTML = '';
            history.forEach((item, index) => {
                const rawBotText = item.botText || item.text || '';
                const card = document.createElement('div');
                card.className = 'history-card';
                card.onclick = () => loadHistoryItem(index);

                const visualHTML = hydrateBotTextToVisualHTML(rawBotText);
                card.innerHTML = `
                    <div class="history-header">
                        <span>POST #${history.length - index}</span>
                        <span>${item.date || ''}</span>
                    </div>
                    <div class="history-text">${visualHTML}</div>
                    <div style="font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: 700;">Tap to restore into studio ✏️</div>
                `;
                list.appendChild(card);
                hydrateImagesInContainer(card);
            });
        }

        function loadHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            const item = history[index];
            if (item) {
                const rawBotText = item.botText || item.text || '';
                draft.innerHTML = hydrateBotTextToVisualHTML(rawBotText);
                hydrateImagesInContainer(draft);
                showMain();

                const range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
                savedRange = range.cloneRange();

                updateStats();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');
            }
        }

        function showMain() {
            document.getElementById('historyView').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        }

        function clearHistory() {
            if (confirm("Clear all post history?")) {
                localStorage.removeItem('postHistory');
                showHistory();
            }
        }

        function sendData() {
            const hasEmoji = draft.querySelector('img.inline-premium-emoji') !== null;
            if (!draft.innerText.trim() && !hasEmoji) {
                if (Telegram.showAlert) Telegram.showAlert('Write something or add an emoji first!');
                return;
            }

            const finalBotText = serializeDraftForBot(draft);
            saveToHistory(finalBotText);
            Telegram.sendData(JSON.stringify({ text: finalBotText }));
        }

        loadEmojis();
    </script>
</body>
