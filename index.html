<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
            --accent: #0088cc;
            --accent-hover: #0077b3;
            --text: #ffffff;
            --text-secondary: #888888;
            --purple-glow: rgba(160, 32, 240, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 16px;
            padding-bottom: 100px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Ultra Smooth CSS Rain Animation (Hardware Accelerated) --- */
        #rainContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .rain-drop {
            position: absolute;
            top: -20px;
            width: 2px;
            background: linear-gradient(transparent, rgba(160, 32, 240, 0.7));
            animation: fall linear infinite;
            will-change: transform;
        }
        @keyframes fall {
            0% { transform: translate3d(0, -20px, 0); }
            100% { transform: translate3d(0, 110vh, 0); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 8px;
            position: relative;
            z-index: 10;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section { margin-bottom: 20px; position: relative; z-index: 10; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* --- Floating Draft Area --- */
        .draft-area {
            width: 100%;
            min-height: 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px var(--purple-glow);
            animation: floatDraft 4s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes floatDraft {
            0% { transform: translate3d(0, 0px, 0); }
            100% { transform: translate3d(0, -6px, 0); box-shadow: 0 8px 20px rgba(160, 32, 240, 0.6); }
        }

        .draft-area:focus {
            outline: none;
            border-color: #a020f0;
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.8);
            animation: none; /* টাইপ করার সময় এনিমেশন বন্ধ থাকবে যাতে ল্যাগ না করে */
        }

        .draft-area::placeholder { color: #555; }

        /* --- Category Section (Smooth Scrolling & White Shadow) --- */
        .category-hint {
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 10px;
            font-style: italic;
        }

        .category-row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 10px 5px 25px 5px;
            margin-bottom: 5px;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch; /* আইফোনের মতো স্মুথ স্ক্রল */
            scroll-behavior: smooth;
        }
        .category-row::-webkit-scrollbar { display: none; }

        .category-item {
            flex: 0 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); 
            animation: floatCat 3s ease-in-out infinite alternate; 
            will-change: transform;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 60px;
        }

        /* ক্যাটাগরি ভাসার এনিমেশন */
        @keyframes floatCat {
            0% { transform: translate3d(0, 0px, 0); }
            100% { transform: translate3d(0, -4px, 0); }
        }

        .category-item:active { transform: scale(0.95); animation: none; }
        
        .category-item.active-cat {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); 
            background: rgba(255, 255, 255, 0.15);
            animation: none;
            transform: translateY(-2px);
        }

        .category-item img {
            width: 32px; 
            height: 32px;
            object-fit: contain;
            pointer-events: none;
            margin-bottom: 4px;
        }

        .category-item .normal-emoji {
            font-size: 14px;
            line-height: 1;
        }

        /* --- Expandable Emoji Section --- */
        .emoji-wrapper {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            overflow: hidden;
            transform: translateZ(0); /* হার্ডওয়্যার এক্সিলারেশন */
        }

        .emoji-scroll-area {
            max-height: 145px; 
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            -webkit-overflow-scrolling: touch;
        }

        .emoji-scroll-area.expanded {
            max-height: 50vh; 
            overflow-y: auto;
        }

        .emoji-fade {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--surface));
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .emoji-scroll-area.expanded + .emoji-fade {
            opacity: 0; 
        }

        /* --- Smaller Emojis Grid --- */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); 
            gap: 8px;
        }

        .emoji-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 4px; 
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s ease, background-color 0.2s ease;
            will-change: transform;
        }

        .emoji-item:active {
            transform: scale(0.85);
            border-color: var(--accent);
            background: rgba(160, 32, 240, 0.2);
        }

        .emoji-item img {
            width: 26px; 
            height: 26px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            pointer-events: none;
        }

        .emoji-item .label {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Expand Button */
        .toggle-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            padding-top: 12px;
            cursor: pointer;
            border-top: 1px solid var(--border);
            margin-top: 5px;
            transition: color 0.2s;
        }
        
        .toggle-btn:active { color: var(--text); }
        .toggle-btn span { margin-right: 5px; pointer-events: none; }

        .loading, .empty, .error {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-secondary);
            font-size: 13px;
            grid-column: 1 / -1;
        }

        .error { color: #ff4444; }

        .send-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            padding: 16px;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .send-btn button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s;
            box-shadow: 0 2px 10px rgba(0, 136, 204, 0.3);
            will-change: transform;
        }

        .send-btn button:active { background: var(--accent-hover); transform: scale(0.96); }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="rainContainer"></div> <div class="header">
        <h1>✨ Premium Post Manager</h1>
        <p>Compose & send premium emoji posts</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type your post here... Tap emojis below to insert them."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Emoji Categories</div>
        <div class="category-hint">👇 Click a category to view its premium emojis</div>
        <div class="category-row" id="categoryRow">
            </div>
    </div>

    <div class="section">
        <div class="section-title">Premium Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid">
                    <div class="loading">Loading emojis...</div>
                </div>
            </div>
            <div class="emoji-fade" id="fadeEffect"></div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis</span> <span id="toggleIcon">🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send to Bot</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;

        // --- Optimized Pre-rendered Rain (Zero Lag) ---
        function initRain() {
            const rainContainer = document.getElementById('rainContainer');
            const dropCount = 25; // 25 ফোঁটা বৃষ্টি বারবার রিপিট হবে
            let fragment = document.createDocumentFragment();
            for(let i = 0; i < dropCount; i++) {
                let drop = document.createElement('div');
                drop.className = 'rain-drop';
                drop.style.left = (Math.random() * 100) + 'vw';
                drop.style.height = (Math.random() * 10 + 10) + 'px';
                drop.style.animationDuration = (Math.random() * 1 + 0.8) + 's';
                drop.style.animationDelay = (Math.random() * 2) + 's';
                drop.style.opacity = Math.random() * 0.4 + 0.1;
                fragment.appendChild(drop);
            }
            rainContainer.appendChild(fragment);
        }
        initRain();

        // --- Emoji Toggle Logic ---
        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis";
                toggleIcon.textContent = "🔼";
            } else {
                toggleText.textContent = "Show All Emojis";
                toggleIcon.textContent = "🔽";
                emojiArea.scrollTop = 0; 
            }
        }

        draft.addEventListener('input', () => {
            charCount.textContent = draft.value.length + ' chars';
        });

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="error">❌ Missing API URL. Open via Bot.</div>';
                return;
            }

            try {
                const res = await fetch(`${apiBase}/api/emojis`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                
                const allEmojisData = await res.json(); 

                if (allEmojisData.length === 0) {
                    keyboard.innerHTML = '<div class="empty">No emojis in database.<br>Ask admin to add some!</div>';
                    return;
                }

                buildCategoriesAndGrid(allEmojisData);

            } catch (err) {
                keyboard.innerHTML = '<div class="error">❌ Failed to load emojis.<br>Check API connection.</div>';
                console.error(err);
            }
        }

        // --- Ultra Smooth DOM Rendering (Zero Lag Filtering) ---
        function buildCategoriesAndGrid(data) {
            categoryRow.innerHTML = '';
            keyboard.innerHTML = '';
            
            const catMap = {};
            const gridFragment = document.createDocumentFragment();

            // প্রসেসিং: সব ইমোজি গ্রিডে অ্যাড করা এবং লুকানো
            data.forEach((emoji) => {
                const sym = emoji.symbol || '⭐';
                
                // ক্যাটাগরির জন্য প্রথম প্রিমিয়াম ইমোজি সেভ করা
                if (!catMap[sym]) {
                    catMap[sym] = emoji; 
                }

                // গ্রিড আইটেম তৈরি
                const div = document.createElement('div');
                div.className = 'emoji-item';
                div.dataset.category = sym; // ফিল্টার করার জন্য ডাটা ট্যাগ
                div.title = emoji.type === 'mapped' ? `${sym} (${emoji.id})` : emoji.id;

                const img = document.createElement('img');
                img.src = emoji.image_url;
                img.alt = sym;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.style.opacity = '0.3';
                    this.parentElement.style.cursor = 'not-allowed';
                };

                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = sym; // নিচে শুধু অরিজিনাল ইমোজি দেখাবে

                div.appendChild(img);
                div.appendChild(label);
                div.onclick = () => insertEmoji(emoji);
                gridFragment.appendChild(div);
            });

            keyboard.appendChild(gridFragment);

            // "All" ক্যাটাগরি বাটন
            const allBtn = document.createElement('div');
            allBtn.className = 'category-item active-cat';
            allBtn.style.animationDelay = '0s';
            allBtn.innerHTML = `
                <div style="font-size: 26px; line-height:30px; margin-bottom:2px;">🌐</div>
                <div class="normal-emoji">All</div>
            `;
            allBtn.onclick = () => filterEmojis('all', allBtn);
            categoryRow.appendChild(allBtn);

            // ডাটাবেজের সিম্বল অনুযায়ী ক্যাটাগরি বাটন তৈরি
            let delayCounter = 0.1;
            Object.keys(catMap).forEach(sym => {
                const repEmoji = catMap[sym];
                const div = document.createElement('div');
                div.className = 'category-item';
                div.style.animationDelay = delayCounter + 's'; // যাতে ঢেউয়ের মতো ভাসে
                delayCounter += 0.1;
                
                div.onclick = () => filterEmojis(sym, div);

                const img = document.createElement('img');
                img.src = repEmoji.image_url;
                img.loading = 'lazy';

                const span = document.createElement('div');
                span.className = 'normal-emoji';
                span.textContent = sym;

                div.appendChild(img);
                div.appendChild(span);
                categoryRow.appendChild(div);
            });
        }

        // --- Fast Filtering Logic (Display toggle) ---
        function filterEmojis(sym, clickedBtn) {
            // একটিভ ক্লাস পাল্টানো
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            
            // ইমোজি ফিল্টার (স্টাইল ডিসপ্লে নান করা, নতুন করে ডিওএম না বানানো)
            const allItems = document.querySelectorAll('#emojiKeyboard .emoji-item');
            allItems.forEach(item => {
                if (sym === 'all' || item.dataset.category === sym) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });

            // অটো এক্সপান্ড
            if (sym !== 'all' && !emojiArea.classList.contains('expanded')) {
                toggleEmojiList();
            }
            
            // ভাইব্রেশন ফিডব্যাক
            if (Telegram.HapticFeedback) {
                Telegram.HapticFeedback.selectionChanged();
            }
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;

            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;

            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));

            if (Telegram.HapticFeedback) {
                Telegram.HapticFeedback.impactOccurred('light');
            }
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) {
                Telegram.showAlert('Please write something first!');
                return;
            }

            for (let code in emojiMap) {
                text = text.split(code).join(emojiMap[code]);
            }

            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
