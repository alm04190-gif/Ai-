        </div>
    </div>

    <div class="modal-backdrop" id="aiLoadingModal">
        <div class="modal-box">
            <div class="ai-loader-center">
                <div class="ai-orb anim-float">
                    <img class="ui-prem-icon anim-wiggle" data-ui-prem="ai" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23facc15' d='M12 1L14.8 8.2L22 11L14.8 13.8L12 21L9.2 13.8L2 11L9.2 8.2L12 1Z'/><circle cx='19' cy='4' r='2' fill='%2338bdf8'/><circle cx='5' cy='19' r='1.8' fill='%23a855f7'/></svg>" alt="">
                </div>
                <div style="font-size: 16px; font-weight: 800; color: var(--text);">AI Make Your Post</div>
                <div style="font-size: 12.5px; font-weight: 600; color: var(--text-muted);" id="aiStatusSubText">Please wait...</div>
                <div class="ai-progress-track">
                    <div class="ai-progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();
        Telegram.enableClosingConfirmation();

        function safeAlert(msg) {
            const clean = String(msg || 'Notice').slice(0, 220);
            try {
                if (Telegram && Telegram.showAlert) {
                    Telegram.showAlert(clean);
                    return;
                }
            } catch (e) {}
            alert(clean);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const cur = document.documentElement.getAttribute('data-theme');
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function toggleSettings() {
            document.getElementById('settingsMenu').classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.top-bar')) {
                document.getElementById('settingsMenu').classList.remove('show');
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = (urlParams.get('api') || "").replace(/\/$/, "");

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiCountBadge = document.getElementById('emojiCountBadge');
        const emojiArea = document.getElementById('emojiArea');
        const categoryRow = document.getElementById('categoryRow');
        const searchInput = document.getElementById('emojiSearchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const matchCountBadge = document.getElementById('matchCountBadge');
        const scrollSentinel = document.getElementById('scrollSentinel');

        let savedRange = null;
        let pendingLinkRange = null;
        let allEmojis = [];
        let emojiById = {};
        let catMap = {};
        let activeCategory = null;
        let currentRenderList = [];
        let renderedCount = 0;
        const CHUNK_SIZE = 84;

        const imageBlobCache = {};
        const TRANSPARENT_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        const fetchQueue = [];
        let activeWorkers = 0;
        const MAX_CONCURRENT_FETCH = 8;
        let persistentCache = null;

        if ('caches' in window) {
            caches.open('studio-emojis-cache-v2').then(c => { persistentCache = c; }).catch(() => {});
        }

        function enqueueEmojiImage(emojiId, rawUrl, imgEl, boxEl) {
            if (!rawUrl) return;
            const fullUrl = rawUrl.startsWith('/') ? (apiBase + rawUrl) : rawUrl;

            if (imageBlobCache[emojiId]) {
                applyLoadedImage(imgEl, boxEl, imageBlobCache[emojiId]);
                return;
            }

            fetchQueue.push({ emojiId, fullUrl, imgEl, boxEl });
            processFetchQueue();
        }

        function applyLoadedImage(imgEl, boxEl, srcUrl) {
            imgEl.onload = () => {
                imgEl.classList.add('loaded');
                if (boxEl) boxEl.classList.add('ready');
            };
            imgEl.src = srcUrl;
        }

        async function processFetchQueue() {
            while (activeWorkers < MAX_CONCURRENT_FETCH && fetchQueue.length > 0) {
                const task = fetchQueue.shift();
                if (!task) break;

                if (imageBlobCache[task.emojiId]) {
                    applyLoadedImage(task.imgEl, task.boxEl, imageBlobCache[task.emojiId]);
                    continue;
                }

                activeWorkers++;
                (async (t) => {
                    try {
                        let blob = null;
                        if (persistentCache) {
                            const cachedResp = await persistentCache.match(t.fullUrl);
                            if (cachedResp && cachedResp.ok) {
                                blob = await cachedResp.blob();
                            }
                        }
                        if (!blob) {
                            const netResp = await fetch(t.fullUrl, {
                                headers: { 'ngrok-skip-browser-warning': '69420' }
                            });
                            if (netResp.ok) {
                                const ct = netResp.headers.get('content-type') || '';
                                if (!ct.includes('text/html')) {
                                    if (persistentCache) {
                                        try { persistentCache.put(t.fullUrl, netResp.clone()); } catch (e) {}
                                    }
                                    blob = await netResp.blob();
                                }
                            }
                        }
                        if (blob && blob.size > 0) {
                            const bUrl = URL.createObjectURL(blob);
                            imageBlobCache[t.emojiId] = bUrl;
                            applyLoadedImage(t.imgEl, t.boxEl, bUrl);
                        }
                    } catch (e) {
                    } finally {
                        activeWorkers--;
                        processFetchQueue();
                    }
                })(task);
            }
        }

        const lazyImgObserver = new IntersectionObserver((entries) => {
            for (let i = 0; i < entries.length; i++) {
                const entry = entries[i];
                if (entry.isIntersecting) {
                    const img = entry.target;
                    lazyImgObserver.unobserve(img);
                    const eid = img.dataset.eid;
                    const rUrl = img.dataset.realSrc;
                    if (eid && rUrl) {
                        enqueueEmojiImage(eid, rUrl, img, img.parentElement);
                    }
                }
            }
        }, { root: emojiArea, rootMargin: '180px 0px', threshold: 0.01 });

        const sentinelObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                renderNextChunk();
            }
        }, { root: emojiArea, rootMargin: '150px 0px' });
        sentinelObserver.observe(scrollSentinel);

        emojiArea.addEventListener('scroll', () => {
            if (emojiArea.scrollTop + emojiArea.clientHeight >= emojiArea.scrollHeight - 160) {
                renderNextChunk();
            }
        }, { passive: true });

        const SEARCH_ALIASES = {
            "yt": ["youtube", "yt", "video", "play"],
            "youtube": ["youtube", "yt", "video", "play"],
            "fb": ["facebook", "fb", "meta"],
            "facebook": ["facebook", "fb", "meta"],
            "tg": ["telegram", "tg", "plane"],
            "telegram": ["telegram", "tg", "plane"],
            "ig": ["instagram", "ig", "insta"],
            "insta": ["instagram", "ig"],
            "wa": ["whatsapp", "wa", "chat"],
            "bnb": ["binance", "bnb", "crypto", "coin"],
            "binance": ["binance", "bnb", "crypto"],
            "btc": ["bitcoin", "btc", "crypto", "coin"],
            "tt": ["tiktok", "tt", "music"],
            "tiktok": ["tiktok", "tt"],
            "nf": ["netflix", "movie"],
            "verified": ["verified", "tick", "check", "blue", "badge"],
            "tick": ["verified", "tick", "check"],
            "star": ["star", "gold", "premium", "sparkle"],
            "fire": ["fire", "hot", "flame", "lit"],
            "laugh": ["laugh", "funny", "haha", "lol", "joy", "smile"]
        };

        const INLINE_FMT_TAGS = ['B', 'STRONG', 'I', 'EM', 'U', 'INS', 'S', 'STRIKE', 'DEL', 'CODE', 'TG-SPOILER', 'A'];

        function findAncestorTag(node, tagNames) {
            let cur = node && node.nodeType === 3 ? node.parentNode : node;
            while (cur && cur !== draft) {
                if (cur.nodeType === 1 && tagNames.includes(cur.tagName)) {
                    return cur;
                }
                cur = cur.parentNode;
            }
            return null;
        }

        function updateToolbarActiveState() {
            document.querySelectorAll('.format-btn[data-fmt]').forEach(btn => btn.classList.remove('active-fmt'));
            if (!savedRange) return;
            const node = savedRange.commonAncestorContainer;
            if (!draft.contains(node)) return;

            if (findAncestorTag(node, ['B', 'STRONG'])) document.querySelector('[data-fmt="b"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['I', 'EM'])) document.querySelector('[data-fmt="i"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['U', 'INS'])) document.querySelector('[data-fmt="u"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['S', 'STRIKE', 'DEL'])) document.querySelector('[data-fmt="s"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['CODE'])) document.querySelector('[data-fmt="code"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['TG-SPOILER'])) document.querySelector('[data-fmt="tg-spoiler"]')?.classList.add('active-fmt');
            if (findAncestorTag(node, ['A'])) document.querySelector('[data-fmt="a"]')?.classList.add('active-fmt');

            const bq = findAncestorTag(node, ['BLOCKQUOTE']);
            if (bq) {
                if (bq.hasAttribute('expandable')) {
                    document.querySelector('[data-fmt="expandable-quote"]')?.classList.add('active-fmt');
                } else {
                    document.querySelector('[data-fmt="blockquote"]')?.classList.add('active-fmt');
                }
            }
        }

        function saveCurrentSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const r = sel.getRangeAt(0);
                if (draft.contains(r.commonAncestorContainer)) {
                    savedRange = r.cloneRange();
                    updateToolbarActiveState();
                }
            }
        }
        document.addEventListener('selectionchange', saveCurrentSelection);
        draft.addEventListener('keyup', saveCurrentSelection);
        draft.addEventListener('mouseup', saveCurrentSelection);
        draft.addEventListener('touchend', saveCurrentSelection);

        function openLinkModal() {
            const sel = window.getSelection();
            if (savedRange) {
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }

            const existingLink = savedRange ? findAncestorTag(savedRange.commonAncestorContainer, ['A']) : null;
            const selectedText = savedRange ? savedRange.toString().replace(/\u200B/g, '').trim() : '';

            if (!existingLink && (!savedRange || savedRange.collapsed || !selectedText)) {
                safeAlert('Select any text or word first, then click Create Link!');
                return;
            }

            pendingLinkRange = savedRange.cloneRange();
            const previewEl = document.getElementById('linkSelectedPreview');
            const urlInput = document.getElementById('linkUrlInput');

            if (existingLink && (!selectedText || selectedText === existingLink.innerText.trim())) {
                previewEl.textContent = existingLink.innerText.trim() || 'Link';
                urlInput.value = existingLink.getAttribute('href') || '';
            } else {
                previewEl.textContent = selectedText.length > 28 ? selectedText.substring(0, 28) + '...' : selectedText;
                urlInput.value = '';
            }

            document.getElementById('linkModal').classList.add('show');
            setTimeout(() => urlInput.focus(), 60);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.remove('show');
            pendingLinkRange = null;
        }

        function confirmInsertLink() {
            const urlInput = document.getElementById('linkUrlInput');
            let rawUrl = urlInput.value.trim();

            if (!rawUrl) {
                safeAlert('Please paste your link first!');
                return;
            }
            if (!/^(https?:\/\/|tg:\/\/|mailto:)/i.test(rawUrl)) {
                rawUrl = 'https://' + rawUrl;
            }

            if (pendingLinkRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(pendingLinkRange);

                const existingLink = findAncestorTag(pendingLinkRange.commonAncestorContainer, ['A']);
                if (existingLink && pendingLinkRange.collapsed) {
                    existingLink.setAttribute('href', rawUrl);
                } else {
                    if (existingLink) unwrapElement(existingLink);
                    const aTag = document.createElement('a');
                    aTag.setAttribute('href', rawUrl);
                    aTag.setAttribute('target', '_blank');
                    aTag.setAttribute('rel', 'noopener noreferrer');

                    const frag = pendingLinkRange.extractContents();
                    aTag.appendChild(frag);
                    pendingLinkRange.insertNode(aTag);

                    const exitAnchor = document.createTextNode('\u200B');
                    aTag.after(exitAnchor);

                    const newRange = document.createRange();
                    newRange.setStart(exitAnchor, 1);
                    newRange.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newRange);
                    savedRange = newRange.cloneRange();
                }
            }

            closeLinkModal();
            updateToolbarActiveState();
            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.notificationOccurred('success');
        }

        document.getElementById('linkUrlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmInsertLink();
            }
        });

        async function runAiEnhancePost() {
            const rawText = draft.innerText.replace(/\u200B/g, '').trim();
            if (!rawText) {
                safeAlert('Write or paste your post first, then tap AI Enhance!');
                return;
            }
            if (!apiBase) {
                safeAlert('Missing Bot API URL! Please open Web App from the Bot.');
                return;
            }

            const aiModal = document.getElementById('aiLoadingModal');
            const aiSub = document.getElementById('aiStatusSubText');
            aiSub.textContent = 'Please wait • AI is reading your post & style...';
            aiModal.classList.add('show');
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');

            let alertMsgToShow = null;

            try {
                // শুধুমাত্র হিস্টরির স্টাইল/প্যাটার্ন পাঠানো হবে, পুরনো ইমোজি আইডি মাস্ক করে দেওয়া হচ্ছে যাতে AI পুরনো ইমোজি কপি না করে
                const savedHistory = JSON.parse(localStorage.getItem('postHistory') || '[]');
                const recentHistoryTexts = savedHistory
                    .slice(0, 6)
                    .map(item => String(item.botText || item.text || '').replace(/\[(\d{15,22})\]/g, '<EMOJI_SLOT>'))
                    .filter(t => t.trim().length > 0);

                const serializedCurrent = serializeDraftForBot(draft);

                const resp = await fetch(`${apiBase}/api/ai-enhance`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '69420'
                    },
                    body: JSON.stringify({
                        text: serializedCurrent,
                        history: recentHistoryTexts
                    })
                });

                const rawBody = await resp.text();
                let data = null;
                try {
                    data = JSON.parse(rawBody);
                } catch (parseErr) {
                    data = null;
                }

                if (resp.ok && data && data.ok && data.text) {
                    draft.innerHTML = hydrateBotTextToVisualHTML(data.text);
                    hydrateImagesInContainer(draft);
                    updateStats();
                    if (Telegram.HapticFeedback) Telegram.HapticFeedback.notificationOccurred('success');
                } else {
                    alertMsgToShow = (data && data.error) ? data.error : `AI Server Error (HTTP ${resp.status})`;
                }
            } catch (err) {
                alertMsgToShow = 'Connection error while contacting AI server!';
            } finally {
                aiModal.classList.remove('show');
            }

            if (alertMsgToShow) {
                safeAlert(alertMsgToShow);
            }
        }

        draft.addEventListener('click', (e) => {
            const bq = e.target.closest('blockquote');
            if (!bq) return;
            const rect = bq.getBoundingClientRect();
            const clickedBottomRight = (e.clientX >= rect.right - 36) && (e.clientY >= rect.bottom - 32);
            if (clickedBottomRight) {
                e.preventDefault();
                e.stopPropagation();
                if (!bq.hasAttribute('expandable')) {
                    bq.setAttribute('expandable', '');
                    bq.classList.add('is-collapsed');
                } else {
                    bq.classList.toggle('is-collapsed');
                }
                updateToolbarActiveState();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
            }
        });

        draft.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' || e.isComposing) return;

            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            if (!draft.contains(range.commonAncestorContainer)) return;

            e.preventDefault();
            range.deleteContents();

            const inlineAncestor = findAncestorTag(range.startContainer, INLINE_FMT_TAGS);
            const bqAncestor = findAncestorTag(range.startContainer, ['BLOCKQUOTE']);

            if (inlineAncestor) {
                const afterRange = document.createRange();
                afterRange.setStart(range.startContainer, range.startOffset);
                afterRange.setEndAfter(inlineAncestor.lastChild || inlineAncestor);
                const trailingText = afterRange.toString().replace(/\u200B/g, '');
                if (trailingText.length === 0) {
                    range.setStartAfter(inlineAncestor);
                    range.collapse(true);
                }
            }

            if (bqAncestor) {
                const prevNode = range.startContainer.nodeType === 1
                    ? range.startContainer.childNodes[range.startOffset - 1]
                    : null;
                const atEnd = (() => {
                    const testR = document.createRange();
                    testR.setStart(range.startContainer, range.startOffset);
                    testR.setEnd(bqAncestor, bqAncestor.childNodes.length);
                    return testR.toString().replace(/\u200B/g, '').trim() === '';
                })();

                if (atEnd && prevNode && prevNode.nodeName === 'BR') {
                    prevNode.remove();
                    const exitBr = document.createElement('br');
                    const cursorAnchor = document.createTextNode('\u200B');
                    if (bqAncestor.nextSibling) {
                        bqAncestor.parentNode.insertBefore(exitBr, bqAncestor.nextSibling);
                        bqAncestor.parentNode.insertBefore(cursorAnchor, exitBr.nextSibling);
                    } else {
                        bqAncestor.parentNode.appendChild(exitBr);
                        bqAncestor.parentNode.appendChild(cursorAnchor);
                    }
                    const newR = document.createRange();
                    newR.setStart(cursorAnchor, 1);
                    newR.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(newR);
                    savedRange = newR.cloneRange();
                    updateStats();
                    updateToolbarActiveState();
                    return;
                }
            }

            const br = document.createElement('br');
            range.insertNode(br);

            const container = bqAncestor || draft;
            const checkAfter = document.createRange();
            checkAfter.setStartAfter(br);
            checkAfter.setEnd(container, container.childNodes.length);
            const hasFollowingContent = checkAfter.toString().replace(/\u200B/g, '').length > 0 ||
                checkAfter.cloneContents().querySelector('br, img, blockquote, div');

            if (!hasFollowingContent) {
                const anchor = document.createTextNode('\u200B');
                br.after(anchor);
                range.setStart(anchor, 1);
            } else {
                range.setStartAfter(br);
            }
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            savedRange = range.cloneRange();
            updateStats();
            updateToolbarActiveState();
        });

        draft.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            if (!text) return;

            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            range.deleteContents();

            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            const frag = document.createDocumentFragment();
            let lastNode = null;

            lines.forEach((line, idx) => {
                if (line.length > 0) {
                    const tn = document.createTextNode(line);
                    frag.appendChild(tn);
                    lastNode = tn;
                }
                if (idx < lines.length - 1) {
                    const br = document.createElement('br');
                    frag.appendChild(br);
                    lastNode = br;
                }
            });

            if (lastNode) {
                range.insertNode(frag);
                range.setStartAfter(lastNode);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
                savedRange = newRange.cloneRange();
            }
            updateStats();
        });

        function clearDraft() {
            draft.innerHTML = '';
            savedRange = null;
            updateStats();
            updateToolbarActiveState();
            document.getElementById('settingsMenu').classList.remove('show');
        }

        function updateStats() {
            const imgs = draft.querySelectorAll('img.inline-premium-emoji').length;
            const textLen = draft.innerText.replace(/[\n\u200B]/g, '').length;
            emojiCountBadge.textContent = imgs;
            charCount.textContent = textLen;
        }
        draft.addEventListener('input', updateStats);

        function unwrapElement(el) {
            const parent = el.parentNode;
            if (!parent) return;
            while (el.firstChild) {
                parent.insertBefore(el.firstChild, el);
            }
            parent.removeChild(el);
        }

        function clearActiveFormat() {
            const sel = window.getSelection();
            if (savedRange) {
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            const node = range.commonAncestorContainer;

            const inlineEl = findAncestorTag(node, INLINE_FMT_TAGS);
            if (inlineEl) unwrapElement(inlineEl);

            const bqEl = findAncestorTag(node, ['BLOCKQUOTE']);
            if (bqEl) unwrapElement(bqEl);

            saveCurrentSelection();
            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function applyFormat(tag) {
            draft.focus();
            const selection = window.getSelection();
            if (savedRange) {
                selection.removeAllRanges();
                selection.addRange(savedRange);
            }
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);

            const isExpandableQuote = (tag === 'expandable-quote');
            const actualTag = isExpandableQuote ? 'blockquote' : tag;

            if (actualTag === 'blockquote') {
                const existingBq = findAncestorTag(range.commonAncestorContainer, ['BLOCKQUOTE']);
                if (existingBq) {
                    if (isExpandableQuote) {
                        if (existingBq.hasAttribute('expandable')) {
                            existingBq.removeAttribute('expandable');
                            existingBq.classList.remove('is-collapsed');
                        } else {
                            existingBq.setAttribute('expandable', '');
                            existingBq.classList.add('is-collapsed');
                        }
                    } else {
                        unwrapElement(existingBq);
                    }
                    saveCurrentSelection();
                    updateStats();
                    if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
                    return;
                }

                if (range.collapsed) {
                    safeAlert('Select some text first to Quote!');
                    return;
                }

                const bq = document.createElement('blockquote');
                if (isExpandableQuote) {
                    bq.setAttribute('expandable', '');
                    bq.classList.add('is-collapsed');
                }

                const frag = range.extractContents();
                const tempDiv = document.createElement('div');
                tempDiv.appendChild(frag);
                tempDiv.querySelectorAll('div, p').forEach((blk, idx) => {
                    if (idx > 0 || blk.previousSibling) {
                        blk.parentNode.insertBefore(document.createElement('br'), blk);
                    }
                    unwrapElement(blk);
                });
                while (tempDiv.firstChild && tempDiv.firstChild.nodeName === 'BR') tempDiv.removeChild(tempDiv.firstChild);
                while (tempDiv.lastChild && tempDiv.lastChild.nodeName === 'BR') tempDiv.removeChild(tempDiv.lastChild);

                while (tempDiv.firstChild) {
                    bq.appendChild(tempDiv.firstChild);
                }

                range.insertNode(bq);

                const exitAnchor = document.createTextNode('\u200B');
                bq.after(exitAnchor);

                const newRange = document.createRange();
                newRange.setStart(exitAnchor, 1);
                newRange.collapse(true);
                selection.removeAllRanges();
                selection.addRange(newRange);
                savedRange = newRange.cloneRange();
                updateToolbarActiveState();
                updateStats();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
                return;
            }

            const tagAliases = {
                'b': ['B', 'STRONG'],
                'i': ['I', 'EM'],
                'u': ['U', 'INS'],
                's': ['S', 'STRIKE', 'DEL'],
                'code': ['CODE'],
                'tg-spoiler': ['TG-SPOILER']
            };

            const existingInline = findAncestorTag(range.commonAncestorContainer, tagAliases[actualTag] || [actualTag.toUpperCase()]);
            if (existingInline) {
                const exitAnchor = document.createTextNode('\u200B');
                existingInline.after(exitAnchor);
                if (!range.collapsed) {
                    unwrapElement(existingInline);
                }
                const newRange = document.createRange();
                newRange.setStart(exitAnchor, 1);
                newRange.collapse(true);
                selection.removeAllRanges();
                selection.addRange(newRange);
                savedRange = newRange.cloneRange();
                updateToolbarActiveState();
                updateStats();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
                return;
            }

            if (range.collapsed) {
                safeAlert('Select some text first!');
                return;
            }

            const wrapper = document.createElement(actualTag);
            const content = range.extractContents();
            wrapper.appendChild(content);
            range.insertNode(wrapper);

            const outsideAnchor = document.createTextNode('\u200B');
            wrapper.after(outsideAnchor);

            const newRange = document.createRange();
            newRange.setStart(outsideAnchor, 1);
            newRange.collapse(true);
            selection.removeAllRanges();
            selection.addRange(newRange);
            savedRange = newRange.cloneRange();

            updateToolbarActiveState();
            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function indexEmojiItem(emoji) {
            const rawTags = (emoji.tags || '').toLowerCase().trim();
            const rawPack = (emoji.pack_id || 'Other').toLowerCase();
            emoji._tags = rawTags;
            emoji._words = rawTags ? rawTags.split(/\s+/) : [];
            emoji._pack = rawPack;
            emoji._label = emoji._words[0] || emoji.symbol || '⭐';
        }

        const upgradedChipKeys = {};
        function upgradeUIWithDatabasePremiumEmojis() {
            const chipTargets = ['youtube', 'telegram', 'binance', 'facebook', 'tiktok', 'verified', 'star', 'fire', 'laugh'];
            for (const key of chipTargets) {
                if (upgradedChipKeys[key]) continue;
                const match = allEmojis.find(e => e._words.includes(key) || e._tags.includes(key));
                if (match) {
                    upgradedChipKeys[key] = true;
                    const chipImg = document.querySelector(`img[data-chip-icon="${key}"]`);
                    if (chipImg) enqueueEmojiImage(match.id, match.image_url, chipImg, null);
                    if (key === 'star') {
                        const statStar = document.getElementById('statStarIcon');
                        if (statStar) enqueueEmojiImage(match.id, match.image_url, statStar, null);
                    }
                }
            }

            const uiMap = {
                'ai': ['sparkle', 'magic', 'star', 'fire', 'bolt'],
                'link': ['link', 'chain', 'globe', 'arrow', 'telegram'],
                'done': ['verified', 'check', 'tick', 'done'],
                'cancel': ['cross', 'close', 'cancel', 'error']
            };
            for (const [uiKey, searchWords] of Object.entries(uiMap)) {
                if (upgradedChipKeys['ui_' + uiKey]) continue;
                let found = null;
                for (const w of searchWords) {
                    found = allEmojis.find(e => e._words.includes(w) || e._tags.includes(w));
                    if (found) break;
                }
                if (found) {
                    upgradedChipKeys['ui_' + uiKey] = true;
                    document.querySelectorAll(`img[data-ui-prem="${uiKey}"]`).forEach(img => {
                        enqueueEmojiImage(found.id, found.image_url, img, null);
                    });
                }
            }
        }

        async function loadEmojis() {
            if (!apiBase) {
                keyboard.innerHTML = '<div class="state-msg">❌ Missing API URL. Open via Bot.</div>';
                return;
            }
            keyboard.innerHTML = '<div class="state-msg">✨ Loading premium emojis...</div>';
            await fetchPage(1, 1500, true);
            fetchRemainingInBackground();
        }

        async function fetchPage(page, limit, isFirstLoad = false) {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${page}&limit=${limit}`, {
                    headers: { 'ngrok-skip-browser-warning': '69420' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data || data.length === 0) return 0;

                for (let i = 0; i < data.length; i++) {
                    const emoji = data[i];
                    if (!emojiById[emoji.id]) {
                        indexEmojiItem(emoji);
                        emojiById[emoji.id] = emoji;
                        allEmojis.push(emoji);
                    }
                    const packId = emoji.pack_id || 'Other';
                    if (!catMap[packId]) {
                        catMap[packId] = true;
                        createCategoryButton(packId, emoji.image_url, emoji.id);
                    }
                }

                upgradeUIWithDatabasePremiumEmojis();

                if (isFirstLoad && Object.keys(catMap).length > 0) {
                    const firstPack = Object.keys(catMap)[0];
                    const firstBtn = document.querySelector('.category-item');
                    if (firstBtn) filterEmojis(firstPack, firstBtn);
                } else if (!isFirstLoad && !searchInput.value.trim()) {
                    const newlyAdded = data.filter(e => (e.pack_id || 'Other') === activeCategory);
                    if (newlyAdded.length > 0) {
                        currentRenderList.push(...newlyAdded);
                        if (renderedCount < CHUNK_SIZE) renderNextChunk();
                    }
                }
                return data.length;
            } catch (err) {
                if (isFirstLoad) keyboard.innerHTML = `<div class="state-msg">❌ ${err.message}</div>`;
                return 0;
            }
        }

        async function fetchRemainingInBackground() {
            let page = 2;
            const limit = 1500;
            while (true) {
                const count = await fetchPage(page, limit, false);
                if (count < limit) break;
                page++;
            }
        }

        let rAF_id = null;
        function setGridList(list, showCount = false) {
            if (rAF_id) cancelAnimationFrame(rAF_id);
            rAF_id = requestAnimationFrame(() => {
                keyboard.innerHTML = '';
                currentRenderList = list;
                renderedCount = 0;
                emojiArea.scrollTop = 0;

                if (showCount) {
                    matchCountBadge.textContent = `${list.length}`;
                    matchCountBadge.classList.add('visible');
                } else {
                    matchCountBadge.classList.remove('visible');
                }

                if (list.length === 0) {
                    keyboard.innerHTML = '<div class="state-msg">😕 No matching emojis found.</div>';
                    return;
                }
                renderNextChunk();
            });
        }

        function renderNextChunk() {
            if (renderedCount >= currentRenderList.length) return;
            const nextSlice = currentRenderList.slice(renderedCount, renderedCount + CHUNK_SIZE);
            renderedCount += nextSlice.length;

            const fragment = document.createDocumentFragment();
            for (let i = 0; i < nextSlice.length; i++) {
                fragment.appendChild(createEmojiElement(nextSlice[i]));
            }
            keyboard.appendChild(fragment);

            requestAnimationFrame(() => {
                if (emojiArea.scrollHeight <= emojiArea.clientHeight + 80 && renderedCount < currentRenderList.length) {
                    renderNextChunk();
                }
            });
        }

        function createEmojiElement(emoji) {
            const div = document.createElement('div');
            div.className = 'emoji-item';

            const imgBox = document.createElement('div');
            imgBox.className = 'emoji-img-box';

            const mediaEl = document.createElement('img');
            mediaEl.src = TRANSPARENT_PIXEL;
            mediaEl.dataset.eid = emoji.id;
            mediaEl.dataset.realSrc = emoji.image_url;

            if (imageBlobCache[emoji.id]) {
                applyLoadedImage(mediaEl, imgBox, imageBlobCache[emoji.id]);
            } else {
                lazyImgObserver.observe(mediaEl);
            }

            imgBox.appendChild(mediaEl);

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = emoji._label;

            div.appendChild(imgBox);
            div.appendChild(label);

            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => insertEmoji(emoji);
            return div;
        }

        function createCategoryButton(packId, imageUrl, eid) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onmousedown = (e) => e.preventDefault();
            div.onclick = () => filterEmojis(packId, div);

            const wrap = document.createElement('div');
            wrap.className = 'cat-img-wrap';

            const mediaEl = document.createElement('img');
            mediaEl.src = TRANSPARENT_PIXEL;
            enqueueEmojiImage(eid, imageUrl, mediaEl, wrap);

            wrap.appendChild(mediaEl);

            const label = document.createElement('div');
            label.className = 'normal-emoji';
            label.textContent = packId.replace(/^Pack_/, '').substring(0, 8);

            div.appendChild(wrap);
            div.appendChild(label);
            categoryRow.appendChild(div);
        }

        function clearActiveChips() {
            document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active-chip'));
        }

        function filterEmojis(categoryId, clickedBtn) {
            if (searchInput.value.trim()) {
                searchInput.value = '';
                searchClearBtn.classList.remove('visible');
            }
            clearActiveChips();
            activeCategory = categoryId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            if (clickedBtn) clickedBtn.classList.add('active-cat');

            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function runQuickChip(term, btnEl) {
            const isAlreadyActive = btnEl.classList.contains('active-chip');
            clearActiveChips();
            if (isAlreadyActive) {
                clearSearch();
                return;
            }
            btnEl.classList.add('active-chip');
            searchInput.value = term;
            searchClearBtn.classList.add('visible');
            executeFastSearch(term);
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function isFuzzy(word, q) {
            if (q.length < 3 || Math.abs(word.length - q.length) > 2) return false;
            let wi = 0, qi = 0, err = 0;
            while (wi < word.length && qi < q.length) {
                if (word[wi] === q[qi]) { wi++; qi++; }
                else {
                    err++;
                    if (err > 1) return false;
                    if (word.length > q.length) wi++;
                    else if (q.length > word.length) qi++;
                    else { wi++; qi++; }
                }
            }
            return true;
        }

        function executeFastSearch(rawQ) {
            const terms = SEARCH_ALIASES[rawQ] || [rawQ];
            const exactList = [];
            const prefixList = [];
            const substringList = [];

            const total = allEmojis.length;
            for (let i = 0; i < total; i++) {
                const em = allEmojis[i];
                const tags = em._tags;
                if (!tags && em.symbol !== rawQ) continue;

                let matchedTier = 0;
                const words = em._words;

                for (let t = 0; t < terms.length; t++) {
                    const term = terms[t];
                    if (em.symbol === term) { matchedTier = 1; break; }
                    if (!tags.includes(term)) continue;

                    for (let w = 0; w < words.length; w++) {
                        if (words[w] === term) { matchedTier = 1; break; }
                        if (words[w].startsWith(term)) { matchedTier = Math.max(matchedTier, 2); }
                    }
                    if (matchedTier === 0) matchedTier = 3;
                    if (matchedTier === 1) break;
                }

                if (matchedTier === 1) exactList.push(em);
                else if (matchedTier === 2) prefixList.push(em);
                else if (matchedTier === 3) substringList.push(em);
            }

            let combined = exactList.concat(prefixList, substringList);

            if (combined.length < 10 && rawQ.length >= 3) {
                const seen = new Set(combined.map(x => x.id));
                for (let i = 0; i < total; i++) {
                    const em = allEmojis[i];
                    if (seen.has(em.id)) continue;
                    const words = em._words;
                    for (let w = 0; w < words.length; w++) {
                        if (isFuzzy(words[w], rawQ)) {
                            combined.push(em);
                            break;
                        }
                    }
                }
            }

            setGridList(combined, true);
        }

        let searchDebounce;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            clearActiveChips();
            const rawQ = searchInput.value.trim().toLowerCase().replace(/^#/, '');
            searchClearBtn.classList.toggle('visible', rawQ.length > 0);

            if (!rawQ) {
                const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
                setGridList(filtered, false);
                return;
            }

            searchDebounce = setTimeout(() => {
                executeFastSearch(rawQ);
            }, 100);
        });

        function clearSearch() {
            searchInput.value = '';
            searchClearBtn.classList.remove('visible');
            clearActiveChips();
            const filtered = allEmojis.filter(e => (e.pack_id || 'Other') === activeCategory);
            setGridList(filtered, false);
        }

        function insertEmoji(emoji) {
            const imgNode = document.createElement('img');
            imgNode.className = 'inline-premium-emoji';
            imgNode.dataset.emojiId = emoji.id;
            imgNode.dataset.imgPath = emoji.image_url || `/api/image/${emoji.id}.webp`;
            imgNode.alt = emoji.symbol || '⭐';
            imgNode.src = TRANSPARENT_PIXEL;
            enqueueEmojiImage(emoji.id, imgNode.dataset.imgPath, imgNode, null);

            const spaceNode = document.createTextNode(' ');

            let range = savedRange;
            if (!range || !draft.contains(range.commonAncestorContainer)) {
                range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
            }

            range.deleteContents();
            range.insertNode(spaceNode);
            range.insertNode(imgNode);

            range.setStartAfter(spaceNode);
            range.collapse(true);
            savedRange = range.cloneRange();

            if (document.activeElement === draft) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }

            updateStats();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function escapeHtmlText(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function serializeNodes(parentNode) {
            let out = '';
            const children = Array.from(parentNode.childNodes);

            for (let i = 0; i < children.length; i++) {
                const node = children[i];

                if (node.nodeType === 3) {
                    const cleanText = node.nodeValue
                        .replace(/\u200B/g, '')
                        .replace(/\u00A0/g, ' ');
                    out += escapeHtmlText(cleanText);
                } else if (node.nodeType === 1) {
                    const tag = node.tagName.toUpperCase();

                    if (tag === 'IMG' && node.classList.contains('inline-premium-emoji')) {
                        const eid = node.dataset.emojiId;
                        out += eid ? `[${eid}]` : (node.alt || '⭐');
                    } else if (tag === 'BR') {
                        const isLastInBlock = (i === children.length - 1) &&
                            (parentNode !== draft && (parentNode.tagName === 'DIV' || parentNode.tagName === 'P' || parentNode.tagName === 'BLOCKQUOTE'));
                        if (!isLastInBlock) {
                            out += '\n';
                        }
                    } else if (tag === 'DIV' || tag === 'P') {
                        if (out.length > 0 && !out.endsWith('\n')) {
                            out += '\n';
                        }
                        const inner = serializeNodes(node);
                        if (inner === '' || inner === '\n') {
                            out += '\n';
                        } else {
                            out += inner;
                            if (!out.endsWith('\n') && i < children.length - 1) {
                                out += '\n';
                            }
                        }
                    } else if (tag === 'BLOCKQUOTE') {
                        const isExpandable = node.hasAttribute('expandable');
                        const innerQuote = serializeNodes(node).replace(/^\n+|\n+$/g, '');
                        if (innerQuote.trim().length > 0) {
                            if (out.length > 0 && !out.endsWith('\n')) {
                                out += '\n';
                            }
                            const openTag = isExpandable ? '<blockquote expandable>' : '<blockquote>';
                            out += `${openTag}${innerQuote}</blockquote>`;
                            const nextNode = children[i + 1];
                            if (nextNode && !(nextNode.nodeType === 1 && nextNode.tagName === 'BR')) {
                                out += '\n';
                            }
                        }
                    } else if (tag === 'A') {
                        const href = (node.getAttribute('href') || '').replace(/"/g, '&quot;');
                        const inner = serializeNodes(node);
                        if (href && inner.trim().length > 0) {
                            out += `<a href="${href}">${inner}</a>`;
                        } else {
                            out += inner;
                        }
                    } else {
                        const tagMap = {
                            'B': 'b', 'STRONG': 'b',
                            'I': 'i', 'EM': 'i',
                            'U': 'u', 'INS': 'u',
                            'S': 's', 'STRIKE': 's', 'DEL': 's',
                            'CODE': 'code',
                            'TG-SPOILER': 'tg-spoiler'
                        };
                        const mapped = tagMap[tag];
                        const inner = serializeNodes(node);
                        if (mapped) {
                            if (inner.replace(/\n/g, '').trim().length === 0) {
                                out += inner;
                            } else {
                                const leadMatch = inner.match(/^\n+/);
                                const trailMatch = inner.match(/\n+$/);
                                const lead = leadMatch ? leadMatch[0] : '';
                                const trail = trailMatch ? trailMatch[0] : '';
                                const core = inner.slice(lead.length, inner.length - trail.length);
                                out += `${lead}<${mapped}>${core}</${mapped}>${trail}`;
                            }
                        } else {
                            out += inner;
                        }
                    }
                }
            }
            return out;
        }

        function serializeDraftForBot(containerEl) {
            let raw = serializeNodes(containerEl);
            raw = raw
                .replace(/\n{3,}(<blockquote)/g, '\n\n$1')
                .replace(/(<\/blockquote>)\n{3,}/g, '$1\n\n')
                .replace(/^\n+|\n+$/g, '');
            return raw;
        }

        function saveToHistory(botFormattedText) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            history.unshift({
                botText: botFormattedText,
                date: new Date().toLocaleString()
            });
            if (history.length > 25) history.pop();
            localStorage.setItem('postHistory', JSON.stringify(history));
        }

        function hydrateBotTextToVisualHTML(botText) {
            if (!botText) return '';
            let html = botText
                .replace(/<blockquote expandable>/gi, '<blockquote expandable class="is-collapsed">')
                .replace(/<\/blockquote>\n/gi, '</blockquote>')
                .replace(/\n/g, '<br>');

            return html.replace(/\[(\d{17,21})\]/g, (match, eid) => {
                const imgPath = `/api/image/${eid}.webp`;
                return `<img class="inline-premium-emoji" data-emoji-id="${eid}" data-img-path="${imgPath}" src="${TRANSPARENT_PIXEL}" alt="⭐">`;
            });
        }

        function hydrateImagesInContainer(container) {
            container.querySelectorAll('img.inline-premium-emoji').forEach(img => {
                const eid = img.dataset.emojiId;
                const path = img.dataset.imgPath || `/api/image/${eid}.webp`;
                if (eid) enqueueEmojiImage(eid, path, img, null);
            });
        }

        function showHistory() {
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('historyView').style.display = 'flex';
            document.getElementById('settingsMenu').classList.remove('show');

            const list = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');

            if (history.length === 0) {
                list.innerHTML = '<div class="state-msg">No saved history yet.</div>';
                return;
            }

            list.innerHTML = '';
            history.forEach((item, index) => {
                const rawBotText = item.botText || item.text || '';
                const card = document.createElement('div');
                card.className = 'history-card';
                card.onclick = (e) => {
                    if (e.target.closest('a')) return;
                    const bq = e.target.closest('blockquote[expandable]');
                    if (bq) {
                        const rect = bq.getBoundingClientRect();
                        if (e.clientX >= rect.right - 36 && e.clientY >= rect.bottom - 32) {
                            e.stopPropagation();
                            bq.classList.toggle('is-collapsed');
                            return;
                        }
                    }
                    loadHistoryItem(index);
                };

                const visualHTML = hydrateBotTextToVisualHTML(rawBotText);
                card.innerHTML = `
                    <div class="history-header">
                        <span>POST #${history.length - index}</span>
                        <span>${item.date || ''}</span>
                    </div>
                    <div class="history-text">${visualHTML}</div>
                    <div style="font-size: 11px; color: var(--accent); margin-top: 8px; font-weight: 700;">Tap to restore into studio ✏️</div>
                `;
                list.appendChild(card);
                hydrateImagesInContainer(card);
            });
        }

        function loadHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('postHistory') || '[]');
            const item = history[index];
            if (item) {
                const rawBotText = item.botText || item.text || '';
                draft.innerHTML = hydrateBotTextToVisualHTML(rawBotText);
                hydrateImagesInContainer(draft);
                showMain();

                const range = document.createRange();
                range.selectNodeContents(draft);
                range.collapse(false);
                savedRange = range.cloneRange();

                updateStats();
                updateToolbarActiveState();
                if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('medium');
            }
        }

        function showMain() {
            document.getElementById('historyView').style.display = 'none';
            document.getElementById('mainView').style.display = 'flex';
        }

        function clearHistory() {
            if (confirm("Clear all post history?")) {
                localStorage.removeItem('postHistory');
                showHistory();
            }
        }

        function sendData() {
            const hasEmoji = draft.querySelector('img.inline-premium-emoji') !== null;
            if (!draft.innerText.replace(/\u200B/g, '').trim() && !hasEmoji) {
                safeAlert('Write something or add an emoji first!');
                return;
            }

            const finalBotText = serializeDraftForBot(draft);
            saveToHistory(finalBotText);
            Telegram.sendData(JSON.stringify({
                text: finalBotText,
                disable_web_page_preview: true
            }));
        }

        loadEmojis();
    </script>
