<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Post Manager (Lite)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        /* 🔥 No extra effects, flat and minimal for Android 🔥 */
        :root { --bg: #121212; --surface: #1e1e1e; --border: #333333; --accent: #0088cc; --text: #ffffff; --text-secondary: #aaaaaa; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 12px; padding-bottom: 80px; min-height: 100vh; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
        .header p { font-size: 12px; color: var(--text-secondary); }
        
        .section { margin-bottom: 16px; }
        .section-title { font-size: 12px; font-weight: bold; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
        
        /* Removed all shadows and transitions */
        .draft-area { width: 100%; height: 120px; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 15px; resize: none; font-family: inherit; }
        .draft-area:focus { outline: none; border-color: var(--accent); }
        
        .category-row { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 10px; margin-bottom: 5px; scrollbar-width: none; }
        .category-row::-webkit-scrollbar { display: none; }
        
        /* Simplified category items */
        .category-item { flex: 0 0 auto; background: var(--surface); border: 2px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px; }
        .category-item.active-cat { border-color: var(--accent); background: #2a2a2a; }
        .category-item .media-container { width: 28px; height: 28px; object-fit: contain; pointer-events: none; display: block; }
        .category-item .normal-emoji { font-size: 14px; margin-top: 2px; }
        
        .emoji-wrapper { background: var(--surface); border: 2px solid var(--border); border-radius: 8px; padding: 8px; }
        
        /* Removed animation for expanding */
        .emoji-scroll-area { max-height: 150px; overflow-y: auto; }
        .emoji-scroll-area.expanded { max-height: 55vh; }
        
        /* Simplified grid and items to reduce DOM stress */
        .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
        .emoji-item { 
            background: #222; 
            border: 1px solid #333; 
            border-radius: 6px; 
            padding: 4px; 
            text-align: center; 
            contain: content; /* Hardware optimization */
        }
        .hidden-emoji { display: none !important; }
        .emoji-item:active { background: #444; border-color: var(--text-secondary); }
        .emoji-item .media-container { width: 28px; height: 28px; display: block; margin: 0 auto; pointer-events: none; }
        .emoji-item .label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; overflow: hidden; }
        
        .toggle-btn { width: 100%; background: transparent; border: none; color: var(--accent); font-size: 14px; font-weight: bold; padding: 10px 0; cursor: pointer; border-top: 1px solid var(--border); margin-top: 5px; }
        .loading, .empty, .error { text-align: center; padding: 20px 10px; color: var(--text-secondary); font-size: 13px; grid-column: 1 / -1; }
        
        .send-btn { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); padding: 12px; border-top: 1px solid var(--border); z-index: 100; }
        .send-btn button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; }
        .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Premium Post Manager</h1>
        <p>Lite Version for Android</p>
    </div>

    <div class="section">
        <div class="stats">
            <span class="section-title">Draft</span>
            <span id="charCount">0 chars</span>
        </div>
        <textarea class="draft-area" id="draft" placeholder="Type here... Tap emojis to insert."></textarea>
    </div>

    <div class="section">
        <div class="section-title">Emoji Packs</div>
        <div class="category-row" id="categoryRow"></div>
    </div>

    <div class="section">
        <div class="section-title">Keyboard</div>
        <div class="emoji-wrapper">
            <div class="emoji-scroll-area" id="emojiArea">
                <div id="emojiKeyboard" class="emoji-grid"></div>
            </div>
            <button class="toggle-btn" onclick="toggleEmojiList()">
                <span id="toggleText">Show All Emojis 🔽</span>
            </button>
        </div>
    </div>

    <div class="send-btn">
        <button id="sendBtn" onclick="sendData()">📤 Send Post</button>
    </div>

    <script>
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        Telegram.ready();

        const urlParams = new URLSearchParams(window.location.search);
        const apiBase = urlParams.get('api');

        const draft = document.getElementById('draft');
        const keyboard = document.getElementById('emojiKeyboard');
        const charCount = document.getElementById('charCount');
        const emojiArea = document.getElementById('emojiArea');
        const toggleText = document.getElementById('toggleText');
        const categoryRow = document.getElementById('categoryRow');
        
        let emojiMap = {};
        let emojiCounter = 1;
        let currentPage = 1;
        const PAGE_LIMIT = 100; 
        let catMap = {}; 
        let activeCategory = 'all';

        const lottieInstances = new Map();
        const parsedJsonCache = new Map(); 

        const initQueue = [];
        let isQueueRunning = false;

        // Even faster processing limit for normal Androids
        function processInitQueue() {
            if (initQueue.length === 0) {
                isQueueRunning = false;
                return;
            }
            isQueueRunning = true;
            const start = performance.now();
            
            while (initQueue.length > 0 && (performance.now() - start < 2)) {
                const el = initQueue.shift();
                if (el.dataset.inView === 'true' && !lottieInstances.has(el)) {
                    try {
                        const b64Data = el.dataset.rawAnim.split(',')[1];
                        let animationData = parsedJsonCache.get(b64Data);
                        if (!animationData) {
                            let jsonStr;
                            try { jsonStr = decodeURIComponent(escape(atob(b64Data))); }
                            catch(e) { jsonStr = atob(b64Data); }
                            animationData = JSON.parse(jsonStr);
                            parsedJsonCache.set(b64Data, animationData);
                        }
                        const anim = lottie.loadAnimation({
                            container: el,
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            animationData: animationData
                        });
                        lottieInstances.set(el, anim);
                    } catch (e) {}
                }
            }
            requestAnimationFrame(processInitQueue);
        }

        const lazyLoadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const el = entry.target;
                if (entry.isIntersecting) {
                    el.dataset.inView = 'true';
                    el.style.visibility = 'visible'; 
                    
                    if (el.dataset.rawAnim) {
                        if (!lottieInstances.has(el)) {
                            initQueue.push(el);
                            if (!isQueueRunning) processInitQueue();
                        } else {
                            lottieInstances.get(el).play();
                        }
                    } else if (el.tagName === 'IMG' && el.dataset.src) {
                        el.src = el.dataset.src; el.removeAttribute('data-src');
                    }
                } else {
                    el.dataset.inView = 'false';
                    if (lottieInstances.has(el)) {
                        lottieInstances.get(el).pause();
                        el.style.visibility = 'hidden'; 
                    }
                }
            });
        }, { root: emojiArea, rootMargin: '100px 0px', threshold: 0 });

        function toggleEmojiList() {
            emojiArea.classList.toggle('expanded');
            if (emojiArea.classList.contains('expanded')) {
                toggleText.textContent = "Show Less Emojis 🔼";
            } else {
                toggleText.textContent = "Show All Emojis 🔽";
                emojiArea.scrollTop = 0; 
            }
        }

        draft.addEventListener('input', () => { charCount.textContent = draft.value.length + ' chars'; });

        function setupAllCategoryButton() {
            const allBtn = document.createElement('div');
            allBtn.className = 'category-item active-cat';
            allBtn.innerHTML = `<div style="font-size: 20px;">🌐</div><div class="normal-emoji">All</div>`;
            allBtn.onclick = () => filterEmojis('all', allBtn);
            categoryRow.appendChild(allBtn);
        }

        async function loadEmojis() {
            if (!apiBase) { keyboard.innerHTML = '<div class="error">❌ Missing API URL</div>'; return; }
            setupAllCategoryButton();
            fetchNextPage(); 
        }

        async function fetchNextPage() {
            try {
                const res = await fetch(`${apiBase}/api/emojis?page=${currentPage}&limit=${PAGE_LIMIT}`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                let data = JSON.parse(await res.text());

                if (data.length > 0) {
                    appendEmojisToGrid(data);
                    currentPage++;
                    setTimeout(fetchNextPage, 500); 
                } else if (currentPage === 1) {
                    keyboard.innerHTML = '<div class="empty">No emojis found.</div>';
                }
            } catch (err) {
                if (currentPage === 1) keyboard.innerHTML = `<div class="error">❌ ${err.message}</div>`;
            }
        }

        function createMediaElement(url, isCategory = false) {
            let mediaEl;
            if (url && url.startsWith('data:application/json')) {
                mediaEl = document.createElement('div');
                mediaEl.className = 'media-container';
                if (!isCategory) {
                    mediaEl.dataset.rawAnim = url; 
                } else {
                    try {
                        const b64Data = url.split(',')[1];
                        let jsonStr;
                        try { jsonStr = decodeURIComponent(escape(atob(b64Data))); } catch(e) { jsonStr = atob(b64Data); }
                        lottie.loadAnimation({ container: mediaEl, renderer: 'svg', loop: true, autoplay: true, animationData: JSON.parse(jsonStr) });
                    } catch(e) {}
                }
            } else {
                mediaEl = document.createElement('img');
                mediaEl.className = 'media-container';
                if (!isCategory) mediaEl.dataset.src = url || ""; else mediaEl.src = url || "";
            }
            return mediaEl;
        }

        function appendEmojisToGrid(data) {
            const gridFragment = document.createDocumentFragment();
            data.forEach((emoji) => {
                const sym = emoji.symbol || '⭐';
                const packId = emoji.pack_id || 'Other'; 
                
                if (!catMap[packId]) {
                    catMap[packId] = true; 
                    createCategoryButton(packId, emoji.image_url);
                }

                const div = document.createElement('div');
                div.className = 'emoji-item';
                div.dataset.category = packId; 
                if (activeCategory !== 'all' && packId !== activeCategory) div.classList.add('hidden-emoji');

                const mediaEl = createMediaElement(emoji.image_url, false);
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = sym; 

                div.appendChild(mediaEl); div.appendChild(label);
                div.onclick = () => insertEmoji(emoji);
                gridFragment.appendChild(div);
                lazyLoadObserver.observe(mediaEl);
            });
            keyboard.appendChild(gridFragment);
        }

        function createCategoryButton(packId, imageUrl) {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.onclick = () => filterEmojis(packId, div);
            const mediaEl = createMediaElement(imageUrl, true);
            div.appendChild(mediaEl);
            categoryRow.appendChild(div);
        }

        function filterEmojis(categoryId, clickedBtn) {
            activeCategory = categoryId; 
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active-cat'));
            clickedBtn.classList.add('active-cat');
            document.querySelectorAll('#emojiKeyboard .emoji-item').forEach(item => {
                if (categoryId === 'all' || item.dataset.category === categoryId) item.classList.remove('hidden-emoji');
                else item.classList.add('hidden-emoji');
            });
            if (categoryId !== 'all' && !emojiArea.classList.contains('expanded')) toggleEmojiList();
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.selectionChanged();
        }

        function insertEmoji(emoji) {
            const shortCode = `[${emoji.symbol || '⭐'}${emojiCounter}]`;
            emojiMap[shortCode] = `[${emoji.id}]`;
            emojiCounter++;
            const textToInsert = shortCode + ' ';
            const start = draft.selectionStart;
            const end = draft.selectionEnd;
            const text = draft.value;
            draft.value = text.substring(0, start) + textToInsert + text.substring(end);
            draft.focus();
            draft.setSelectionRange(start + textToInsert.length, start + textToInsert.length);
            draft.dispatchEvent(new Event('input'));
            if (Telegram.HapticFeedback) Telegram.HapticFeedback.impactOccurred('light');
        }

        function sendData() {
            let text = draft.value;
            if (!text.trim()) { Telegram.showAlert('Please type something!'); return; }
            for (let code in emojiMap) { text = text.split(code).join(emojiMap[code]); }
            Telegram.sendData(JSON.stringify({ text: text }));
        }

        loadEmojis();
    </script>
</body>
</html>
